SECTIONS.push({id:22,icon:'🔬',tags:['RP','BIO'],
title:[`Required practical: plant responses`,`Práctica obligatoria: respuestas de las plantas`,`Pratique obligatoire : réponses des plantes`],
chunks:[
[`<b>Aim:</b> investigate the effect of <b>light</b> OR <b>gravity</b> on the growth of newly germinated seedlings. <b>Your results must include two things:</b> (1) <b>length measurements</b> (in mm) and (2) accurate <b>labelled biological drawings</b>. <b>Example hypothesis:</b> "Seedlings lit from one side will grow towards the light, because auxin collects on the shaded side and makes the cells there elongate more."`,`<b>Objetivo:</b> investigar el efecto de la <b>luz</b> O de la <b>gravedad</b> en el crecimiento de plántulas recién germinadas. <b>Tus resultados deben incluir dos cosas:</b> (1) <b>mediciones de longitud</b> (length measurements, en mm) y (2) <b>dibujos biológicos rotulados</b> (labelled biological drawings) precisos. <b>Ejemplo de hipótesis:</b> «Las plántulas iluminadas por un lado crecerán hacia la luz, porque la auxina se acumula en el lado sombreado y hace que allí las células se alarguen más».`,`<b>But :</b> étudier l'effet de la <b>lumière</b> OU de la <b>gravité</b> sur la croissance de plantules qui viennent de germer. <b>Tes résultats doivent inclure deux choses :</b> (1) des <b>mesures de longueur</b> (length measurements, en mm) et (2) des <b>dessins biologiques légendés</b> (labelled biological drawings) précis. <b>Exemple d'hypothèse :</b> « Les plantules éclairées d'un seul côté pousseront vers la lumière, parce que l'auxine s'accumule du côté à l'ombre et y fait davantage s'allonger les cellules. »`],
[`<b>Method (light):</b> germinate seedlings (e.g. cress or mustard) on damp cotton wool. Choose seedlings of a similar size. <b>1.</b> Measure the <b>starting length</b> of each shoot with a ruler (mm) and draw one seedling. <b>2.</b> Put one group in a box with a light source on <b>one side</b> only. Put the control group in the dark (or in even light from all sides). <b>3.</b> Leave for a set time (e.g. 3 days) and keep the cotton wool damp. <b>4.</b> Measure the <b>final length</b> of each shoot (mm) and draw the seedling again. <b>5.</b> Calculate the <b>increase in length</b> = final length − starting length.`,`<b>Método (luz):</b> germina plántulas (p. ej. berro o mostaza) sobre algodón húmedo. Elige plántulas de tamaño parecido. <b>1.</b> Mide la <b>longitud inicial</b> (starting length) de cada tallo con una regla (mm) y dibuja una plántula. <b>2.</b> Pon un grupo en una caja con luz por <b>un solo lado</b>. Pon el grupo de control a oscuras (o con luz uniforme por todos los lados). <b>3.</b> Déjalas un tiempo fijo (p. ej. 3 días) y mantén húmedo el algodón. <b>4.</b> Mide la <b>longitud final</b> (final length) de cada tallo (mm) y dibuja de nuevo la plántula. <b>5.</b> Calcula el <b>aumento de longitud</b> (increase in length) = longitud final − longitud inicial.`,`<b>Méthode (lumière) :</b> fais germer des plantules (par ex. cresson ou moutarde) sur du coton humide. Choisis des plantules de taille semblable. <b>1.</b> Mesure la <b>longueur initiale</b> (starting length) de chaque tige avec une règle (mm) et dessine une plantule. <b>2.</b> Place un groupe dans une boîte avec une source de lumière d'<b>un seul côté</b>. Place le groupe témoin dans le noir (ou en lumière uniforme de tous les côtés). <b>3.</b> Laisse pendant une durée fixe (par ex. 3 jours) et garde le coton humide. <b>4.</b> Mesure la <b>longueur finale</b> (final length) de chaque tige (mm) et dessine à nouveau la plantule. <b>5.</b> Calcule l'<b>augmentation de longueur</b> (increase in length) = longueur finale − longueur initiale.`],
[`<b>Method (gravity):</b> grow seedlings on damp cotton wool in the dark. Measure the starting length of each <b>root</b> and <b>shoot</b> (mm). Keep one group <b>upright</b> and turn another group on its <b>side</b> (horizontal). After a set time (e.g. 3 days) measure the final length of the roots and shoots again and calculate the increase in length. Draw a seedling from each group. Roots grow <b>down</b> (towards gravity) and shoots grow <b>up</b> (away from gravity).`,`<b>Método (gravedad):</b> cultiva plántulas sobre algodón húmedo en la oscuridad. Mide la longitud inicial de cada <b>raíz</b> (root) y de cada <b>tallo</b> (shoot) (mm). Deja un grupo en posición <b>vertical</b> y coloca otro <b>de lado</b> (horizontal). Pasado un tiempo fijo (p. ej. 3 días) mide otra vez la longitud final de raíces y tallos y calcula el aumento de longitud. Dibuja una plántula de cada grupo. Las raíces crecen <b>hacia abajo</b> (hacia la gravedad) y los tallos crecen <b>hacia arriba</b> (en sentido contrario a la gravedad).`,`<b>Méthode (gravité) :</b> fais pousser des plantules sur du coton humide dans le noir. Mesure la longueur initiale de chaque <b>racine</b> (root) et de chaque <b>tige</b> (shoot) (mm). Garde un groupe à la <b>verticale</b> et couche un autre groupe sur le <b>côté</b> (horizontal). Après une durée fixe (par ex. 3 jours), mesure à nouveau la longueur finale des racines et des tiges et calcule l'augmentation de longueur. Dessine une plantule de chaque groupe. Les racines poussent <b>vers le bas</b> (vers la gravité) et les tiges poussent <b>vers le haut</b> (à l'opposé de la gravité).`],
[`<b>Optional extra evidence:</b> you may also measure the <b>angle of bending</b> of each shoot or root with a protractor (or from a photograph). The angle can support your conclusion, but it does <b>not replace</b> the length measurements.`,`<b>Evidencia adicional opcional:</b> también puedes medir el <b>ángulo de curvatura</b> (angle of bending) de cada tallo o raíz con un transportador (o en una fotografía). El ángulo puede apoyar tu conclusión, pero <b>no sustituye</b> las mediciones de longitud.`,`<b>Preuve supplémentaire facultative :</b> tu peux aussi mesurer l'<b>angle de courbure</b> (angle of bending) de chaque tige ou racine avec un rapporteur (ou sur une photo). L'angle peut appuyer ta conclusion, mais il ne <b>remplace pas</b> les mesures de longueur.`],
[`<b>Variables:</b> IV = direction of light (or orientation of the seedlings: upright / on their side). DV = <b>increase in length</b> of the shoot or root (mm). Control variables = species, age and starting size of seedlings, temperature, volume of water, time left, light intensity (or darkness for the gravity test).`,`<b>Variables:</b> IV = dirección de la luz (u orientación de las plántulas: vertical / de lado). DV = <b>aumento de longitud</b> del tallo o de la raíz (mm). Variables de control = especie, edad y tamaño inicial de las plántulas, temperatura, volumen de agua, tiempo, intensidad de luz (u oscuridad en la prueba de gravedad).`,`<b>Variables :</b> IV = direction de la lumière (ou orientation des plantules : à la verticale / couchées). DV = <b>augmentation de longueur</b> de la tige ou de la racine (mm). Variables contrôlées = espèce, âge et taille initiale des plantules, température, volume d'eau, durée, intensité lumineuse (ou obscurité pour le test de gravité).`],
[`<b>Sample size and repeats:</b> use at least <b>10 seedlings per group</b>. Seedlings vary, so a larger sample makes the results more reliable. Each seedling is a repeat. Calculate the <b>mean</b> increase in length for each group: mean = total ÷ number of seedlings. Ignore any <b>anomalous</b> result in the mean.`,`<b>Tamaño de la muestra y repeticiones:</b> usa al menos <b>10 plántulas por grupo</b>. Las plántulas varían, así que una muestra mayor hace los resultados más fiables. Cada plántula es una repetición. Calcula la <b>media</b> (mean) del aumento de longitud de cada grupo: media = suma ÷ número de plántulas. No incluyas en la media ningún resultado <b>anómalo</b> (anomalous).`,`<b>Taille de l'échantillon et répétitions :</b> utilise au moins <b>10 plantules par groupe</b>. Les plantules varient : un échantillon plus grand rend les résultats plus fiables. Chaque plantule est une répétition. Calcule la <b>moyenne</b> (mean) de l'augmentation de longueur de chaque groupe : moyenne = total ÷ nombre de plantules. Ne garde pas dans la moyenne un résultat <b>aberrant</b> (anomalous).`],
[`<b>Example results table</b> (simple example with 5 seedlings per group; you should use at least 10). Lengths are shoot lengths in mm.<div class="tw"><table><tr><th rowspan="2">Seedling</th><th colspan="3">Light from one side</th><th colspan="3">Darkness (control)</th></tr><tr><th>Start (mm)</th><th>After 3 days (mm)</th><th>Increase (mm)</th><th>Start (mm)</th><th>After 3 days (mm)</th><th>Increase (mm)</th></tr><tr><td>1</td><td>10</td><td>34</td><td>24</td><td>10</td><td>42</td><td>32</td></tr><tr><td>2</td><td>11</td><td>36</td><td>25</td><td>12</td><td>45</td><td>33</td></tr><tr><td>3</td><td>10</td><td>33</td><td>23</td><td>11</td><td>40</td><td>29</td></tr><tr><td>4</td><td>12</td><td>38</td><td>26</td><td>10</td><td>41</td><td>31</td></tr><tr><td>5</td><td>11</td><td>35</td><td>24</td><td>12</td><td>44</td><td>32</td></tr><tr><th colspan="3">Mean increase</th><th>24.4</th><th colspan="2"></th><th>31.4</th></tr></table></div>Increase = after 3 days − start. Mean (light) = 122 ÷ 5 = 24.4 mm. Mean (dark) = 157 ÷ 5 = 31.4 mm.`,`<b>Tabla de resultados de ejemplo</b> (ejemplo sencillo con 5 plántulas por grupo; tú debes usar al menos 10). Las longitudes son longitudes del tallo en mm.<div class="tw"><table><tr><th rowspan="2">Plántula</th><th colspan="3">Luz por un lado</th><th colspan="3">Oscuridad (control)</th></tr><tr><th>Inicio (mm)</th><th>Tras 3 días (mm)</th><th>Aumento (mm)</th><th>Inicio (mm)</th><th>Tras 3 días (mm)</th><th>Aumento (mm)</th></tr><tr><td>1</td><td>10</td><td>34</td><td>24</td><td>10</td><td>42</td><td>32</td></tr><tr><td>2</td><td>11</td><td>36</td><td>25</td><td>12</td><td>45</td><td>33</td></tr><tr><td>3</td><td>10</td><td>33</td><td>23</td><td>11</td><td>40</td><td>29</td></tr><tr><td>4</td><td>12</td><td>38</td><td>26</td><td>10</td><td>41</td><td>31</td></tr><tr><td>5</td><td>11</td><td>35</td><td>24</td><td>12</td><td>44</td><td>32</td></tr><tr><th colspan="3">Aumento medio</th><td>24,4</td><th colspan="2"></th><td>31,4</td></tr></table></div>Aumento = tras 3 días − inicio. Media (luz) = 122 ÷ 5 = 24,4 mm. Media (oscuridad) = 157 ÷ 5 = 31,4 mm.`,`<b>Exemple de tableau de résultats</b> (exemple simple avec 5 plantules par groupe ; tu dois en utiliser au moins 10). Les longueurs sont des longueurs de tige en mm.<div class="tw"><table><tr><th rowspan="2">Plantule</th><th colspan="3">Lumière d'un côté</th><th colspan="3">Obscurité (témoin)</th></tr><tr><th>Début (mm)</th><th>Après 3 jours (mm)</th><th>Augmentation (mm)</th><th>Début (mm)</th><th>Après 3 jours (mm)</th><th>Augmentation (mm)</th></tr><tr><td>1</td><td>10</td><td>34</td><td>24</td><td>10</td><td>42</td><td>32</td></tr><tr><td>2</td><td>11</td><td>36</td><td>25</td><td>12</td><td>45</td><td>33</td></tr><tr><td>3</td><td>10</td><td>33</td><td>23</td><td>11</td><td>40</td><td>29</td></tr><tr><td>4</td><td>12</td><td>38</td><td>26</td><td>10</td><td>41</td><td>31</td></tr><tr><td>5</td><td>11</td><td>35</td><td>24</td><td>12</td><td>44</td><td>32</td></tr><tr><th colspan="3">Augmentation moyenne</th><td>24,4</td><th colspan="2"></th><td>31,4</td></tr></table></div>Augmentation = après 3 jours − début. Moyenne (lumière) = 122 ÷ 5 = 24,4 mm. Moyenne (obscurité) = 157 ÷ 5 = 31,4 mm.`],
[`<b>Graph:</b> the IV is in categories (light from one side / darkness), so draw a <b>bar chart</b> of the <b>mean increase in length (mm)</b>. Put the IV on the x-axis and the DV with units on the y-axis.<div class="svgbox">${barSvg([[`Light from one side`,24.4],[`Darkness (control)`,31.4]],`Mean increase in length (mm)`,40,`Bar chart of mean increase in shoot length: light from one side 24.4 mm, darkness 31.4 mm`)}</div>`,`<b>Gráfica:</b> la IV son categorías (luz por un lado / oscuridad), así que dibuja un <b>diagrama de barras</b> (bar chart) del <b>aumento medio de longitud (mm)</b>. Pon la IV en el eje x y la DV con unidades en el eje y.<div class="svgbox">${barSvg([[`Light from one side`,24.4],[`Darkness (control)`,31.4]],`Mean increase in length (mm)`,40,`Bar chart of mean increase in shoot length: light from one side 24.4 mm, darkness 31.4 mm`)}</div>`,`<b>Graphique :</b> la IV est en catégories (lumière d'un côté / obscurité) ; trace donc un <b>diagramme en barres</b> (bar chart) de l'<b>augmentation moyenne de longueur (mm)</b>. Mets la IV sur l'axe x et la DV avec ses unités sur l'axe y.<div class="svgbox">${barSvg([[`Light from one side`,24.4],[`Darkness (control)`,31.4]],`Mean increase in length (mm)`,40,`Bar chart of mean increase in shoot length: light from one side 24.4 mm, darkness 31.4 mm`)}</div>`],
[`<b>Conclusion:</b> use the numbers. Example: "The mean increase in shoot length was 24.4 mm in light from one side and 31.4 mm in darkness, so the seedlings in one-sided light grew 7.0 mm less in length." Link to auxin: in light from one side, auxin moves to the shaded side, where cells elongate more, so the shoot <b>bends towards the light</b> (optional angle data can show this). Say whether the results support the hypothesis. <b>Evaluation:</b> seedlings differ; small differences in starting size; lengths are hard to measure exactly on a curved shoot. <b>Improvements:</b> more seedlings, measure to the nearest 0.5 mm, take photographs and measure with software, control temperature and light intensity more carefully.`,`<b>Conclusión:</b> usa los números. Ejemplo: «El aumento medio de longitud del tallo fue 24,4 mm con luz por un lado y 31,4 mm en oscuridad, así que las plántulas con luz por un lado crecieron 7,0 mm menos en longitud». Relaciónalo con la auxina: con luz por un lado, la auxina se mueve al lado sombreado, donde las células se alargan más, y el tallo se <b>curva hacia la luz</b> (los datos opcionales del ángulo pueden mostrarlo). Di si los resultados apoyan la hipótesis. <b>Evaluación:</b> las plántulas son distintas; pequeñas diferencias en el tamaño inicial; es difícil medir con exactitud la longitud de un tallo curvado. <b>Mejoras:</b> más plántulas, medir con precisión de 0,5 mm, tomar fotografías y medir con software, controlar mejor la temperatura y la intensidad de la luz.`,`<b>Conclusion :</b> utilise les chiffres. Exemple : « L'augmentation moyenne de longueur de la tige a été de 24,4 mm avec une lumière d'un côté et de 31,4 mm dans l'obscurité ; les plantules éclairées d'un côté ont donc grandi de 7,0 mm de moins en longueur. » Relie à l'auxine : avec une lumière d'un côté, l'auxine se déplace du côté à l'ombre, où les cellules s'allongent davantage, et la tige se <b>courbe vers la lumière</b> (les données facultatives d'angle peuvent le montrer). Dis si les résultats confirment l'hypothèse. <b>Évaluation :</b> les plantules diffèrent ; petites différences de taille initiale ; il est difficile de mesurer exactement la longueur d'une tige courbée. <b>Améliorations :</b> plus de plantules, mesurer au 0,5 mm près, prendre des photos et mesurer avec un logiciel, mieux contrôler la température et l'intensité lumineuse.`],
[`<b>Safe and ethical use of plants:</b> wash your hands after handling seedlings, cotton wool and compost. Do not eat the seedlings. Keep lamps away from water and do not touch hot bulbs; use electrical equipment safely. Damp cotton wool can grow mould — do not sniff it and dispose of it as your teacher instructs. Use only the number of seedlings you need and dispose of them responsibly.`,`<b>Uso seguro y ético de las plantas:</b> lávate las manos después de manipular las plántulas, el algodón y la tierra. No comas las plántulas. Mantén las lámparas lejos del agua y no toques las bombillas calientes; usa el equipo eléctrico con seguridad. El algodón húmedo puede criar moho: no lo huelas y deséchalo como indique tu profesor. Usa solo las plántulas que necesites y deséchalas de forma responsable.`,`<b>Utilisation sûre et éthique des plantes :</b> lave-toi les mains après avoir manipulé les plantules, le coton et le terreau. Ne mange pas les plantules. Éloigne les lampes de l'eau et ne touche pas les ampoules chaudes ; utilise le matériel électrique en sécurité. Le coton humide peut moisir : ne le renifle pas et jette-le comme l'indique ton professeur. Utilise seulement le nombre de plantules nécessaire et élimine-les de façon responsable.`],
[`<b>Accurate labelled biological drawings</b> are part of the required results. Draw one seedling at the start and one at the end of the investigation. <b>Good drawing rules:</b> use a <b>sharp pencil</b>; make the drawing <b>large</b> (fill most of the space); use <b>clear, single, continuous lines</b>; <b>no shading</b> and <b>no colouring</b>; draw only what you can see, in the correct proportions; label with <b>straight label lines</b> (drawn with a ruler) that touch the part and do not cross; write the <b>labels</b> (e.g. shoot, root, leaves/cotyledons) neatly outside the drawing; add a <b>title</b> and, if needed, the magnification or scale.`,`Los <b>dibujos biológicos rotulados y precisos</b> (accurate labelled biological drawings) forman parte de los resultados obligatorios. Dibuja una plántula al principio y otra al final de la investigación. <b>Normas de un buen dibujo:</b> usa un <b>lápiz afilado</b> (sharp pencil); haz el dibujo <b>grande</b> (large: ocupa casi todo el espacio); usa <b>líneas claras, únicas y continuas</b>; <b>sin sombreado</b> (no shading) y <b>sin color</b> (no colouring); dibuja solo lo que ves, con las proporciones correctas; rotula con <b>líneas de rotulación rectas</b> (straight label lines, trazadas con regla) que toquen la parte y no se crucen; escribe los <b>rótulos</b> (labels; p. ej. shoot, root, hojas/cotiledones) con claridad fuera del dibujo; añade un <b>título</b> (title) y, si hace falta, el aumento o la escala.`,`Les <b>dessins biologiques légendés et précis</b> (accurate labelled biological drawings) font partie des résultats obligatoires. Dessine une plantule au début et une à la fin de l'investigation. <b>Règles d'un bon dessin :</b> utilise un <b>crayon bien taillé</b> (sharp pencil) ; fais un dessin <b>grand</b> (large : il occupe presque tout l'espace) ; utilise des <b>traits nets, uniques et continus</b> ; <b>sans ombrage</b> (no shading) et <b>sans couleur</b> (no colouring) ; dessine seulement ce que tu vois, avec les bonnes proportions ; légende avec des <b>traits de légende droits</b> (straight label lines, tracés à la règle) qui touchent la partie et ne se croisent pas ; écris les <b>légendes</b> (labels ; par ex. shoot, root, feuilles/cotylédons) proprement à l'extérieur du dessin ; ajoute un <b>titre</b> (title) et, si nécessaire, le grossissement ou l'échelle.`]],
vocab:V(`Seedling|Plántula|Plantule; Germination|Germinación|Germination; Hypothesis|Hipótesis|Hypothèse; Independent variable|Variable independiente|Variable indépendante; Dependent variable|Variable dependiente|Variable dépendante; Control variable|Variable de control|Variable contrôlée; Sample size|Tamaño de la muestra|Taille de l'échantillon; Length measurement|Medición de longitud|Mesure de longueur; Increase in length|Aumento de longitud|Augmentation de longueur; Shoot|Tallo (brote)|Tige (pousse); Root|Raíz|Racine; Protractor|Transportador|Rapporteur; Mean|Media|Moyenne; Anomalous result|Resultado anómalo|Résultat aberrant; Reliable|Fiable|Fiable; Biological drawing|Dibujo biológico|Dessin biologique; Label line|Línea de rotulación|Trait de légende; Title|Título|Titre; Magnification|Aumento|Grossissement`),
acts:[{type:'choose',title:[`Design the investigation`,`Diseña la investigación`,`Conçois l'investigation`],instr:I_CHOOSE,scenarios:[
{title:[`A student investigates the effect of LIGHT DIRECTION on shoot growth. Which are control variables?`,`Un estudiante investiga el efecto de la DIRECCIÓN DE LA LUZ en el crecimiento del tallo. ¿Cuáles son variables de control?`,`Un élève étudie l'effet de la DIRECTION DE LA LUMIÈRE sur la croissance de la tige. Quelles sont les variables contrôlées ?`],opts:[
[[`Type and age of seedlings`,`Tipo y edad de las plántulas`,`Type et âge des plantules`],true,[`Must be the same so only light direction changes.`,`Deben ser iguales para que solo cambie la dirección de la luz.`,`Doivent être identiques pour que seule la direction de la lumière change.`]],
[[`Temperature and volume of water`,`Temperatura y volumen de agua`,`Température et volume d'eau`],true,[`These also affect growth, so keep them the same.`,`También afectan al crecimiento, así que se mantienen iguales.`,`Ils influencent aussi la croissance : on les garde identiques.`]],
[[`Direction of the light`,`Dirección de la luz`,`Direction de la lumière`],false,[`This is the independent variable, the thing you change.`,`Es la variable independiente, lo que cambias.`,`C'est la variable indépendante, ce que tu changes.`]],
[[`Increase in length of the shoots (mm)`,`Aumento de longitud de los tallos (mm)`,`Augmentation de longueur des tiges (mm)`],false,[`This is the dependent variable, the thing you measure.`,`Es la variable dependiente, lo que mides.`,`C'est la variable dépendante, ce que tu mesures.`]]]},
{title:[`Which choices make the results MORE reliable?`,`¿Qué decisiones hacen los resultados MÁS fiables?`,`Quels choix rendent les résultats PLUS fiables ?`],opts:[
[[`Use at least 10 seedlings in each group`,`Usar al menos 10 plántulas en cada grupo`,`Utiliser au moins 10 plantules par groupe`],true,[`A bigger sample reduces the effect of unusual seedlings.`,`Una muestra mayor reduce el efecto de plántulas atípicas.`,`Un échantillon plus grand réduit l'effet des plantules atypiques.`]],
[[`Calculate a mean increase in length for each group`,`Calcular el aumento medio de longitud de cada grupo`,`Calculer l'augmentation moyenne de longueur de chaque groupe`],true,[`A mean gives a fair overall result.`,`La media da un resultado global justo.`,`La moyenne donne un résultat global équitable.`]],
[[`Use only one seedling because it is easier`,`Usar solo una plántula porque es más fácil`,`Utiliser une seule plantule car c'est plus simple`],false,[`One seedling could be unusual, so results would be unreliable.`,`Una sola plántula podría ser atípica: resultados poco fiables.`,`Une seule plantule pourrait être atypique : résultats peu fiables.`]],
[[`Change the temperature between groups`,`Cambiar la temperatura entre grupos`,`Changer la température entre les groupes`],false,[`That adds another variable and makes the test unfair.`,`Añade otra variable y hace la prueba injusta.`,`Cela ajoute une variable et rend le test injuste.`]]]},
{title:[`Which measurements MUST be in the results of this required practical?`,`¿Qué mediciones DEBEN estar en los resultados de esta práctica obligatoria?`,`Quelles mesures DOIVENT figurer dans les résultats de cette pratique obligatoire ?`],opts:[
[[`Length of the seedlings (mm)`,`Longitud de las plántulas (mm)`,`Longueur des plantules (mm)`],true,[`Length measurements are a required result.`,`Las mediciones de longitud son un resultado obligatorio.`,`Les mesures de longueur sont un résultat obligatoire.`]],

{type:'qset',title:[`Data analysis: seedling length measurements`,`Análisis de datos: mediciones de longitud de las plántulas`,`Analyse de données : mesures de longueur des plantules`],instr:[`A student measured the length of five shoots at the start and after 3 days in light from one side. Answer the questions.`,`Un estudiante midió la longitud de cinco tallos al principio y tras 3 días con luz por un lado. Responde a las preguntas.`,`Un élève a mesuré la longueur de cinq tiges au début et après 3 jours avec une lumière d'un seul côté. Réponds aux questions.`],

help:[`start length = length at the beginning · increase = final − start · mean = total ÷ number of seedlings · dependent variable = what you measure · millimetre (mm) = unit of length.`,`longitud inicial (start length) = longitud al principio · aumento (increase) = final − inicial · media (mean) = suma ÷ número de plántulas · variable dependiente (dependent variable) = lo que mides · milímetro (mm) = unidad de longitud.`,`longueur initiale (start length) = longueur au début · augmentation (increase) = finale − initiale · moyenne (mean) = total ÷ nombre de plantules · variable dépendante (dependent variable) = ce que tu mesures · millimètre (mm) = unité de longueur.`],
qs:[
{t:'mcq',q:`Calculate the increase in length of seedling 1.`,o:[`10 mm`,`24 mm`,`34 mm`,`44 mm`],a:1,e:[`Increase = 34 − 10 = 24 mm.`,`Aumento = 34 − 10 = 24 mm.`,`Augmentation = 34 − 10 = 24 mm.`]},
{t:'mcq',q:`Calculate the mean increase in length of the five seedlings.`,o:[`22.0 mm`,`24.4 mm`,`27.6 mm`,`122 mm`],a:1,e:[`Increases: 24, 25, 23, 26, 24. Total = 122. Mean = 122 ÷ 5 = 24.4 mm.`,`Aumentos: 24, 25, 23, 26, 24. Total = 122. Media = 122 ÷ 5 = 24,4 mm.`,`Augmentations : 24, 25, 23, 26, 24. Total = 122. Moyenne = 122 ÷ 5 = 24,4 mm.`]},
{t:'mcq',q:`Which measurement is the dependent variable in this investigation?`,o:[`Direction of the light`,`Increase in shoot length (mm)`,`Temperature of the room`,`Type of seedling`],a:1,e:[`The increase in shoot length is what is measured, so it is the dependent variable. Direction of light is the independent variable; the others are control variables.`,`El aumento de longitud del tallo es lo que se mide, así que es la variable dependiente. La dirección de la luz es la independiente; las otras son variables de control.`,`L'augmentation de longueur de la tige est ce qui est mesuré : c'est la variable dépendante. La direction de la lumière est la variable indépendante ; les autres sont des variables contrôlées.`]},
{t:'mcq',q:`The student also measured the angle of bending. What is the best way to use this?`,o:[`As optional extra evidence to support the length measurements`,`Instead of the length measurements`,`As a control variable`,`It should not be used at all`],a:0,e:[`The angle can add supporting evidence, but length measurements are still required.`,`El ángulo puede añadir evidencia de apoyo, pero las mediciones de longitud siguen siendo obligatorias.`,`L'angle peut ajouter une preuve complémentaire, mais les mesures de longueur restent obligatoires.`]}
]}],
qs:[
{t:'mcq',q:`Why should a student use many seedlings in each group?`,o:[`To make the results more reliable`,`To change the independent variable`,`To remove all control variables`,`To make the seedlings grow faster`],a:0,e:[`More seedlings reduce the effect of unusual results and allow a reliable mean.`,`Más plántulas reducen el efecto de resultados atípicos y permiten una media fiable.`,`Plus de plantules réduisent l'effet des résultats atypiques et permettent une moyenne fiable.`]},
{t:'data',q:`Increase in shoot length (mm) of five seedlings in the light test: 30, 32, 31, 60, 29. Which is anomalous and what is the mean without it?`,table:[[`Seedling`,`1`,`2`,`3`,`4`,`5`],[`Increase in length (mm)`,`30`,`32`,`31`,`60`,`29`]],o:[`60 mm; mean 30.5 mm`,`29 mm; mean 30.5 mm`,`60 mm; mean 36.4 mm`,`31 mm; mean 30.5 mm`],a:0,e:[`60 mm is far from the others. (30 + 32 + 31 + 29) ÷ 4 = 122 ÷ 4 = 30.5 mm.`,`60 mm está lejos de los demás. (30 + 32 + 31 + 29) ÷ 4 = 122 ÷ 4 = 30,5 mm.`,`60 mm est très éloigné des autres. (30 + 32 + 31 + 29) ÷ 4 = 122 ÷ 4 = 30,5 mm.`]},
{t:'tf',q:`The angle of bending can replace length measurements in this required practical.`,a:false,e:[`False. Length measurements are required. The angle of bending is only optional extra evidence.`,`Falso. Las mediciones de longitud son obligatorias. El ángulo de curvatura es solo evidencia adicional opcional.`,`Faux. Les mesures de longueur sont obligatoires. L'angle de courbure n'est qu'une preuve supplémentaire facultative.`]},
{t:'tf',q:`In a biological drawing you should shade the structures to make them look realistic.`,a:false,e:[`False. Use clear, continuous lines only, with no shading or colouring.`,`Falso. Usa solo líneas claras y continuas, sin sombreado ni color.`,`Faux. Utilise seulement des traits nets et continus, sans ombrage ni couleur.`]},
{t:'mcq',q:`Which label line is correct on a biological drawing?`,o:[`A straight line drawn with a ruler that touches the part`,`A curly arrow that crosses another label line`,`A line that stops in the space beside the part`,`A coloured line`],a:0,e:[`Label lines must be straight, touch the part being labelled and never cross.`,`Las líneas de rotulación deben ser rectas, tocar la parte rotulada y no cruzarse nunca.`,`Les traits de légende doivent être droits, toucher la partie légendée et ne jamais se croiser.`]}

{id:'e1',ao:'AO1',type:'AO1',marks:2,sec:1,tags:[],cmd:'State',q:`State what is meant by homeostasis.`,h:T_(`Think: what does the body regulate, and why? (Conditions vary a little; they do not stay exactly the same.)`,`Piensa: ¿qué regula el cuerpo y por qué? (Las condiciones varían un poco; no se quedan exactamente iguales.)`,`Pense : que régule le corps, et pourquoi ? (Les conditions varient un peu ; elles ne restent pas exactement identiques.)`),p:[`Regulation / control of the internal conditions (of a cell or organism) to maintain optimum conditions for function`,`In response to internal and external changes`]},
{id:'e2',ao:'AO1',type:'AO1',marks:4,sec:3,tags:[],cmd:'Describe',q:`Describe the pathway of a reflex arc from stimulus to response.`,h:T_(`Name the parts in order: receptor, three types of neurone (one after another), effector.`,`Nombra las partes en orden: receptor, tres tipos de neurona (una tras otra), efector.`,`Nomme les parties dans l'ordre : récepteur, trois types de neurones (l'un après l'autre), effecteur.`),p:[`Stimulus detected by a receptor`,`Impulse travels along a sensory neurone to the CNS (spinal cord)`,`Relay neurone passes the impulse on (across synapses)`,`Motor neurone carries the impulse to the effector (muscle/gland), which produces the response`]},
{id:'e3',ao:'AO2',type:'AO2',marks:3,sec:3,tags:[],cmd:'Explain',q:`A person touches a hot pan and pulls their hand away before feeling any pain. Explain why this reflex is useful.`,h:T_(`Use the words "automatic", "rapid" and "protect".`,`Usa las palabras «automatic», «rapid» y «protect».`,`Utilise les mots « automatic », « rapid » et « protect ».`),p:[`Reflex is automatic / does not involve conscious thought`,`So the response is very rapid (short pathway)`,`This protects the body from damage / burns`]},
{id:'e4',ao:'maths',type:'maths',marks:3,sec:4,tags:['RP'],cmd:'Calculate',q:`A student measured reaction time using a ruler drop. The times are shown. One result is anomalous. Calculate the mean reaction time without the anomaly.`,table:[[`Repeat`,`1`,`2`,`3`,`4`,`5`],[`Reaction time (s)`,`0.21`,`0.19`,`0.20`,`0.36`,`0.20`]],h:T_(`First find the result that does not fit the pattern. Then add the others and divide by how many there are.`,`Primero encuentra el resultado que no encaja. Luego suma los otros y divide entre cuántos son.`,`Trouve d'abord le résultat qui ne colle pas. Additionne ensuite les autres et divise par leur nombre.`),p:[`Anomaly identified: 0.36 s`,`0.21 + 0.19 + 0.20 + 0.20 = 0.80`,`0.80 ÷ 4 = 0.20 s`]},
{id:'e5',ao:'AO3',type:'practical',marks:4,sec:4,tags:['RP'],cmd:'Suggest',q:`A student investigates whether listening to loud music affects reaction time using the ruler-drop method. (a) Give two control variables. (b) Suggest one way the investigation could be improved.`,h:T_(`Control variables are things you keep the same. An improvement should make results more accurate or reliable.`,`Las variables de control son cosas que mantienes iguales. Una mejora debe hacer los resultados más exactos o fiables.`,`Les variables contrôlées sont ce que tu gardes identique. Une amélioration doit rendre les résultats plus exacts ou fiables.`),p:[`(a) any two: same ruler / same person dropping / same height held / same hand / same time of day / same volume level`,`(b) any one: use a computer-based reaction timer / test more people / more repeats and calculate a mean`,`Each answer must say how it improves accuracy or reliability`]},
{id:'e6',ao:'AO2',type:'AO2',marks:4,sec:8,tags:['BIO'],cmd:'Explain',q:`Explain how the body responds when body temperature rises above 37 °C.`,h:T_(`Two responses: one in the sweat glands, one in blood vessels. Say what each does to heat loss.`,`Dos respuestas: una en las glándulas sudoríparas y otra en los vasos sanguíneos. Di qué hace cada una con la pérdida de calor.`,`Deux réponses : une dans les glandes sudoripares, une dans les vaisseaux sanguins. Dis ce que chacune fait à la perte de chaleur.`),p:[`Temperature receptors / thermoregulatory centre (hypothalamus) detect the change`,`Sweat glands release more sweat; evaporation of sweat cools the skin`,`Vasodilation: blood vessels near the skin widen`,`More blood flows near the surface so more heat is lost to the surroundings`]},
{id:'e7',ao:'AO2',type:'AO2',marks:4,sec:7,tags:['BIO'],cmd:'Explain',q:`Explain how the eye focuses on a near object.`,h:T_(`Start with the ciliary muscles, then the ligaments, then the lens.`,`Empieza con los músculos ciliares, luego los ligamentos y después el cristalino.`,`Commence par les muscles ciliaires, puis les ligaments, puis le cristallin.`),p:[`Ciliary muscles contract`,`Suspensory ligaments loosen`,`Lens becomes thicker (more curved)`,`Light is refracted more so it focuses on the retina`]},
{id:'e8',ao:'AO2',type:'AO2',marks:4,sec:10,tags:['HT'],cmd:'Explain',q:`Explain how the body responds when blood glucose concentration rises after a meal.`,h:T_(`Name the organ, the hormone and what happens in the liver.`,`Nombra el órgano, la hormona y lo que ocurre en el hígado.`,`Nomme l'organe, l'hormone et ce qui se passe dans le foie.`),p:[`Pancreas detects the rise in blood glucose`,`Pancreas releases insulin into the blood`,`Insulin causes glucose to move from the blood into cells`,`Liver (and muscles) convert glucose to glycogen, so blood glucose falls`]},
{id:'e9',ao:'maths',type:'maths',marks:2,sec:10,tags:[],cmd:'Calculate',q:`After insulin treatment, a patient's blood glucose concentration fell from 12.0 mmol/dm³ to 8.4 mmol/dm³. Calculate the percentage decrease.`,h:T_(`Percentage change = change ÷ original × 100.`,`Cambio porcentual = cambio ÷ valor original × 100.`,`Variation en pourcentage = variation ÷ valeur initiale × 100.`),p:[`12.0 − 8.4 = 3.6`,`3.6 ÷ 12.0 × 100 = 30 %`]},
{id:'e10',ao:'AO3',type:'AO3',marks:4,sec:11,tags:[],cmd:'Compare',q:`Compare Type 1 diabetes and Type 2 diabetes.`,h:T_(`Write about the cause AND the treatment of both. Use "whereas".`,`Escribe sobre la causa Y el tratamiento de ambas. Usa «whereas».`,`Écris sur la cause ET le traitement des deux. Utilise « whereas ».`),p:[`Both cause blood glucose to be too high (not controlled)`,`Type 1: pancreas produces little/no insulin, whereas in Type 2 body cells respond poorly to insulin`,`Type 1 is treated with insulin injections, whereas Type 2 is treated mainly with diet, exercise and/or medication`,`Type 2 is linked to obesity`]},
{id:'e11',ao:'AO2',type:'AO2',marks:4,sec:13,tags:['BIO','HT'],cmd:'Explain',q:`A person does not drink for many hours. Explain how ADH helps to keep the water content of their blood within suitable limits.`,h:T_(`Say what the blood is like, which gland releases ADH, and what the kidney tubules do.`,`Di cómo está la sangre, qué glándula libera la ADH y qué hacen los túbulos del riñón.`,`Dis comment est le sang, quelle glande libère l'ADH et ce que font les tubules rénaux.`),p:[`Blood becomes too concentrated (water content falls) and this is detected by the brain`,`Pituitary gland releases more ADH`,`Kidney tubules become more permeable to water`,`More water is reabsorbed, so a small volume of concentrated urine is produced`]},
{id:'e12',ao:'AO3',type:'AO3',marks:6,sec:14,tags:['BIO'],cmd:'Evaluate',q:`Evaluate the use of dialysis and kidney transplants to treat kidney failure.`,h:T_(`Give advantages and disadvantages of BOTH treatments, then finish with a judgement.`,`Da ventajas y desventajas de AMBOS tratamientos y termina con una valoración.`,`Donne les avantages et les inconvénients des DEUX traitements, puis termine par un jugement.`),p:[`Dialysis: available immediately / no need to wait for a donor / no rejection`,`Dialysis: time-consuming (hours, several times a week) / must continue long-term / restricted diet`,`Transplant: long-term cure, freedom from regular dialysis`,`Transplant: shortage of donors / risk of rejection / need for immunosuppressant drugs (infection risk) / major surgery`,`Conclusion that weighs the points (e.g. transplant is better long-term if a suitable donor is available; dialysis is needed while waiting)`]},
{id:'e13',ao:'AO2',type:'AO2',marks:3,sec:16,tags:[],cmd:'State',q:`The table shows the level of two hormones during a 28-day menstrual cycle (arbitrary units). Identify hormone A and hormone B and state one effect of hormone A.`,table:[[`Day`,`1`,`7`,`14`,`21`,`28`],[`Hormone A`,`2`,`3`,`20`,`2`,`2`],[`Hormone B`,`1`,`1`,`2`,`15`,`2`]],h:T_(`Which hormone peaks at ovulation? Which one peaks when the lining is being maintained?`,`¿Qué hormona alcanza su máximo en la ovulación? ¿Cuál cuando se mantiene el revestimiento?`,`Quelle hormone culmine à l'ovulation ? Laquelle quand la muqueuse est maintenue ?`),p:[`A = LH (peaks at ovulation, day 14)`,`B = progesterone (peaks after ovulation, day 21)`,`Effect of LH: causes ovulation (release of the egg)`]},
{id:'e14',ao:'AO3',type:'AO3',marks:6,sec:18,tags:['HT'],cmd:'Evaluate',q:`Evaluate the use of IVF to treat infertility.`,h:T_(`Give at least two advantages and two disadvantages, then a short conclusion.`,`Da al menos dos ventajas y dos desventajas y una breve conclusión.`,`Donne au moins deux avantages et deux inconvénients, puis une courte conclusion.`),p:[`Advantage: allows couples who cannot conceive naturally to have a baby`,`Advantage: fertility hormones (FSH and LH) can increase the number of eggs available`,`Disadvantage: low success rate / may need several attempts`,`Disadvantage: emotionally and physically stressful; hormone side effects`,`Disadvantage: multiple births are riskier for mother and babies; cost`,`A conclusion that weighs the advantages against the disadvantages`]},
{id:'e15',ao:'AO2',type:'AO2',marks:4,sec:20,tags:['BIO'],cmd:'Explain',q:`Explain why a shoot grows towards a light that shines from one side only.`,h:T_(`Say where auxin moves to and what it does to cells there.`,`Di adónde se mueve la auxina y qué hace a las células de esa zona.`,`Dis où l'auxine se déplace et ce qu'elle fait aux cellules de cette zone.`),p:[`Auxin (a plant hormone) moves to the shaded side of the shoot`,`Auxin makes cells on the shaded side elongate (grow longer) more`,`The shaded side grows faster than the lit side`,`So the shoot bends towards the light (positive phototropism)`]},
{id:'e16',ao:'AO3',type:'practical',marks:5,sec:22,tags:['RP','BIO'],cmd:'Describe',q:`Describe how you could investigate the effect of gravity on the growth of newly germinated seedlings.`,h:T_(`Include what you change, what you measure (length!), and what you keep the same. Say how many seedlings.`,`Incluye lo que cambias, lo que mides (¡la longitud!) y lo que mantienes igual. Di cuántas plántulas.`,`Indique ce que tu changes, ce que tu mesures (la longueur !) et ce que tu gardes identique. Précise combien de plantules.`),p:[`Place seedlings horizontally (on their side) and keep a control group upright`,`Keep in the dark / same temperature, same water, same type and age of seedlings (control variables)`,`Measure the length of the shoots/roots (mm) with a ruler at the start and after a set time (e.g. 2–3 days) and calculate the increase in length`,`Use at least 10 seedlings per group and calculate a mean (angle of bending with a protractor may be added as extra evidence)`,`Draw a labelled biological drawing of a seedling (sharp pencil, clear lines, no shading, straight label lines, title)`]},
{id:'e17',ao:'AO2',type:'AO2',marks:3,sec:19,tags:['HT'],cmd:'Explain',q:`Explain how negative feedback controls the level of thyroxine in the blood.`,h:T_(`Talk about the pituitary gland, TSH and what happens when thyroxine is high.`,`Habla de la hipófisis, la TSH y qué ocurre cuando la tiroxina está alta.`,`Parle de l'hypophyse, de la TSH et de ce qui se passe quand la thyroxine est élevée.`),p:[`Low thyroxine causes the pituitary gland to release more TSH, which stimulates the thyroid to release thyroxine`,`High thyroxine level inhibits (reduces) the release of TSH`,`So thyroxine level falls back to normal (the change is reversed)`]}

function rulerUI(cb){

 const data={dom:[],non:[]};
 const wrap=h('div');

 }

 const med=a=>{const s=a.slice().sort((x,y)=>x-y),m=Math.floor(s.length/2);return s.length%2?s[m]:(s[m-1]+s[m])/2};
 function stats(arr){

  const flags=arr.map(x=>m!=null&&(x.d>1.5*m||x.d<0.5*m));
  const keep=arr.filter((x,i)=>!flags[i]);
  const mean=a=>a.length?a.reduce((s,x)=>s+x.d,0)/a.length:null;
  return{flags,meanAll:mean(arr),meanKeep:mean(keep),any:flags.some(Boolean)};
 }
 function drawRes(){
  res.innerHTML='';
  const out={};
  [['dom',u('rdDom')],['non',u('rdNon')]].forEach(([k,label])=>{
   const arr=data[k];if(!arr.length)return;
   const s=stats(arr);out[k]=s;
   const tb=h('table',{class:'tbl'},h('tr',null,h('th',null,'#'),h('th',null,u('rdDist')),h('th',null,u('rdTime')),h('th',null,'')));
   arr.forEach((x,i)=>tb.append(h('tr',null,h('td',null,i+1),h('td',null,x.d.toFixed(1)),h('td',null,x.t.toFixed(3)),h('td',null,s.flags[i]?'⚠ '+u('rdAnom'):''))));
   res.append(h('h4',null,label),h('div',{class:'tw'},tb),
    h('p',null,u('rdMean')+': ',h('b',null,s.meanAll.toFixed(1)+' cm'),s.any?[' · '+u('rdMeanNo')+': ',h('b',null,s.meanKeep.toFixed(1)+' cm')]:''));

   const bars=h('div',{class:'hc-lin'},h('p',{class:'mk'},u('rdChart')));

/* optional language help for exam questions: command word + key terms only (never a full translation) */
const CMDW={State:['indica (respuesta corta y directa, sin explicar)','indique (réponse courte et directe, sans expliquer)'],Describe:['describe (di qué ocurre, sin dar razones)','décris (dis ce qui se passe, sans donner de raisons)'],Explain:['explica dando razones o mecanismos (por qué / cómo)','explique en donnant des raisons ou des mécanismes (pourquoi / comment)'],Compare:['compara (semejanzas y diferencias)','compare (ressemblances et différences)'],Evaluate:['evalúa (ventajas, desventajas y conclusión)','évalue (avantages, inconvénients et conclusion)'],Calculate:['calcula (muestra el procedimiento y la unidad)','calcule (montre ton raisonnement et l\'unité)'],Suggest:['sugiere (usa tus conocimientos en una situación nueva)','propose (utilise tes connaissances dans une situation nouvelle)'],Name:['nombra (da la palabra científica correcta)','nomme (donne le mot scientifique exact)']};
const XW=[['reduc(?:e|es|ed|tion)','reducir / disminuir','réduire / diminuer'],['increase[sd]?','aumentar','augmenter'],['decrease[sd]?','disminuir','diminuer'],['falls?|fell','bajar / bajada','baisser / baisse'],['rises?|rose','subir / subida','monter / hausse'],['releases?','liberar','libérer'],['detects?','detectar','détecter'],['affects?','afectar','affecter'],['improvements?|improve','mejora / mejorar','amélioration / améliorer'],['limits','límites','limites'],['water content','contenido de agua','teneur en eau'],['pathway','camino / trayecto','trajet'],['anomalous','anómalo','aberrant'],['suitable','adecuado','adapté'],['whether','si','si'],['shaded','sombreado','à l\'ombre'],['germinated','germinadas','germées']];
function langHelpEl(q){
 const k=fl();if(!VMAP)vBuild();
 const d=h('div',{class:'fb info',style:'display:none'},h('b',null,'Language help '+FLG[k]+':'));
 const ul_=h('ul');
 const c=CMDW[q.cmd];if(c)ul_.append(h('li',null,h('b',null,q.cmd),' = ',h('span',{lang:LC[k]},c[k-1])));
 let t=q.q+' '+(q.table?q.table.map(r=>r.join(' ')).join(' '):'');
 const rows=[];const seenR=new Set();
 Object.values(VMAP).forEach(r=>{if(!seenR.has(r)){seenR.add(r);rows.push(r)}});
 rows.sort((a,b)=>b[0].length-a[0].length);
 const found=[];
 rows.forEach(r=>{const key=r[0].replace(/\s*\([^)]*\)/g,'').trim();if(key.length<4||/\//.test(key))return;
  const re=new RegExp('\\b'+key.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(?:s|es)?\\b','i');const m=t.match(re);
  if(m){{let tr_=String(r[k]).replace(/\s*\([^)]*\)\s*$/,'');if(_plain(tr_)!==_plain(m[0]))found.push([m[0].toLowerCase(),/^[A-ZÀ-Ý][a-zà-ÿ]/.test(tr_)?tr_.charAt(0).toLowerCase()+tr_.slice(1):tr_]);}t=t.replace(re,'\u00a7')}});
 XW.forEach(x=>{const re=new RegExp('\\b(?:'+x[0]+')\\b','i');const m=t.match(re);if(m){found.push([m[0].toLowerCase(),x[k]])}});
 found.slice(0,10).forEach(f=>ul_.append(h('li',null,f[0],' = ',h('span',{lang:LC[k]},f[1]))));
 d.append(ul_);return d;
}

function quizPage(){
 const page=h('div');const box=h('div');
 page.append(h('h1',null,'🏆 '+u('quiz')),box);
 function setup(){
  box.innerHTML='';
  const total=SECTIONS.reduce((n,s)=>n+s.qs.length,0);
  box.append(h('p',null,u('quizSetup')),tlDiv(U.quizSetup),h('div',{class:'btnrow'},
   h('button',{class:'btn',type:'button',onclick:()=>run(10)},'10 '+u('questions')),
   h('button',{class:'btn',type:'button',onclick:()=>run(20)},'20 '+u('questions')),
   h('button',{class:'btn',type:'button',onclick:()=>run(0)},'🏔 '+u('fullUnit')+' ('+total+')')));
  if(P.final.length){const last=P.final[P.final.length-1];box.append(h('p',{class:'mut'},u('lastScore')+': '+last.score+'/'+last.n+' ('+Math.round(last.score/last.n*100)+'%)'))}
 }
 function run(n){
  let pool=[];SECTIONS.forEach(s=>s.qs.forEach(q=>pool.push({q,s})));
  pool=shuffle(pool);if(n)pool=pool.slice(0,n);
  const res=[];let i=0;
  function show(){
   box.innerHTML='';
   if(i>=pool.length)return finish();
   const {q,s}=pool[i];
   box.append(h('p',{class:'mk'},u('question')+' '+(i+1)+' / '+pool.length),progressBar(Math.round(i/pool.length*100)));
   const nb=h('div',{class:'btnrow'});
   box.append(renderQ(q,{single:true,topic:tr(s.title),onDone:ok=>{res.push({s,ok});nb.append(h('button',{class:'btn',type:'button',onclick:()=>{i++;show()}},i+1>=pool.length?u('seeResults'):u('nextQ')))}}),nb);
  }
  function finish(){
   const score=res.filter(r=>r.ok).length,n_=res.length,pct=Math.round(score/n_*100);
   P.final.push({date:new Date().toISOString().slice(0,10),n:n_,score});P.final=P.final.slice(-10);save();
   const by={};res.forEach(r=>{const o=by[r.s.id]||(by[r.s.id]={s:r.s,ok:0,t:0});o.t++;if(r.ok)o.ok++});
   const good=Object.values(by).filter(o=>o.ok===o.t),weak=Object.values(by).filter(o=>o.ok<o.t);
   box.append(h('div',{class:'card'},h('div',{class:'big-score'},score+' / '+n_),h('div',{class:'big-score'},pct+'%'),progressBar(pct),h('p',null,pct>=80?u('resHigh'):(pct>=50?u('resMid'):u('resLow')))));
   box.append(h('div',{class:'card'},h('h3',null,'✅ '+u('topicsGood')),good.length?h('ul',null,good.map(o=>h('li',null,tr(o.s.title)+' ('+o.ok+'/'+o.t+')'))):h('p',{class:'mut'},'—')));
   box.append(h('div',{class:'card'},h('h3',null,'🔁 '+u('topicsWeak')),weak.length?h('div',{class:'btnrow'},weak.map(o=>h('a',{class:'btn sec',style:'text-decoration:none',href:'#s/'+o.s.id},tr(o.s.title)+' ('+o.ok+'/'+o.t+') →'))):h('p',null,'🎉 '+u('noWeak'))));
   box.append(h('div',{class:'btnrow'},h('button',{class:'btn',type:'button',onclick:setup},'↺ '+u('again'))));
  }
  show();
 }
 setup();return page;
}
