<style>

button,select,input,textarea{font:inherit}
button{cursor:pointer}

.svgbox{background:#fff;border:2px solid var(--line);border-radius:12px;padding:12px;margin:8px 0;overflow-x:auto;text-align:center}

.svgbox svg[data-tall]{max-height:470px}
svg text{font-family:inherit}
svg .dg-h{font-size:17px;font-weight:700;fill:#12213b}
svg .dg-l{font-size:14px;font-weight:700;fill:#12213b}
svg .dg-s{font-size:13px;font-weight:400;fill:#12213b}
svg .dg-cap{font-size:13px;font-weight:400;fill:#475569}
svg .dg-t{font-size:12px;font-weight:400;fill:#475569}
svg .dg-red{fill:#be123c}svg .dg-teal{fill:#0f766e}svg .dg-or{fill:#b45309}svg .dg-brn{fill:#92400e}
.swipe{display:none;font-size:.8rem;color:var(--mut);margin-top:4px;text-align:center}
@media(max-width:700px){.svgbox .swipe{display:block}}
.svgbox:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
.hit{fill:transparent;stroke:transparent;stroke-width:26;cursor:pointer;pointer-events:all}
.badge .bh{fill:transparent!important;stroke:none!important}
.hs{cursor:pointer;stroke:#12213b;stroke-width:3;transition:filter .2s}
.c1{fill:#fde68a}.c2{fill:#bfdbfe}.c3{fill:#fecaca}.c4{fill:#bbf7d0}.c5{fill:#e9d5ff}.c6{fill:#fed7aa}.c7{fill:#fff}.c8{fill:#111827}
.ln{fill:none!important;stroke-linecap:round;stroke-width:10}
.ln.s1{stroke:#0b5fa5}.ln.s2{stroke:#7c3aed}.ln.s3{stroke:#0f766e}.ln.s4{stroke:#be123c}.ln.s5{stroke:#a16207}
.hs:hover,.hs:focus{stroke:var(--hi);stroke-width:5;outline:none}
.hs.ln:hover,.hs.ln:focus{stroke:var(--hi);stroke-width:13}
.hs.sel{stroke:var(--hi);stroke-width:6;filter:drop-shadow(0 0 4px rgba(180,83,9,.8))}
.hs.ln.sel{stroke-width:14}
.badge{cursor:pointer}
.badge circle{fill:#12213b;stroke:#fff;stroke-width:2}
.badge text{fill:#fff;font:700 14px Verdana,sans-serif;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.badge.sel circle{fill:var(--hi)}
.leader{stroke:#12213b;stroke-width:1.5;stroke-dasharray:3 3;pointer-events:none}
.plist{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.pbtn{display:flex;gap:6px;align-items:center;border:2px solid var(--pri);background:#fff;border-radius:10px;padding:6px 10px;min-height:42px;color:var(--ink)}
.pbtn .num{background:#12213b;color:#fff;border-radius:50%;min-width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;font-size:.8rem}
.pbtn.sel{background:var(--hi);color:#fff;border-color:var(--hi)}
.pbtn.seen::after{content:"✔";margin-left:4px}
.info{background:#fff;border:2px solid var(--pri);border-radius:12px;padding:8px 14px;min-height:70px}
.mut{color:var(--mut)}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.tabs button{border:2px solid var(--pri);background:#fff;border-radius:10px;padding:8px 12px;min-height:44px;color:var(--ink)}
.tabs button[aria-pressed=true]{background:var(--pri);color:#fff;font-weight:700}
ol.flow{list-style:none;padding:0;margin:10px 0;display:grid;gap:0}
ol.flow li{background:#fff;border:2px solid var(--pri);border-radius:12px;padding:8px 12px;position:relative;margin-bottom:22px;animation:pop .35s}
ol.flow li:not(:last-child)::after{content:"⬇";position:absolute;left:50%;bottom:-24px;transform:translateX(-50%);font-size:1.1rem}
ol.flow li:last-child{margin-bottom:0;background:#fef3c7;border-color:var(--hi)}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.q{border:2px solid var(--line);border-radius:12px;padding:12px;margin:12px 0;background:#fff}
.q .qt{font-weight:700;margin:0 0 8px}
.qopts{display:grid;gap:8px}
.qopts button{text-align:left;border:2px solid var(--pri);background:#fff;border-radius:10px;padding:9px 12px;min-height:44px;color:var(--ink)}

.gapsel{padding:5px;border:2px solid var(--pri);border-radius:8px;margin:0 3px;background:#fff;color:var(--ink)}

.qmeta{font-size:.8rem;color:var(--mut);margin-bottom:4px}
.locked button,.locked select,.locked input{pointer-events:none;opacity:.85}
.stage{position:relative;height:340px;width:120px;margin:0 auto;background:#e0f2fe;border:2px solid #0b5fa5;border-radius:10px;overflow:hidden}

.hand{position:absolute;left:0;right:0;bottom:20px;border-top:3px solid #dc2626}

.rdwrap{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:start}
@media (max-width:600px){.rdwrap{grid-template-columns:1fr}}
.bigbtn{font-size:1.2rem;padding:14px 20px;min-width:150px}
.hbar{display:flex;align-items:center;gap:8px;margin:6px 0}

.hc-lin{background:#fff;border:2px solid var(--line);border-radius:10px;padding:6px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:6px 0;font-size:.9rem}
.legend label{display:flex;align-items:center;gap:6px}
.pbar{display:flex;height:34px;border-radius:8px;overflow:hidden;border:2px solid #12213b;margin:6px 0}

input[type=range]{width:100%;height:32px}
.scaf{background:var(--warn);border:2px solid #d9a400;border-radius:10px;padding:8px 12px;margin:6px 0}
.cmd{border:2px solid var(--line);border-radius:12px;padding:12px;background:#fff;margin:10px 0}

.answerbox{width:100%;min-height:90px;border:2px solid var(--line);border-radius:10px;padding:8px;background:#fff;color:var(--ink)}
.notice{background:var(--warn);border:2px solid #d9a400;border-radius:12px;padding:10px 14px}
.navrow{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:24px}
.big-score{font-size:2.4rem;font-weight:800}
.sr{position:absolute;left:-9999px}
/* translation support: English stays primary, translation is quieter and sits directly underneath */
.tl{display:block;font-size:.88em;line-height:1.55;color:#334155;margin:.4em 0 .2em;padding-left:.7em;border-left:3px solid #8aa0bd;font-weight:400;overflow-wrap:anywhere}

body.hc .tl{color:#000;border-left:3px solid #000}
body.hc .hero .tl{color:#fff;border-left-color:#fff}
body.hc .vtr{color:#000;background:#fff;border:1px solid #000}
@media (max-width:520px){.top .row{gap:4px 8px}.tsup{font-size:.8rem}}
@media (max-width:520px){.top .row{padding:6px 10px}.langs button{padding:6px 8px;font-size:.85rem}.card{padding:12px}main{padding:12px 10px 50px}}
</style>

<script>
/* ================= helpers ================= */

 const dots=(P,ts,off,r)=>ts.map(t=>{const p=bz(P,t),n=nm(P,t);return `<circle cx="${(p[0]+n[0]*off).toFixed(1)}" cy="${(p[1]+n[1]*off).toFixed(1)}" r="${r}" fill="#f59e0b" stroke="#12213b" stroke-width="1.5"/>`}).join('');
 const bezPath=P=>`M${P[0]} C${P[1]} ${P[2]} ${P[3]}`;

  <circle cx="486" cy="80" r="20" fill="#facc15" stroke="#b45309" stroke-width="3"/>
  ${L(140,468)}${L(180,468)}${L(220,468)}
  ${T(486,122,'Light','luz','lumière','dg-l dg-or')}
  <path d="M250 190 L296 182" stroke="#475569" stroke-width="1.5" stroke-dasharray="3 3" fill="none"/>
  ${T(244,186,'More auxin on the shaded side','más auxina en el lado sombreado','plus d’auxine du côté à l’ombre','dg-l dg-brn','end')}
  ${T(280,H-26,'Shoot bends towards the light','el tallo se curva hacia la luz','la tige se courbe vers la lumière','dg-cap')}${key}
  ${T(280,30,'Phototropism: shoot and light from one side','Fototropismo: tallo y luz por un lado','Phototropisme : tige et lumière d’un côté','dg-h')}`,'Shoot bending towards light from one side; more auxin on the shaded side',{minw:520});
 }
 const shoot=kind==='shootG';

 return svgw(W,H,`${soil}
  <path d="${bezPath(P)}" fill="none" stroke="${shoot?'#16a34a':'#a16207'}" stroke-width="${shoot?26:22}" stroke-linecap="round"/>

        :T(200,284,'More auxin on the lower side → root bends downwards','más auxina en el lado inferior → la raíz se curva hacia abajo','plus d’auxine en bas → la racine se courbe vers le bas','dg-s')}
  ${key}

title:[`Principles of homeostasis`,`Principios de la homeostasis`,`Principes de l'homéostasie`],
chunks:[
[`<b>Homeostasis</b> is the <b>regulation</b> of the internal conditions of a cell or organism to maintain <b>optimum conditions</b> for function, in response to internal and external changes.`,`La <b>homeostasis</b> es la <b>regulación</b> (regulation) de las condiciones internas de una célula o de un organismo para mantener las <b>condiciones óptimas</b> (optimum conditions) para su funcionamiento, en respuesta a cambios internos y externos.`,`L'<b>homéostasie</b> (homeostasis) est la <b>régulation</b> (regulation) des conditions internes d'une cellule ou d'un organisme afin de maintenir des <b>conditions optimales</b> (optimum conditions) pour son fonctionnement, en réponse aux changements internes et externes.`],
[`<b>In simple words:</b> the body detects changes and keeps internal conditions within a suitable range. The conditions do not stay exactly the same all the time — they go up and down a little around the optimum. Cells and enzymes work best at the optimum.`,`<b>Con palabras sencillas:</b> el cuerpo detecta los cambios y mantiene las condiciones internas dentro de un rango adecuado. Las condiciones no se quedan exactamente iguales todo el tiempo: suben y bajan un poco alrededor del valor óptimo (optimum). Las células y las enzimas funcionan mejor en el óptimo.`,`<b>En mots simples :</b> le corps détecte les changements et maintient les conditions internes dans une plage adaptée. Les conditions ne restent pas exactement identiques en permanence : elles montent et descendent un peu autour de la valeur optimale (optimum). Les cellules et les enzymes fonctionnent mieux à l'optimum.`],[`The body controls <b>blood glucose concentration</b>, <b>body temperature</b> and <b>water levels</b>.`,`El cuerpo controla la <b>glucosa en sangre</b> (blood glucose concentration), la <b>temperatura corporal</b> (body temperature) y el <b>nivel de agua</b> (water levels).`,`Le corps contrôle la <b>glycémie</b> (blood glucose concentration), la <b>température corporelle</b> (body temperature) et la <b>teneur en eau</b> (water levels).`],
[`Every control system has 3 parts: <b>receptors</b> detect a change (a stimulus); <b>coordination centres</b> (e.g. brain, spinal cord, pancreas) process the information; <b>effectors</b> (muscles or glands) produce the response.`,`Todo sistema de control tiene 3 partes: los <b>receptores</b> (receptors) detectan un cambio (un estímulo); los <b>centros de coordinación</b> (coordination centres: cerebro, médula espinal, páncreas) procesan la información; los <b>efectores</b> (effectors: músculos o glándulas) producen la respuesta.`,`Tout système de contrôle a 3 parties : les <b>récepteurs</b> (receptors) détectent un changement (un stimulus) ; les <b>centres de coordination</b> (coordination centres : cerveau, moelle épinière, pancréas) traitent l'information ; les <b>effecteurs</b> (effectors : muscles ou glandes) produisent la réponse.`],
[`Order of events: <b>stimulus → receptor → coordination centre → effector → response</b>. The response usually reverses the change and returns conditions to normal.`,`Orden de los sucesos: <b>estímulo → receptor → centro de coordinación → efector → respuesta</b>. La respuesta suele corregir el cambio y devolver las condiciones a la normalidad.`,`Ordre des événements : <b>stimulus → récepteur → centre de coordination → effecteur → réponse</b>. La réponse corrige en général le changement et ramène les conditions à la normale.`],
[`<b>Two coordination systems:</b><div class="tw"><table><tr><th></th><th>Nervous</th><th>Hormonal</th></tr><tr><td>Message</td><td>Electrical impulses</td><td>Chemical hormones in the blood</td></tr><tr><td>Speed</td><td>Very fast</td><td>Slower</td></tr><tr><td>Effect lasts</td><td>Short time</td><td>Longer time</td></tr><tr><td>Acts on</td><td>Precise place</td><td>Wider (target organs)</td></tr></table></div>`,`<b>Dos sistemas de coordinación:</b><div class="tw"><table><tr><th></th><th>Nervioso (nervous)</th><th>Hormonal (hormonal)</th></tr><tr><td>Mensaje</td><td>Impulsos eléctricos</td><td>Hormonas (sustancias químicas) en la sangre</td></tr><tr><td>Velocidad</td><td>Muy rápido</td><td>Más lento</td></tr><tr><td>El efecto dura</td><td>Poco tiempo</td><td>Más tiempo</td></tr><tr><td>Actúa en</td><td>Un lugar preciso</td><td>Zonas más amplias (órganos diana)</td></tr></table></div>`,`<b>Deux systèmes de coordination :</b><div class="tw"><table><tr><th></th><th>Nerveux (nervous)</th><th>Hormonal (hormonal)</th></tr><tr><td>Message</td><td>Influx nerveux électrique</td><td>Hormones (substances chimiques) dans le sang</td></tr><tr><td>Vitesse</td><td>Très rapide</td><td>Plus lent</td></tr><tr><td>L'effet dure</td><td>Peu de temps</td><td>Plus longtemps</td></tr><tr><td>Agit sur</td><td>Un endroit précis</td><td>Zones plus larges (organes cibles)</td></tr></table></div>`]],
vocab:V(`Homeostasis|Homeostasis|Homéostasie; Regulation|Regulación|Régulation; Optimum|Óptimo|Optimal; Internal conditions|Condiciones internas|Conditions internes; Internal and external changes|Cambios internos y externos|Changements internes et externes; Stimulus|Estímulo|Stimulus; Receptor|Receptor|Récepteur; Coordination centre|Centro de coordinación|Centre de coordination; Effector|Efector|Effecteur; Response|Respuesta|Réponse; Blood glucose concentration|Concentración de glucosa en sangre|Glycémie; Body temperature|Temperatura corporal|Température corporelle; Water level|Nivel de agua|Teneur en eau; Nervous system|Sistema nervioso|Système nerveux; Hormone|Hormona|Hormone`),

[`<b>Stimulus</b> — a change happens`,`<b>Estímulo</b> (stimulus): ocurre un cambio`,`<b>Stimulus</b> : un changement se produit`],
[`<b>Receptor</b> — detects the change`,`<b>Receptor</b>: detecta el cambio`,`<b>Récepteur</b> : détecte le changement`],

qs:[
{t:'mcq',q:`Which part of a control system detects a stimulus?`,o:[`Effector`,`Receptor`,`Coordination centre`,`Response`],a:1,e:[`A receptor detects the stimulus. The coordination centre processes the information and the effector carries out the response.`,`Un receptor detecta el estímulo. El centro de coordinación procesa la información y el efector realiza la respuesta.`,`Un récepteur détecte le stimulus. Le centre de coordination traite l'information et l'effecteur réalise la réponse.`]},
{t:'gap',q:`A muscle or gland that carries out a response is called an {0}. The brain or spinal cord acts as a {1}.`,b:[[`effector`,`receptor`,`hormone`],[`coordination centre`,`stimulus`,`neurone`]],a:[0,0],e:[`Muscles and glands are effectors. The brain, spinal cord or pancreas coordinate the response.`,`Los músculos y las glándulas son efectores. El cerebro, la médula espinal o el páncreas coordinan la respuesta.`,`Les muscles et les glandes sont des effecteurs. Le cerveau, la moelle épinière ou le pancréas coordonnent la réponse.`]},
{t:'tf',q:`Nervous responses are usually slower than hormonal responses but last longer.`,a:false,e:[`False. Nervous responses are very fast but short-lived. Hormonal responses are slower but last longer.`,`Falso. Las respuestas nerviosas son muy rápidas pero breves. Las hormonales son más lentas pero duran más.`,`Faux. Les réponses nerveuses sont très rapides mais brèves. Les réponses hormonales sont plus lentes mais durent plus longtemps.`]},
{t:'mcq',q:`Which statement gives the best definition of homeostasis?`,o:[`Internal conditions never change at all`,`The regulation of internal conditions to maintain optimum conditions for function, in response to internal and external changes`,`Only the temperature of the body is controlled`,`Removing all waste from the body`],a:1,e:[`Homeostasis is the regulation of internal conditions to maintain optimum conditions for function, in response to changes. Conditions vary a little around the optimum; they do not stay literally constant.`,`La homeostasis es la regulación de las condiciones internas para mantener las condiciones óptimas para el funcionamiento, en respuesta a cambios. Las condiciones varían un poco alrededor del óptimo; no permanecen literalmente constantes.`,`L'homéostasie est la régulation des conditions internes pour maintenir des conditions optimales pour le fonctionnement, en réponse aux changements. Les conditions varient un peu autour de l'optimum ; elles ne restent pas littéralement constantes.`]}
]});

SECTIONS.push({id:2,icon:'🧠',tags:[],
title:[`The nervous system`,`El sistema nervioso`,`Le système nerveux`],
chunks:[
[`The <b>nervous system</b> lets you react to your surroundings. It sends <b>electrical impulses</b> very quickly along nerve cells (neurones).`,`El <b>sistema nervioso</b> (nervous system) te permite reaccionar al entorno. Envía <b>impulsos eléctricos</b> (electrical impulses) muy rápido a lo largo de las neuronas.`,`Le <b>système nerveux</b> (nervous system) te permet de réagir à ton environnement. Il envoie très vite des <b>influx nerveux électriques</b> (electrical impulses) le long des neurones.`],
[`The <b>central nervous system (CNS)</b> = the <b>brain</b> + the <b>spinal cord</b>. It is the coordination centre.`,`El <b>sistema nervioso central (CNS)</b> = el <b>cerebro</b> (brain) + la <b>médula espinal</b> (spinal cord). Es el centro de coordinación.`,`Le <b>système nerveux central (CNS)</b> = le <b>cerveau</b> (brain) + la <b>moelle épinière</b> (spinal cord). C'est le centre de coordination.`],
[`<b>Receptors</b> detect stimuli (light, sound, touch, temperature, chemicals). They are found in sense organs such as the eye, ear and skin.`,`Los <b>receptores</b> (receptors) detectan estímulos (luz, sonido, tacto, temperatura, sustancias químicas). Están en los órganos de los sentidos: ojo, oído y piel.`,`Les <b>récepteurs</b> (receptors) détectent les stimulus (lumière, son, toucher, température, substances chimiques). Ils se trouvent dans les organes des sens : œil, oreille, peau.`],
[`Three types of neurone: <b>sensory</b> (receptor → CNS), <b>relay</b> (inside the CNS, joins sensory and motor) and <b>motor</b> (CNS → effector).`,`Tres tipos de neuronas: <b>sensitiva</b> (sensory: receptor → CNS), <b>de relevo</b> (relay: dentro del CNS, une la sensitiva y la motora) y <b>motora</b> (motor: CNS → efector).`,`Trois types de neurones : <b>sensitif</b> (sensory : récepteur → CNS), <b>intermédiaire</b> (relay : dans le CNS, relie le sensitif et le moteur) et <b>moteur</b> (motor : CNS → effecteur).`],
[`<b>Effectors</b> are muscles (they contract) or glands (they release chemicals such as hormones). Pathway: <b>stimulus → receptor → sensory neurone → CNS → motor neurone → effector → response</b>.`,`Los <b>efectores</b> (effectors) son músculos (se contraen) o glándulas (liberan sustancias como hormonas). Camino: <b>estímulo → receptor → neurona sensitiva → CNS → neurona motora → efector → respuesta</b>.`,`Les <b>effecteurs</b> (effectors) sont des muscles (ils se contractent) ou des glandes (elles libèrent des substances comme les hormones). Trajet : <b>stimulus → récepteur → neurone sensitif → CNS → neurone moteur → effecteur → réponse</b>.`]],

{t:'mcq',q:`Which type of neurone carries impulses from the CNS to a muscle?`,o:[`Sensory neurone`,`Relay neurone`,`Motor neurone`,`Receptor`],a:2,e:[`Motor neurones carry impulses away from the CNS to effectors such as muscles.`,`Las neuronas motoras llevan los impulsos desde el CNS hasta los efectores, como los músculos.`,`Les neurones moteurs transportent les influx du CNS vers les effecteurs, comme les muscles.`]},
{t:'tf',q:`The central nervous system is made of the brain and the spinal cord.`,a:true,e:[`True. The CNS is the brain and spinal cord. Nerves outside them are not part of the CNS.`,`Verdadero. El CNS es el cerebro y la médula espinal. Los nervios fuera de ellos no forman parte del CNS.`,`Vrai. Le CNS est le cerveau et la moelle épinière. Les nerfs situés en dehors n'en font pas partie.`]},
{t:'match',q:`Match each neurone to its job.`,pairs:[[`Sensory neurone`,`Carries impulses from receptor to CNS`],[`Relay neurone`,`Connects sensory and motor neurones inside the CNS`],[`Motor neurone`,`Carries impulses from CNS to effector`]],e:[`Sensory: receptor → CNS. Relay: joins neurones inside the CNS. Motor: CNS → effector.`,`Sensitiva: receptor → CNS. De relevo: une neuronas dentro del CNS. Motora: CNS → efector.`,`Sensitif : récepteur → CNS. Intermédiaire : relie les neurones dans le CNS. Moteur : CNS → effecteur.`]}
]});

title:[`Reflexes and synapses`,`Reflejos y sinapsis`,`Réflexes et synapses`],
chunks:[
[`A <b>reflex action</b> is <b>automatic</b> and <b>rapid</b>. You do not think about it. Reflexes protect the body, e.g. pulling your hand away from something hot.`,`Una <b>acción refleja</b> (reflex action) es <b>automática</b> y <b>rápida</b>. No piensas en ella. Los reflejos protegen el cuerpo, por ejemplo al retirar la mano de algo caliente.`,`Une <b>action réflexe</b> (reflex action) est <b>automatique</b> et <b>rapide</b>. Tu n'y réfléchis pas. Les réflexes protègent le corps, par exemple quand tu retires la main d'un objet chaud.`],
[`Reflexes are fast because the pathway is short and the brain does not need to make a conscious decision.`,`Los reflejos son rápidos porque el camino es corto y el cerebro no tiene que tomar una decisión consciente.`,`Les réflexes sont rapides parce que le trajet est court et que le cerveau n'a pas à prendre de décision consciente.`],
[`<b>Reflex arc:</b> stimulus → receptor → <b>sensory neurone</b> → <b>relay neurone</b> (in the spinal cord) → <b>motor neurone</b> → effector → response.`,`<b>Arco reflejo</b> (reflex arc): estímulo → receptor → <b>neurona sensitiva</b> → <b>neurona de relevo</b> (en la médula espinal) → <b>neurona motora</b> → efector → respuesta.`,`<b>Arc réflexe</b> (reflex arc) : stimulus → récepteur → <b>neurone sensitif</b> → <b>neurone intermédiaire</b> (dans la moelle épinière) → <b>neurone moteur</b> → effecteur → réponse.`],
[`A <b>synapse</b> is a tiny gap between two neurones. An electrical impulse cannot jump across it.`,`Una <b>sinapsis</b> (synapse) es un pequeño espacio entre dos neuronas. Un impulso eléctrico no puede saltarlo.`,`Une <b>synapse</b> (synapse) est un minuscule espace entre deux neurones. Un influx électrique ne peut pas le franchir.`],
[`Crossing a synapse: the impulse arrives → the first neurone releases <b>neurotransmitter</b> chemicals → they <b>diffuse</b> across the gap → they bind to receptors on the next neurone → a new electrical impulse starts.`,`Cruzar una sinapsis: llega el impulso → la primera neurona libera <b>neurotransmisores</b> (neurotransmitters) → se <b>difunden</b> (diffuse) por el espacio → se unen a receptores de la siguiente neurona → comienza un nuevo impulso eléctrico.`,`Franchir une synapse : l'influx arrive → le premier neurone libère des <b>neurotransmetteurs</b> (neurotransmitters) → ils <b>diffusent</b> (diffuse) dans l'espace → ils se fixent sur des récepteurs du neurone suivant → un nouvel influx électrique démarre.`]],
vocab:V(`Reflex action|Acción refleja (reflejo)|Action réflexe (réflexe); Automatic|Automático|Automatique; Rapid|Rápido|Rapide; Reflex arc|Arco reflejo|Arc réflexe; Synapse|Sinapsis|Synapse; Neurotransmitter|Neurotransmisor|Neurotransmetteur; Diffusion|Difusión|Diffusion; Receptor molecule|Molécula receptora|Molécule réceptrice; Conscious|Consciente|Conscient; Protect|Proteger|Protéger`),

[`<b>Receptor</b> in the skin detects the stimulus`,`El <b>receptor</b> (receptor) de la piel detecta el estímulo`,`Le <b>récepteur</b> de la peau détecte le stimulus`],

[`<b>Relay neurone</b> passes the impulse on (across synapses)`,`La <b>neurona de relevo</b> (relay neurone) transmite el impulso (a través de sinapsis)`,`Le <b>neurone intermédiaire</b> transmet l'influx (à travers des synapses)`],
[`<b>Motor neurone</b> carries the impulse to the muscle`,`La <b>neurona motora</b> (motor neurone) lleva el impulso al músculo`,`Le <b>neurone moteur</b> transporte l'influx vers le muscle`],

qs:[
{t:'mcq',q:`What crosses the gap at a synapse?`,o:[`An electrical impulse`,`Neurotransmitter chemicals`,`Hormones from the blood`,`Sensory neurones`],a:1,e:[`Neurotransmitters diffuse across the gap. The electrical impulse cannot cross it, so a new impulse starts in the next neurone.`,`Los neurotransmisores se difunden por el espacio. El impulso eléctrico no puede cruzarlo, por eso empieza un impulso nuevo en la siguiente neurona.`,`Les neurotransmetteurs diffusent dans l'espace. L'influx électrique ne peut pas le franchir : un nouvel influx démarre dans le neurone suivant.`]},
{t:'gap',q:`At a synapse, chemicals called {0} move across the gap by {1}.`,b:[[`neurotransmitters`,`hormones`,`enzymes`],[`diffusion`,`osmosis`,`contraction`]],a:[0,0],e:[`Neurotransmitters move by diffusion from an area of high concentration to low concentration.`,`Los neurotransmisores se mueven por difusión, de una zona de alta concentración a otra de baja concentración.`,`Les neurotransmetteurs se déplacent par diffusion, d'une zone de forte concentration vers une zone de faible concentration.`]},
{t:'tf',q:`Reflex actions need conscious thought from the brain.`,a:false,e:[`False. Reflexes are automatic. They do not need conscious thought, which makes them fast.`,`Falso. Los reflejos son automáticos. No necesitan pensamiento consciente, por eso son rápidos.`,`Faux. Les réflexes sont automatiques. Ils n'exigent pas de réflexion consciente, ce qui les rend rapides.`]},
{t:'mcq',q:`Why is a reflex action faster than a voluntary action?`,o:[`The pathway is short and no conscious decision is needed`,`Hormones carry the message`,`The impulse travels through more synapses`,`The effector is a gland`],a:0,e:[`Reflexes use a short pathway and skip the conscious decision in the brain.`,`Los reflejos usan un camino corto y se saltan la decisión consciente del cerebro.`,`Les réflexes utilisent un trajet court et évitent la décision consciente du cerveau.`]}
]});

SECTIONS.push({id:4,icon:'⏱️',tags:['RP'],
title:[`Required practical: reaction time`,`Práctica obligatoria: tiempo de reacción`,`Pratique obligatoire : temps de réaction`],
chunks:[
[`<b>Aim:</b> investigate how a factor affects human <b>reaction time</b>. <b>Ruler drop:</b> a partner holds a ruler vertically and drops it without warning. You catch it as fast as you can. The ruler falls further if your reaction is slower.`,`<b>Objetivo:</b> investigar cómo un factor afecta al <b>tiempo de reacción</b> (reaction time) humano. <b>Caída de la regla:</b> un compañero sujeta una regla en vertical y la suelta sin avisar. Tú la atrapas lo más rápido que puedes. La regla cae más si tu reacción es más lenta.`,`<b>But :</b> étudier comment un facteur influence le <b>temps de réaction</b> (reaction time) chez l'humain. <b>Chute de la règle :</b> un partenaire tient une règle à la verticale et la lâche sans prévenir. Tu l'attrapes le plus vite possible. La règle tombe plus loin si ta réaction est plus lente.`],
[`<b>What do you measure, and what are you investigating?</b><div class="tw"><table><tr><th></th><th>What it is</th><th>Unit</th></tr><tr><td>Measured directly</td><td>Distance the ruler falls before you catch it</td><td>cm</td></tr><tr><td>Outcome (what you are investigating)</td><td>Reaction time</td><td>seconds (s)</td></tr></table></div><b>A shorter distance = a faster reaction time.</b> Reaction time is <b>not</b> measured in cm: the distance is used to judge it.`,`<b>¿Qué mides y qué investigas?</b><div class="tw"><table><tr><th></th><th>Qué es</th><th>Unidad</th></tr><tr><td>Medido directamente</td><td>Distancia que cae la regla antes de atraparla</td><td>cm</td></tr><tr><td>Resultado (lo que investigas)</td><td>Tiempo de reacción (reaction time)</td><td>segundos (s)</td></tr></table></div><b>Menor distancia = tiempo de reacción más rápido.</b> El tiempo de reacción <b>no</b> se mide en cm: la distancia se usa para juzgarlo.`,`<b>Que mesures-tu et qu'étudies-tu ?</b><div class="tw"><table><tr><th></th><th>Ce que c'est</th><th>Unité</th></tr><tr><td>Mesuré directement</td><td>Distance de chute de la règle avant de l'attraper</td><td>cm</td></tr><tr><td>Résultat (ce que tu étudies)</td><td>Temps de réaction (reaction time)</td><td>secondes (s)</td></tr></table></div><b>Distance plus courte = temps de réaction plus rapide.</b> Le temps de réaction n'est <b>pas</b> mesuré en cm : la distance sert à le juger.`],
[`<b>Converting distance to reaction time:</b> a falling ruler speeds up because of gravity, so the distance can be converted into a time using a conversion table or the equation <b>t = √(2d ÷ g)</b> (d in metres, g = 9.8 m/s²). Example: 20 cm = 0.20 m gives t ≈ 0.20 s; 18 cm gives t ≈ 0.19 s. You do not need to learn this equation. Often you can compare the distances directly.`,`<b>Convertir la distancia en tiempo de reacción:</b> una regla que cae se acelera por la gravedad, así que la distancia se puede convertir en tiempo con una tabla de conversión o con la ecuación <b>t = √(2d ÷ g)</b> (d en metros, g = 9,8 m/s²). Ejemplo: 20 cm = 0,20 m da t ≈ 0,20 s; 18 cm da t ≈ 0,19 s. No hace falta aprender esta ecuación. A menudo se pueden comparar las distancias directamente.`,`<b>Convertir la distance en temps de réaction :</b> une règle qui tombe accélère à cause de la gravité ; la distance peut donc être convertie en temps avec un tableau de conversion ou l'équation <b>t = √(2d ÷ g)</b> (d en mètres, g = 9,8 m/s²). Exemple : 20 cm = 0,20 m donne t ≈ 0,20 s ; 18 cm donne t ≈ 0,19 s. Tu n'as pas besoin d'apprendre cette équation. Souvent, on peut comparer directement les distances.`],
[`<b>Variables:</b> Independent variable (IV) = what you change (e.g. dominant / non-dominant hand). Dependent variable (DV) = what you measure (distance the ruler falls, in cm). Control variables = what you keep the same (same ruler, same person dropping, same height, same time of day).`,`<b>Variables:</b> Variable independiente (IV) = lo que cambias (p. ej. mano dominante / no dominante). Variable dependiente (DV) = lo que mides (distancia que cae la regla, en cm). Variables de control = lo que mantienes igual (misma regla, misma persona que suelta, misma altura, misma hora del día).`,`<b>Variables :</b> Variable indépendante (IV) = ce que tu changes (par ex. main dominante / non dominante). Variable dépendante (DV) = ce que tu mesures (distance de chute de la règle, en cm). Variables contrôlées = ce que tu gardes identique (même règle, même personne qui lâche, même hauteur, même moment de la journée).`],
[`<b>Repeats and mean:</b> repeat each condition at least 3 times. <b>Mean = total ÷ number of results.</b> An <b>anomaly</b> is a result far from the others. Leave it out of the mean (or repeat it).`,`<b>Repeticiones y media:</b> repite cada condición al menos 3 veces. <b>Media = suma ÷ número de resultados.</b> Un <b>resultado anómalo</b> (anomaly) está muy lejos de los demás. No lo incluyas en la media (o repítelo).`,`<b>Répétitions et moyenne :</b> répète chaque condition au moins 3 fois. <b>Moyenne = total ÷ nombre de résultats.</b> Une <b>valeur aberrante</b> (anomaly) est très éloignée des autres. Ne la garde pas dans la moyenne (ou refais la mesure).`],
[`<b>Graphs:</b> if the IV is categories (e.g. hand), draw a <b>bar chart</b>. If the IV is a number (e.g. hours of sleep), draw a <b>line graph</b>. Put the IV on the x-axis, the DV on the y-axis, and add units.`,`<b>Gráficas:</b> si la IV son categorías (p. ej. la mano), dibuja un <b>diagrama de barras</b>. Si la IV es un número (p. ej. horas de sueño), dibuja un <b>gráfico de líneas</b>. La IV va en el eje x, la DV en el eje y, con unidades.`,`<b>Graphiques :</b> si la IV est en catégories (par ex. la main), trace un <b>diagramme en barres</b>. Si la IV est un nombre (par ex. heures de sommeil), trace une <b>courbe</b>. La IV va sur l'axe x, la DV sur l'axe y, avec les unités.`],
[`<b>Conclusion:</b> describe the pattern using numbers from your results, then say if it supports your hypothesis. <b>Evaluation:</b> a limitation is that judging when to catch is hard; results may improve with practice. <b>Improvements:</b> use a computer reaction timer, more repeats, more people.`,`<b>Conclusión:</b> describe el patrón con números de tus resultados y di si apoya tu hipótesis. <b>Evaluación:</b> una limitación es que es difícil juzgar cuándo atrapar; los resultados pueden mejorar con la práctica. <b>Mejoras:</b> usar un cronómetro de reacción por ordenador, más repeticiones, más personas.`,`<b>Conclusion :</b> décris la tendance avec des chiffres de tes résultats, puis dis si elle confirme ton hypothèse. <b>Évaluation :</b> une limite est qu'il est difficile de juger quand attraper ; les résultats peuvent s'améliorer avec l'entraînement. <b>Améliorations :</b> utiliser un chronomètre de réaction informatique, plus de répétitions, plus de personnes.`],
[`<b>Safe and ethical testing (human participants):</b> take part only if you <b>volunteer</b> (informed consent) and you may <b>stop at any time</b>. Do not ask anyone to eat, drink or take any substance (e.g. caffeine) or do anything risky — use safe factors such as hand used, practice or distraction. Handle the ruler safely and keep results <b>confidential</b> (do not embarrass anyone).`,`<b>Pruebas seguras y éticas (participantes humanos):</b> participa solo si eres <b>voluntario</b> (consentimiento informado, informed consent) y puedes <b>parar en cualquier momento</b>. No pidas a nadie que coma, beba o tome ninguna sustancia (p. ej. cafeína) ni que haga nada arriesgado: usa factores seguros como la mano usada, la práctica o la distracción. Maneja la regla con seguridad y mantén los resultados <b>confidenciales</b> (no dejes en evidencia a nadie).`,`<b>Tests sûrs et éthiques (participants humains) :</b> participe seulement si tu es <b>volontaire</b> (consentement éclairé, informed consent) et tu peux <b>arrêter à tout moment</b>. Ne demande à personne de manger, de boire ou de prendre une substance (par ex. de la caféine) ni de faire quelque chose de risqué : utilise des facteurs sûrs comme la main utilisée, l'entraînement ou la distraction. Manipule la règle en sécurité et garde les résultats <b>confidentiels</b> (ne mets personne mal à l'aise).`]],
vocab:V(`Reaction time|Tiempo de reacción|Temps de réaction; Independent variable|Variable independiente|Variable indépendante; Dependent variable|Variable dependiente|Variable dépendante; Control variable|Variable de control|Variable contrôlée; Repeat|Repetición|Répétition; Mean|Media|Moyenne; Anomaly (anomalous result)|Resultado anómalo|Valeur aberrante; Hypothesis|Hipótesis|Hypothèse; Conclusion|Conclusión|Conclusion; Evaluation|Evaluación|Évaluation; Reliable|Fiable|Fiable; Ruler|Regla|Règle; Distance fallen|Distancia caída|Distance de chute; Informed consent|Consentimiento informado|Consentement éclairé; Volunteer|Voluntario|Volontaire; Confidential|Confidencial|Confidentiel`),

[[`Distance the ruler falls before it is caught (cm)`,`Distancia que cae la regla antes de atraparla (cm)`,`Distance de chute de la règle avant d'être attrapée (cm)`],1,[`This is what you measure directly (the dependent variable). It is used to judge reaction time.`,`Es lo que mides directamente (la variable dependiente). Se usa para juzgar el tiempo de reacción.`,`C'est ce que tu mesures directement (la variable dépendante). Elle sert à juger le temps de réaction.`]],

{t:'data',q:`A student catches a dropped ruler five times. The distances are shown. Which result is anomalous?`,table:[[`Repeat`,`1`,`2`,`3`,`4`,`5`],[`Distance (cm)`,`18`,`20`,`19`,`35`,`21`]],o:[`18 cm`,`20 cm`,`35 cm`,`21 cm`],a:2,e:[`35 cm is far from the others (18 to 21 cm), so it is anomalous.`,`35 cm está muy lejos de los demás (18 a 21 cm), por eso es anómalo.`,`35 cm est très éloigné des autres (18 à 21 cm) : c'est une valeur aberrante.`]},
{t:'mcq',q:`Using the same data but ignoring the anomaly, what is the mean distance?`,o:[`19.5 cm`,`22.6 cm`,`20.0 cm`,`78 cm`],a:0,e:[`(18 + 20 + 19 + 21) ÷ 4 = 78 ÷ 4 = 19.5 cm. The anomaly (35) is left out.`,`(18 + 20 + 19 + 21) ÷ 4 = 78 ÷ 4 = 19,5 cm. El resultado anómalo (35) no se incluye.`,`(18 + 20 + 19 + 21) ÷ 4 = 78 ÷ 4 = 19,5 cm. La valeur aberrante (35) est exclue.`]},
{t:'tf',q:`A larger distance caught on the ruler means a faster reaction time.`,a:false,e:[`False. The ruler fell further before being caught, so the reaction was slower.`,`Falso. La regla cayó más antes de ser atrapada, así que la reacción fue más lenta.`,`Faux. La règle est tombée plus loin avant d'être attrapée : la réaction a été plus lente.`]},
{t:'mcq',q:`Which is a sensible improvement to the ruler-drop investigation?`,o:[`Use a computer-based reaction timer`,`Use a different ruler each time`,`Let each person choose how high to hold the ruler`,`Only do one attempt`],a:0,e:[`A computer timer measures more precisely and removes human judgement. The other options add variables or reduce reliability.`,`Un cronómetro informático mide con más precisión y elimina el juicio humano. Las otras opciones añaden variables o reducen la fiabilidad.`,`Un chronomètre informatique mesure plus précisément et supprime le jugement humain. Les autres options ajoutent des variables ou réduisent la fiabilité.`]}
]});

SECTIONS.push({id:5,icon:'🧠',tags:['BIO'],
title:[`The brain`,`El cerebro`,`Le cerveau`],
chunks:[
[`The brain controls complex behaviour. It is made of billions of interconnected neurones. It has different regions with different jobs.`,`El cerebro controla el comportamiento complejo. Está formado por miles de millones de neuronas conectadas. Tiene regiones distintas con funciones distintas.`,`Le cerveau contrôle les comportements complexes. Il est formé de milliards de neurones connectés. Il a différentes régions avec des rôles différents.`],
[`<b>Cerebral cortex:</b> the outer layer. It controls consciousness, intelligence, memory and language.`,`<b>Corteza cerebral</b> (cerebral cortex): la capa externa. Controla la conciencia, la inteligencia, la memoria y el lenguaje.`,`<b>Cortex cérébral</b> (cerebral cortex) : la couche externe. Il contrôle la conscience, l'intelligence, la mémoire et le langage.`],
[`<b>Cerebellum:</b> at the back and bottom. It controls muscle coordination and balance.`,`<b>Cerebelo</b> (cerebellum): en la parte trasera e inferior. Controla la coordinación muscular y el equilibrio.`,`<b>Cervelet</b> (cerebellum) : à l'arrière et en bas. Il contrôle la coordination musculaire et l'équilibre.`],
[`<b>Medulla:</b> the brain stem. It controls unconscious activities such as <b>heart rate</b> and <b>breathing rate</b>.`,`<b>Bulbo raquídeo</b> (medulla): el tronco cerebral. Controla actividades inconscientes como la <b>frecuencia cardiaca</b> y la <b>frecuencia respiratoria</b>.`,`<b>Bulbe rachidien</b> (medulla) : le tronc cérébral. Il contrôle des activités inconscientes comme le <b>rythme cardiaque</b> et le <b>rythme respiratoire</b>.`],
[`<b>How do we know what each region does?</b> Scientists (1) study patients with brain damage, (2) stimulate parts of the brain with small electrical currents and see what happens, (3) use <b>MRI scans</b> to see the brain working without surgery.`,`<b>¿Cómo sabemos qué hace cada región?</b> Los científicos (1) estudian a pacientes con daño cerebral, (2) estimulan partes del cerebro con pequeñas corrientes eléctricas y observan el resultado, (3) usan <b>resonancias magnéticas (MRI)</b> para ver el cerebro en funcionamiento sin cirugía.`,`<b>Comment sait-on ce que fait chaque région ?</b> Les scientifiques (1) étudient des patients ayant une lésion cérébrale, (2) stimulent des parties du cerveau avec de petits courants électriques et observent le résultat, (3) utilisent l'<b>IRM</b> (MRI) pour voir le cerveau fonctionner sans chirurgie.`,'HT'],
[`<b>Why is the brain hard to study and treat?</b> It is very complex, delicate and protected inside the skull. Surgery is risky. Damaged neurones are hard to repair. It is difficult to reach the right part without harming others.`,`<b>¿Por qué es difícil estudiar y tratar el cerebro?</b> Es muy complejo, delicado y está protegido dentro del cráneo. La cirugía es arriesgada. Las neuronas dañadas son difíciles de reparar. Es difícil llegar a la zona correcta sin dañar otras.`,`<b>Pourquoi le cerveau est-il difficile à étudier et à soigner ?</b> Il est très complexe, fragile et protégé dans le crâne. La chirurgie est risquée. Les neurones abîmés sont difficiles à réparer. Il est difficile d'atteindre la bonne zone sans en abîmer d'autres.`,'HT']],
vocab:V(`Cerebral cortex|Corteza cerebral|Cortex cérébral; Cerebellum|Cerebelo|Cervelet; Medulla (oblongata)|Bulbo raquídeo|Bulbe rachidien; Consciousness|Conciencia|Conscience; Memory|Memoria|Mémoire; Language|Lenguaje|Langage; Balance|Equilibrio|Équilibre; Heart rate|Frecuencia cardiaca|Rythme cardiaque; Breathing rate|Frecuencia respiratoria|Rythme respiratoire; MRI scan|Resonancia magnética (MRI)|IRM; Brain damage|Daño cerebral|Lésion cérébrale; Electrical stimulation|Estimulación eléctrica|Stimulation électrique`),
acts:[{type:'hotspot',title:[`Label the brain`,`Etiqueta el cerebro`,`Étiquette le cerveau`],instr:I_HOT,svg:brainSvg,parts:[
{id:'cortex',x:210,y:75,name:[`Cerebral cortex`,`Corteza cerebral (cerebral cortex)`,`Cortex cérébral (cerebral cortex)`],fn:[`Consciousness, intelligence, memory and language.`,`Conciencia, inteligencia, memoria y lenguaje.`,`Conscience, intelligence, mémoire et langage.`]},
{id:'cerebellum',x:300,y:232,name:[`Cerebellum`,`Cerebelo (cerebellum)`,`Cervelet (cerebellum)`],fn:[`Coordinates muscle movement and controls balance.`,`Coordina el movimiento muscular y controla el equilibrio.`,`Coordonne les mouvements musculaires et contrôle l'équilibre.`]},
{id:'medulla',x:232,y:270,name:[`Medulla`,`Bulbo raquídeo (medulla)`,`Bulbe rachidien (medulla)`],fn:[`Controls unconscious activities: heart rate and breathing rate.`,`Controla actividades inconscientes: frecuencia cardiaca y respiratoria.`,`Contrôle des activités inconscientes : rythme cardiaque et respiratoire.`]}]}],
qs:[
{t:'mcq',q:`Which part of the brain controls heart rate and breathing rate?`,o:[`Cerebral cortex`,`Cerebellum`,`Medulla`,`Retina`],a:2,e:[`The medulla controls unconscious activities such as heart rate and breathing. The cortex handles thinking and memory; the cerebellum handles balance.`,`El bulbo raquídeo controla actividades inconscientes como el latido y la respiración. La corteza se encarga del pensamiento y la memoria; el cerebelo, del equilibrio.`,`Le bulbe rachidien contrôle des activités inconscientes comme le rythme cardiaque et la respiration. Le cortex gère la pensée et la mémoire ; le cervelet, l'équilibre.`]},
{t:'match',q:`Match each brain region to its function.`,pairs:[[`Cerebral cortex`,`Memory and language`],[`Cerebellum`,`Balance and muscle coordination`],[`Medulla`,`Heart rate and breathing rate`]],e:[`Cortex: memory and language. Cerebellum: balance and coordination. Medulla: heart and breathing rate.`,`Corteza: memoria y lenguaje. Cerebelo: equilibrio y coordinación. Bulbo: latido y respiración.`,`Cortex : mémoire et langage. Cervelet : équilibre et coordination. Bulbe : cœur et respiration.`]},
{t:'mcq',q:`(Higher Tier) Which technique lets scientists see the working brain without surgery?`,o:[`MRI scanning`,`Removing part of the brain`,`Blood tests`,`X-rays of the skull`],a:0,e:[`MRI scans produce images of the brain without opening the skull. X-rays of the skull do not show brain activity.`,`Las resonancias magnéticas producen imágenes del cerebro sin abrir el cráneo. Los rayos X del cráneo no muestran actividad cerebral.`,`L'IRM produit des images du cerveau sans ouvrir le crâne. Les radiographies du crâne ne montrent pas l'activité cérébrale.`]},
{t:'tf',q:`The cerebellum controls heart rate.`,a:false,e:[`False. The cerebellum controls balance and coordination. The medulla controls heart rate.`,`Falso. El cerebelo controla el equilibrio y la coordinación. El bulbo raquídeo controla el latido.`,`Faux. Le cervelet contrôle l'équilibre et la coordination. Le bulbe rachidien contrôle le rythme cardiaque.`]}
]});

SECTIONS.push({id:6,icon:'👁️',tags:['BIO'],
title:[`The eye`,`El ojo`,`L'œil`],
chunks:[
[`The eye is a <b>sense organ</b>. The <b>retina</b> contains <b>receptor cells</b> that are sensitive to light.`,`El ojo es un <b>órgano de los sentidos</b>. La <b>retina</b> (retina) contiene <b>células receptoras</b> sensibles a la luz.`,`L'œil est un <b>organe des sens</b>. La <b>rétine</b> (retina) contient des <b>cellules réceptrices</b> sensibles à la lumière.`],
[`<b>Sclera:</b> tough white outer layer; protects the eye. <b>Cornea:</b> clear front; <b>refracts</b> (bends) light into the eye.`,`<b>Esclerótica</b> (sclera): capa externa blanca y resistente; protege el ojo. <b>Córnea</b> (cornea): parte frontal transparente; <b>refracta</b> (desvía) la luz hacia el ojo.`,`<b>Sclérotique</b> (sclera) : couche externe blanche et résistante ; protège l'œil. <b>Cornée</b> (cornea) : partie avant transparente ; <b>réfracte</b> (dévie) la lumière vers l'œil.`],
[`<b>Iris:</b> coloured muscle that controls how much light enters. <b>Pupil:</b> the hole in the middle of the iris that lets light in.`,`<b>Iris</b> (iris): músculo coloreado que controla cuánta luz entra. <b>Pupila</b> (pupil): el agujero en el centro del iris por donde entra la luz.`,`<b>Iris</b> (iris) : muscle coloré qui contrôle la quantité de lumière qui entre. <b>Pupille</b> (pupil) : le trou au centre de l'iris qui laisse entrer la lumière.`],
[`<b>Lens:</b> clear and flexible; <b>focuses</b> light onto the retina. <b>Ciliary muscles</b> and <b>suspensory ligaments</b> change the shape of the lens.`,`<b>Cristalino</b> (lens): transparente y flexible; <b>enfoca</b> la luz en la retina. Los <b>músculos ciliares</b> (ciliary muscles) y los <b>ligamentos suspensorios</b> (suspensory ligaments) cambian la forma del cristalino.`,`<b>Cristallin</b> (lens) : transparent et flexible ; <b>focalise</b> la lumière sur la rétine. Les <b>muscles ciliaires</b> (ciliary muscles) et les <b>ligaments suspenseurs</b> (suspensory ligaments) changent la forme du cristallin.`],
[`<b>Retina:</b> has light receptor cells. <b>Optic nerve:</b> carries impulses from the retina to the brain.`,`<b>Retina</b> (retina): tiene células receptoras de luz. <b>Nervio óptico</b> (optic nerve): lleva impulsos de la retina al cerebro.`,`<b>Rétine</b> (retina) : contient les cellules réceptrices de lumière. <b>Nerf optique</b> (optic nerve) : transporte les influx de la rétine vers le cerveau.`],
[`<b>Bright light:</b> the pupil gets <b>smaller</b> so less light enters (protects the retina). <b>Dim light:</b> the pupil gets <b>larger</b> so more light enters. This is a reflex.`,`<b>Luz intensa:</b> la pupila se hace <b>más pequeña</b> y entra menos luz (protege la retina). <b>Luz tenue:</b> la pupila se hace <b>más grande</b> y entra más luz. Es un reflejo.`,`<b>Lumière vive :</b> la pupille devient <b>plus petite</b> et moins de lumière entre (protège la rétine). <b>Faible lumière :</b> la pupille devient <b>plus grande</b> et plus de lumière entre. C'est un réflexe.`],
[`<b>Bright light:</b> the <b>circular muscles</b> of the iris <b>contract</b> and the <b>radial muscles relax</b>. The pupil <b>constricts</b> (gets smaller), so <b>less light</b> enters the eye.`,`<b>Luz intensa:</b> los <b>músculos circulares</b> (circular muscles) del iris se <b>contraen</b> y los <b>músculos radiales</b> (radial muscles) se <b>relajan</b>. La pupila se <b>contrae</b> (constricts: se hace más pequeña) y entra <b>menos luz</b> en el ojo.`,`<b>Lumière vive :</b> les <b>muscles circulaires</b> (circular muscles) de l'iris se <b>contractent</b> et les <b>muscles radiaux</b> (radial muscles) se <b>relâchent</b>. La pupille se <b>contracte</b> (constricts : devient plus petite) et <b>moins de lumière</b> entre dans l'œil.`],
[`<b>Dim light:</b> the <b>radial muscles contract</b> and the <b>circular muscles relax</b>. The pupil <b>dilates</b> (gets larger), so <b>more light</b> enters the eye.`,`<b>Luz tenue:</b> los <b>músculos radiales</b> (radial muscles) se <b>contraen</b> y los <b>músculos circulares</b> (circular muscles) se <b>relajan</b>. La pupila se <b>dilata</b> (dilates: se hace más grande) y entra <b>más luz</b> en el ojo.`,`<b>Faible lumière :</b> les <b>muscles radiaux</b> (radial muscles) se <b>contractent</b> et les <b>muscles circulaires</b> (circular muscles) se <b>relâchent</b>. La pupille se <b>dilate</b> (dilates : devient plus grande) et <b>plus de lumière</b> entre dans l'œil.`]],
vocab:V(`Sclera|Esclerótica|Sclérotique; Cornea|Córnea|Cornée; Iris|Iris|Iris; Pupil|Pupila|Pupille; Lens|Cristalino|Cristallin; Ciliary muscle|Músculo ciliar|Muscle ciliaire; Suspensory ligament|Ligamento suspensorio|Ligament suspenseur; Retina|Retina|Rétine; Optic nerve|Nervio óptico|Nerf optique; Refraction|Refracción|Réfraction; Receptor cell|Célula receptora|Cellule réceptrice; Bright light|Luz intensa|Lumière vive; Dim light|Luz tenue|Faible lumière; Circular muscle|Músculo circular|Muscle circulaire; Radial muscle|Músculo radial|Muscle radial; Constrict (get smaller)|Contraerse (hacerse más pequeña)|Se contracter (devenir plus petite); Dilate (get larger)|Dilatarse (hacerse más grande)|Se dilater (devenir plus grande)`),
acts:[{type:'hotspot',title:[`Explore the eye`,`Explora el ojo`,`Explore l'œil`],instr:I_HOT,svg:eyeSvg,parts:[
{id:'sclera',x:352,y:26,gx:338,gy:57,name:[`Sclera`,`Esclerótica (sclera)`,`Sclérotique (sclera)`],fn:[`Tough outer layer. Protects the eye and gives it shape.`,`Capa externa resistente. Protege el ojo y le da forma.`,`Couche externe résistante. Protège l'œil et lui donne sa forme.`]},
{id:'cornea',x:120,y:88,gx:162,gy:120,name:[`Cornea`,`Córnea (cornea)`,`Cornée (cornea)`],fn:[`Clear front layer. Refracts (bends) light as it enters the eye.`,`Capa frontal transparente. Refracta (desvía) la luz al entrar en el ojo.`,`Couche avant transparente. Réfracte (dévie) la lumière à l'entrée de l'œil.`]},
{id:'iris',x:200,y:60,gx:202,gy:100,name:[`Iris`,`Iris (iris)`,`Iris (iris)`],fn:[`Muscle that changes the size of the pupil to control how much light enters.`,`Músculo que cambia el tamaño de la pupila para controlar cuánta luz entra.`,`Muscle qui change la taille de la pupille pour contrôler la quantité de lumière.`]},
{id:'pupil',x:140,y:226,gx:200,gy:164,name:[`Pupil`,`Pupila (pupil)`,`Pupille (pupil)`],fn:[`The hole in the iris. Light passes through it.`,`El agujero del iris. La luz pasa por él.`,`Le trou de l'iris. La lumière le traverse.`]},
{id:'lens',x:240,y:150,name:[`Lens`,`Cristalino (lens)`,`Cristallin (lens)`],fn:[`Changes shape to focus light onto the retina.`,`Cambia de forma para enfocar la luz en la retina.`,`Change de forme pour focaliser la lumière sur la rétine.`]},
{id:'ciliary',x:300,y:60,gx:252,gy:76,name:[`Ciliary muscles`,`Músculos ciliares (ciliary muscles)`,`Muscles ciliaires (ciliary muscles)`],fn:[`Contract or relax to change the shape of the lens.`,`Se contraen o se relajan para cambiar la forma del cristalino.`,`Se contractent ou se relâchent pour changer la forme du cristallin.`]},
{id:'suspensory',x:300,y:108,gx:245,gy:98,name:[`Suspensory ligaments`,`Ligamentos suspensorios (suspensory ligaments)`,`Ligaments suspenseurs (suspensory ligaments)`],fn:[`Connect the ciliary muscles to the lens. Their tension changes the lens shape.`,`Conectan los músculos ciliares con el cristalino. Su tensión cambia la forma del cristalino.`,`Relient les muscles ciliaires au cristallin. Leur tension change la forme du cristallin.`]},
{id:'retina',x:405,y:88,gx:375,gy:96,name:[`Retina`,`Retina (retina)`,`Rétine (retina)`],fn:[`Contains light receptor cells that detect light and send impulses.`,`Contiene células receptoras que detectan la luz y envían impulsos.`,`Contient des cellules réceptrices qui détectent la lumière et envoient des influx.`]},
{id:'optic',x:445,y:132,gx:430,gy:160,name:[`Optic nerve`,`Nervio óptico (optic nerve)`,`Nerf optique (optic nerve)`],fn:[`Carries impulses from the retina to the brain.`,`Lleva impulsos desde la retina al cerebro.`,`Transporte les influx de la rétine vers le cerveau.`]}]},
{type:'toggle',reveal:false,title:[`Bright light or dim light? Compare the iris muscles`,`¿Luz intensa o tenue? Compara los músculos del iris`,`Lumière vive ou faible ? Compare les muscles de l'iris`],instr:[`Switch between bright and dim light and compare what the circular and radial muscles do to the pupil.`,`Cambia entre luz intensa y tenue y compara qué hacen los músculos circulares y radiales con la pupila.`,`Passe de la lumière vive à la faible lumière et compare ce que font les muscles circulaires et radiaux sur la pupille.`],states:[
{label:[`Bright light`,`Luz intensa`,`Lumière vive`],svg:pupilSvg(true),steps:[[`<b>Circular muscles</b> of the iris <b>contract</b>`,`Los <b>músculos circulares</b> (circular muscles) del iris se <b>contraen</b>`,`Les <b>muscles circulaires</b> (circular muscles) de l'iris se <b>contractent</b>`],[`<b>Radial muscles relax</b>`,`Los <b>músculos radiales</b> (radial muscles) se <b>relajan</b>`,`Les <b>muscles radiaux</b> (radial muscles) se <b>relâchent</b>`],[`The pupil <b>constricts</b> (gets smaller)`,`La pupila se <b>contrae</b> (constricts: se hace más pequeña)`,`La pupille se <b>contracte</b> (constricts : devient plus petite)`],[`<b>Less light</b> enters the eye — the retina is protected`,`Entra <b>menos luz</b> en el ojo: se protege la retina`,`<b>Moins de lumière</b> entre dans l'œil : la rétine est protégée`]]},
{label:[`Dim light`,`Luz tenue`,`Faible lumière`],svg:pupilSvg(false),steps:[[`<b>Radial muscles</b> of the iris <b>contract</b>`,`Los <b>músculos radiales</b> (radial muscles) del iris se <b>contraen</b>`,`Les <b>muscles radiaux</b> (radial muscles) de l'iris se <b>contractent</b>`],[`<b>Circular muscles relax</b>`,`Los <b>músculos circulares</b> (circular muscles) se <b>relajan</b>`,`Les <b>muscles circulaires</b> (circular muscles) se <b>relâchent</b>`],[`The pupil <b>dilates</b> (gets larger)`,`La pupila se <b>dilata</b> (dilates: se hace más grande)`,`La pupille se <b>dilate</b> (dilates : devient plus grande)`],[`<b>More light</b> enters the eye — the image is easier to see`,`Entra <b>más luz</b> en el ojo: es más fácil ver la imagen`,`<b>Plus de lumière</b> entre dans l'œil : l'image est plus facile à voir`]]}]}],
qs:[
{t:'match',q:`Match each structure to its function.`,pairs:[[`Cornea`,`Refracts light into the eye`],[`Iris`,`Controls the size of the pupil`],[`Retina`,`Contains light receptor cells`],[`Optic nerve`,`Carries impulses to the brain`]],e:[`Cornea refracts; iris controls pupil size; retina has receptors; optic nerve goes to the brain.`,`La córnea refracta; el iris controla el tamaño de la pupila; la retina tiene receptores; el nervio óptico va al cerebro.`,`La cornée réfracte ; l'iris contrôle la taille de la pupille ; la rétine a les récepteurs ; le nerf optique va au cerveau.`]},
{t:'mcq',q:`Which structure contains the light receptor cells?`,o:[`Cornea`,`Lens`,`Retina`,`Sclera`],a:2,e:[`The retina has the receptor cells. The cornea and lens only bend light towards it.`,`La retina tiene las células receptoras. La córnea y el cristalino solo desvían la luz hacia ella.`,`La rétine contient les cellules réceptrices. La cornée et le cristallin ne font que dévier la lumière vers elle.`]},
{t:'tf',q:`In bright light the pupil gets larger.`,a:false,e:[`False. In bright light the pupil gets smaller so less light enters and the retina is protected.`,`Falso. Con luz intensa la pupila se hace más pequeña: entra menos luz y se protege la retina.`,`Faux. En lumière vive la pupille devient plus petite : moins de lumière entre et la rétine est protégée.`]},
{t:'mcq',q:`In dim light, what happens to the iris muscles?`,o:[`Circular muscles contract and radial muscles relax`,`Radial muscles contract and circular muscles relax`,`Both sets of muscles contract`,`Both sets of muscles relax`],a:1,e:[`In dim light the radial muscles contract and the circular muscles relax. The pupil dilates so more light enters.`,`Con luz tenue los músculos radiales se contraen y los circulares se relajan. La pupila se dilata y entra más luz.`,`En faible lumière, les muscles radiaux se contractent et les muscles circulaires se relâchent. La pupille se dilate et plus de lumière entre.`]}
]});

SECTIONS.push({id:7,icon:'🔭',tags:['BIO'],
title:[`Accommodation and vision`,`Acomodación y visión`,`Accommodation et vision`],
chunks:[
[`<b>Accommodation</b> = changing the shape of the lens to focus on objects at different distances.`,`<b>Acomodación</b> (accommodation) = cambiar la forma del cristalino para enfocar objetos a distintas distancias.`,`<b>Accommodation</b> (accommodation) = changer la forme du cristallin pour voir net à différentes distances.`],
[`<b>Near object:</b> ciliary muscles <b>contract</b> → suspensory ligaments <b>loosen</b> → lens becomes <b>thicker</b> → <b>more refraction</b>.`,`<b>Objeto cercano:</b> los músculos ciliares se <b>contraen</b> → los ligamentos suspensorios se <b>aflojan</b> → el cristalino se hace <b>más grueso</b> → <b>más refracción</b>.`,`<b>Objet proche :</b> les muscles ciliaires se <b>contractent</b> → les ligaments suspenseurs se <b>relâchent</b> → le cristallin devient <b>plus épais</b> → <b>plus de réfraction</b>.`],
[`<b>Distant object:</b> ciliary muscles <b>relax</b> → suspensory ligaments <b>tighten</b> → lens becomes <b>thinner</b> → <b>less refraction</b>.`,`<b>Objeto lejano:</b> los músculos ciliares se <b>relajan</b> → los ligamentos suspensorios se <b>tensan</b> → el cristalino se hace <b>más delgado</b> → <b>menos refracción</b>.`,`<b>Objet éloigné :</b> les muscles ciliaires se <b>relâchent</b> → les ligaments suspenseurs se <b>tendent</b> → le cristallin devient <b>plus mince</b> → <b>moins de réfraction</b>.`],
[`<b>Myopia (short-sightedness):</b> distant objects look blurred. Light focuses <b>in front of</b> the retina. Corrected with a <b>concave</b> lens.`,`<b>Miopía</b> (myopia, short-sightedness): los objetos lejanos se ven borrosos. La luz se enfoca <b>delante de</b> la retina. Se corrige con una lente <b>cóncava</b> (concave).`,`<b>Myopie</b> (myopia, short-sightedness) : les objets éloignés sont flous. La lumière se focalise <b>devant</b> la rétine. Corrigée par une lentille <b>concave</b>.`],
[`<b>Hyperopia (long-sightedness):</b> near objects look blurred. Light would focus <b>behind</b> the retina. Corrected with a <b>convex</b> lens.`,`<b>Hipermetropía</b> (hyperopia, long-sightedness): los objetos cercanos se ven borrosos. La luz se enfocaría <b>detrás de</b> la retina. Se corrige con una lente <b>convexa</b> (convex).`,`<b>Hypermétropie</b> (hyperopia, long-sightedness) : les objets proches sont flous. La lumière se focaliserait <b>derrière</b> la rétine. Corrigée par une lentille <b>convexe</b>.`],
[`<b>Reading ray diagrams:</b> follow the light rays. Do they meet <b>before</b>, <b>on</b> or <b>behind</b> the retina? Only "on the retina" gives a sharp image.`,`<b>Leer diagramas de rayos:</b> sigue los rayos de luz. ¿Se juntan <b>antes de</b>, <b>en</b> o <b>detrás de</b> la retina? Solo «en la retina» da una imagen nítida.`,`<b>Lire les schémas de rayons :</b> suis les rayons lumineux. Se croisent-ils <b>avant</b>, <b>sur</b> ou <b>derrière</b> la rétine ? Seul « sur la rétine » donne une image nette.`],
[`<b>Other treatments:</b> <b>contact lenses</b> (thin lenses on the cornea); <b>laser eye surgery</b> (changes the shape of the cornea); <b>replacement lens</b> (the natural lens is replaced by an artificial one). Each has benefits and risks, e.g. infection or damage.`,`<b>Otros tratamientos:</b> <b>lentes de contacto</b> (contact lenses; finas, sobre la córnea); <b>cirugía láser</b> (laser eye surgery; cambia la forma de la córnea); <b>lente de reemplazo</b> (replacement lens; se sustituye el cristalino por uno artificial). Cada uno tiene ventajas y riesgos, p. ej. infección o daños.`,`<b>Autres traitements :</b> <b>lentilles de contact</b> (contact lenses ; fines, posées sur la cornée) ; <b>chirurgie au laser</b> (laser eye surgery ; change la forme de la cornée) ; <b>cristallin de remplacement</b> (replacement lens ; le cristallin naturel est remplacé par un artificiel). Chacun a des avantages et des risques, par ex. infection ou lésion.`]],

qs:[
{t:'mcq',q:`When you look at a near object, what do the ciliary muscles do?`,o:[`Contract`,`Relax`,`Stay the same`,`Push the lens flat`],a:0,e:[`For near objects the ciliary muscles contract, the ligaments loosen and the lens gets thicker.`,`Para objetos cercanos los músculos ciliares se contraen, los ligamentos se aflojan y el cristalino se engrosa.`,`Pour les objets proches, les muscles ciliaires se contractent, les ligaments se relâchent et le cristallin s'épaissit.`]},
{t:'gap',q:`In myopia, light focuses {0} the retina. It is corrected with a {1} lens.`,b:[[`in front of`,`behind`,`on`],[`concave`,`convex`,`flat`]],a:[0,0],e:[`Myopia: focus in front of the retina; a concave lens spreads the rays out before they enter the eye.`,`Miopía: el foco queda delante de la retina; una lente cóncava separa los rayos antes de que entren en el ojo.`,`Myopie : le foyer est devant la rétine ; une lentille concave écarte les rayons avant leur entrée dans l'œil.`]},
{t:'tf',q:`When looking at a distant object, the suspensory ligaments are loose.`,a:false,e:[`False. For distant objects the ciliary muscles relax and the suspensory ligaments are pulled tight, making the lens thin.`,`Falso. Para objetos lejanos los músculos ciliares se relajan y los ligamentos suspensorios se tensan, y el cristalino se adelgaza.`,`Faux. Pour les objets éloignés, les muscles ciliaires se relâchent et les ligaments suspenseurs sont tendus : le cristallin s'amincit.`]},
{t:'mcq',q:`How does laser eye surgery correct vision?`,o:[`It changes the shape of the cornea`,`It replaces the retina`,`It makes the iris larger`,`It removes the optic nerve`],a:0,e:[`Lasers reshape the cornea so light is refracted correctly onto the retina.`,`El láser remodela la córnea para que la luz se refracte correctamente sobre la retina.`,`Le laser remodèle la cornée pour que la lumière soit correctement réfractée sur la rétine.`]}

SECTIONS.push({id:8,icon:'🌡️',tags:['BIO'],
title:[`Thermoregulation`,`Termorregulación`,`Thermorégulation`],
chunks:[
[`Normal body temperature is about <b>37 °C</b>. This is the optimum temperature for enzymes.`,`La temperatura corporal normal es de unos <b>37 °C</b>. Es la temperatura óptima para las enzimas.`,`La température corporelle normale est d'environ <b>37 °C</b>. C'est la température optimale pour les enzymes.`],
[`The <b>thermoregulatory centre</b> is in the brain (<b>hypothalamus</b>). It has receptors that monitor <b>blood temperature</b>.`,`El <b>centro termorregulador</b> (thermoregulatory centre) está en el cerebro (<b>hipotálamo</b>, hypothalamus). Tiene receptores que vigilan la <b>temperatura de la sangre</b>.`,`Le <b>centre de thermorégulation</b> (thermoregulatory centre) est dans le cerveau (<b>hypothalamus</b>). Il a des récepteurs qui surveillent la <b>température du sang</b>.`],
[`<b>Temperature receptors in the skin</b> send impulses to the thermoregulatory centre. The centre then sends impulses to effectors.`,`Los <b>receptores de temperatura de la piel</b> envían impulsos al centro termorregulador. El centro envía después impulsos a los efectores.`,`Les <b>récepteurs de température de la peau</b> envoient des influx au centre de thermorégulation. Le centre envoie ensuite des influx aux effecteurs.`],
[`<b>Too hot:</b> sweat glands release <b>sweat</b> (evaporation cools the skin); blood vessels near the skin <b>widen</b> = <b>vasodilation</b> (more blood flows near the surface, more heat is lost).`,`<b>Demasiado calor:</b> las glándulas sudoríparas liberan <b>sudor</b> (sweat; al evaporarse enfría la piel); los vasos sanguíneos cercanos a la piel se <b>ensanchan</b> = <b>vasodilatación</b> (vasodilation; pasa más sangre cerca de la superficie y se pierde más calor).`,`<b>Trop chaud :</b> les glandes sudoripares libèrent de la <b>sueur</b> (sweat ; son évaporation refroidit la peau) ; les vaisseaux sanguins proches de la peau <b>s'élargissent</b> = <b>vasodilatation</b> (vasodilation ; plus de sang près de la surface, plus de chaleur perdue).`],
[`<b>Too cold:</b> muscles contract quickly = <b>shivering</b> (respiration in muscles releases heat); blood vessels near the skin <b>narrow</b> = <b>vasoconstriction</b> (less heat lost); sweating stops.`,`<b>Demasiado frío:</b> los músculos se contraen rápido = <b>escalofríos</b> (shivering; la respiración en los músculos libera calor); los vasos sanguíneos cercanos a la piel se <b>estrechan</b> = <b>vasoconstricción</b> (vasoconstriction; se pierde menos calor); se deja de sudar.`,`<b>Trop froid :</b> les muscles se contractent rapidement = <b>frissons</b> (shivering ; la respiration dans les muscles libère de la chaleur) ; les vaisseaux sanguins proches de la peau <b>se rétrécissent</b> = <b>vasoconstriction</b> (vasoconstriction ; moins de chaleur perdue) ; la transpiration s'arrête.`],
[`<b>Common mistake:</b> blood vessels do NOT move closer to or away from the skin. They get wider (dilate) or narrower (constrict).`,`<b>Error común:</b> los vasos sanguíneos NO se acercan ni se alejan de la piel. Se ensanchan (dilatan) o se estrechan (constriñen).`,`<b>Erreur fréquente :</b> les vaisseaux sanguins ne se rapprochent PAS et ne s'éloignent PAS de la peau. Ils s'élargissent (dilatation) ou se rétrécissent (constriction).`]],
vocab:V(`Thermoregulation|Termorregulación|Thermorégulation; Thermoregulatory centre|Centro termorregulador|Centre de thermorégulation; Hypothalamus|Hipotálamo|Hypothalamus; Temperature receptor|Receptor de temperatura|Récepteur de température; Blood temperature|Temperatura de la sangre|Température du sang; Sweating|Sudoración|Transpiration (sudation); Shivering|Escalofríos (tiritar)|Frissons; Vasodilation|Vasodilatación|Vasodilatation; Vasoconstriction|Vasoconstricción|Vasoconstriction; Evaporation|Evaporación|Évaporation; Enzyme|Enzima|Enzyme`),

[[`Sweat glands release more sweat`,`Las glándulas sudoríparas liberan más sudor`,`Les glandes sudoripares libèrent plus de sueur`],true,[`Sweat evaporates and cools the skin.`,`El sudor se evapora y enfría la piel.`,`La sueur s'évapore et refroidit la peau.`]],

[[`Muscles contract rapidly (shivering)`,`Los músculos se contraen rápido (escalofríos)`,`Les muscles se contractent rapidement (frissons)`],false,[`Shivering releases heat, which is for when you are too cold.`,`Los escalofríos liberan calor; es una respuesta al frío.`,`Les frissons libèrent de la chaleur : c'est pour quand on a trop froid.`]],
[[`Blood vessels near the skin narrow (vasoconstriction)`,`Los vasos sanguíneos de la piel se estrechan (vasoconstricción)`,`Les vaisseaux sanguins de la peau se rétrécissent (vasoconstriction)`],false,[`That would reduce heat loss, which is for when you are too cold.`,`Eso reduciría la pérdida de calor; es una respuesta al frío.`,`Cela réduirait la perte de chaleur : c'est pour quand on a trop froid.`]],

[[`Muscles contract rapidly (shivering)`,`Los músculos se contraen rápido (escalofríos)`,`Les muscles se contractent rapidement (frissons)`],true,[`Shivering releases heat from respiration.`,`Los escalofríos liberan calor de la respiración.`,`Les frissons libèrent de la chaleur issue de la respiration.`]],

[[`Blood vessels near the skin widen (vasodilation)`,`Los vasos sanguíneos de la piel se ensanchan (vasodilatación)`,`Les vaisseaux sanguins de la peau s'élargissent (vasodilatation)`],false,[`That would lose more heat, which is for when you are too hot.`,`Eso perdería más calor; es una respuesta al calor.`,`Cela perdrait plus de chaleur : c'est pour quand on a trop chaud.`]]]}]}],

{t:'mcq',q:`Where is the thermoregulatory centre?`,o:[`Hypothalamus in the brain`,`Skin`,`Pancreas`,`Kidney`],a:0,e:[`The thermoregulatory centre is in the hypothalamus (brain). Skin only has temperature receptors.`,`El centro termorregulador está en el hipotálamo (cerebro). La piel solo tiene receptores de temperatura.`,`Le centre de thermorégulation est dans l'hypothalamus (cerveau). La peau n'a que des récepteurs de température.`]},
{t:'tf',q:`Vasodilation reduces heat loss from the skin.`,a:false,e:[`False. Vasodilation increases blood flow near the skin, so MORE heat is lost. Vasoconstriction reduces heat loss.`,`Falso. La vasodilatación aumenta el flujo de sangre cerca de la piel: se pierde MÁS calor. La vasoconstricción reduce la pérdida.`,`Faux. La vasodilatation augmente le flux sanguin près de la peau : on perd PLUS de chaleur. La vasoconstriction réduit la perte.`]},
{t:'gap',q:`When you are too cold, muscles {0} rapidly. This releases heat from {1}.`,b:[[`contract`,`relax`,`grow`],[`respiration`,`digestion`,`photosynthesis`]],a:[0,0],e:[`Shivering = rapid muscle contractions. Respiration in muscle cells releases energy as heat.`,`Escalofríos = contracciones musculares rápidas. La respiración en las células musculares libera energía en forma de calor.`,`Frissons = contractions musculaires rapides. La respiration des cellules musculaires libère de l'énergie sous forme de chaleur.`]}

title:[`The endocrine system`,`El sistema endocrino`,`Le système endocrinien`],
chunks:[
[`<b>Hormones</b> are <b>chemical messengers</b>. They are made in <b>endocrine glands</b> and released straight into the blood.`,`Las <b>hormonas</b> (hormones) son <b>mensajeros químicos</b>. Se producen en las <b>glándulas endocrinas</b> (endocrine glands) y pasan directamente a la sangre.`,`Les <b>hormones</b> (hormones) sont des <b>messagers chimiques</b>. Elles sont fabriquées par les <b>glandes endocrines</b> (endocrine glands) et libérées directement dans le sang.`],
[`The <b>blood</b> carries hormones around the body to their <b>target organs</b>. Only target organs respond to a hormone.`,`La <b>sangre</b> lleva las hormonas por el cuerpo hasta sus <b>órganos diana</b> (target organs). Solo los órganos diana responden a esa hormona.`,`Le <b>sang</b> transporte les hormones dans le corps jusqu'à leurs <b>organes cibles</b> (target organs). Seuls les organes cibles répondent à l'hormone.`],
[`The <b>pituitary gland</b> in the brain is the "master gland". It makes hormones that control other glands (e.g. TSH, FSH, LH) and ADH for the kidneys.`,`La <b>hipófisis</b> (pituitary gland), en el cerebro, es la «glándula maestra». Fabrica hormonas que controlan otras glándulas (p. ej. TSH, FSH, LH) y la ADH que actúa en los riñones.`,`L'<b>hypophyse</b> (pituitary gland), dans le cerveau, est la « glande maîtresse ». Elle fabrique des hormones qui commandent d'autres glandes (par ex. TSH, FSH, LH) et l'ADH pour les reins.`],
[`<b>Main glands:</b> pituitary (many hormones) · thyroid (thyroxine) · pancreas (insulin, glucagon) · adrenal glands (adrenaline) · ovaries (oestrogen, progesterone) · testes (testosterone).`,`<b>Glándulas principales:</b> hipófisis (muchas hormonas) · tiroides (tiroxina) · páncreas (insulina, glucagón) · glándulas suprarrenales (adrenalina) · ovarios (estrógeno, progesterona) · testículos (testosterona).`,`<b>Glandes principales :</b> hypophyse (nombreuses hormones) · thyroïde (thyroxine) · pancréas (insuline, glucagon) · glandes surrénales (adrénaline) · ovaires (œstrogène, progestérone) · testicules (testostérone).`],
[`<b>Nervous vs hormonal:</b> nerves are fast, short-lived and act in one place. Hormones are slower, last longer and can act on many places.`,`<b>Nervioso frente a hormonal:</b> los nervios son rápidos, breves y actúan en un lugar. Las hormonas son más lentas, duran más y pueden actuar en muchos lugares.`,`<b>Nerveux ou hormonal :</b> les nerfs sont rapides, brefs et agissent à un endroit. Les hormones sont plus lentes, durent plus longtemps et peuvent agir en de nombreux endroits.`]],

{id:'ovary',x:250,y:290,gx:192,gy:286,name:[`Ovaries (female)`,`Ovarios, mujer (ovaries)`,`Ovaires, femme (ovaries)`],fn:[`Make oestrogen and progesterone. Release eggs.`,`Fabrican estrógeno y progesterona. Liberan óvulos.`,`Fabriquent l'œstrogène et la progestérone. Libèrent des ovules.`]},
{id:'testis',x:215,y:345,gx:167,gy:340,name:[`Testes (male)`,`Testículos, hombre (testes)`,`Testicules, homme (testes)`],fn:[`Make testosterone and sperm.`,`Fabrican testosterona y espermatozoides.`,`Fabriquent la testostérone et les spermatozoïdes.`]}]}],

{t:'match',q:`Match each gland to a hormone it makes.`,pairs:[[`Pancreas`,`Insulin`],[`Thyroid`,`Thyroxine`],[`Adrenal gland`,`Adrenaline`],[`Testes`,`Testosterone`]],e:[`Pancreas: insulin. Thyroid: thyroxine. Adrenal: adrenaline. Testes: testosterone.`,`Páncreas: insulina. Tiroides: tiroxina. Suprarrenal: adrenalina. Testículos: testosterona.`,`Pancréas : insuline. Thyroïde : thyroxine. Surrénale : adrénaline. Testicules : testostérone.`]},
{t:'tf',q:`Hormones are carried to their target organs in the blood.`,a:true,e:[`True. Endocrine glands release hormones directly into the blood, which carries them to the target organs.`,`Verdadero. Las glándulas endocrinas liberan las hormonas directamente en la sangre, que las lleva a los órganos diana.`,`Vrai. Les glandes endocrines libèrent les hormones directement dans le sang, qui les transporte vers les organes cibles.`]},
{t:'mcq',q:`Which statement about hormonal coordination is correct?`,o:[`It is faster than nervous coordination`,`Its effects usually last longer than nervous effects`,`It uses electrical impulses`,`It only acts in one precise place`],a:1,e:[`Hormonal effects are slower but longer-lasting. Electrical impulses and precise action describe the nervous system.`,`Los efectos hormonales son más lentos pero más duraderos. Los impulsos eléctricos y la acción precisa describen el sistema nervioso.`,`Les effets hormonaux sont plus lents mais plus durables. Les influx électriques et l'action précise décrivent le système nerveux.`]}
