SECTIONS.push({id:10,icon:'🍬',tags:[],
title:[`Blood glucose`,`Glucosa en sangre`,`Glycémie`],
chunks:[
[`The <b>pancreas</b> monitors and controls blood glucose concentration. Glucose comes from carbohydrate in food.`,`El <b>páncreas</b> (pancreas) vigila y controla la concentración de glucosa en sangre. La glucosa procede de los carbohidratos de los alimentos.`,`Le <b>pancréas</b> (pancreas) surveille et contrôle la glycémie. Le glucose provient des glucides des aliments.`],
[`<b>Blood glucose too HIGH</b> (e.g. after a meal): the pancreas releases <b>insulin</b> → glucose moves from the blood into cells → in the liver and muscles, excess glucose is stored as <b>glycogen</b> → blood glucose falls.`,`<b>Glucosa en sangre demasiado ALTA</b> (p. ej. tras comer): el páncreas libera <b>insulina</b> (insulin) → la glucosa pasa de la sangre a las células → en el hígado y los músculos, el exceso se almacena como <b>glucógeno</b> (glycogen) → baja la glucosa en sangre.`,`<b>Glycémie trop ÉLEVÉE</b> (par ex. après un repas) : le pancréas libère de l'<b>insuline</b> (insulin) → le glucose passe du sang aux cellules → dans le foie et les muscles, l'excès est stocké sous forme de <b>glycogène</b> (glycogen) → la glycémie baisse.`],
[`<b>Blood glucose too LOW:</b> the pancreas releases <b>glucagon</b> → glycogen in the liver is converted to glucose → glucose is released into the blood → blood glucose rises.`,`<b>Glucosa en sangre demasiado BAJA:</b> el páncreas libera <b>glucagón</b> (glucagon) → el glucógeno del hígado se convierte en glucosa → la glucosa pasa a la sangre → sube la glucosa en sangre.`,`<b>Glycémie trop BASSE :</b> le pancréas libère du <b>glucagon</b> (glucagon) → le glycogène du foie est converti en glucose → le glucose est libéré dans le sang → la glycémie augmente.`,'HT'],
[`<b>Negative feedback:</b> insulin and glucagon work as a pair. Each one reverses a change, so blood glucose stays close to the normal level.`,`<b>Retroalimentación negativa</b> (negative feedback): la insulina y el glucagón actúan como una pareja. Cada una revierte un cambio, así la glucosa se mantiene cerca del nivel normal.`,`<b>Rétroaction négative</b> (negative feedback) : l'insuline et le glucagon fonctionnent en paire. Chacun annule un changement, ce qui maintient la glycémie près de la valeur normale.`,'HT']],
vocab:V(`Blood glucose concentration|Concentración de glucosa en sangre|Glycémie; Pancreas|Páncreas|Pancréas; Insulin|Insulina|Insuline; Glucagon|Glucagón|Glucagon; Glycogen|Glucógeno|Glycogène; Liver|Hígado|Foie; Muscle cell|Célula muscular|Cellule musculaire; Store|Almacenar|Stocker; Negative feedback|Retroalimentación negativa|Rétroaction négative; Carbohydrate|Carbohidrato|Glucide`),
acts:[{type:'toggle',title:[`Negative feedback: blood glucose`,`Retroalimentación negativa: glucosa en sangre`,`Rétroaction négative : glycémie`],instr:I_TOG,states:[
{label:[`Blood glucose too high`,`Glucosa demasiado alta`,`Glycémie trop élevée`],steps:[
[`Blood glucose <b>rises</b> (e.g. after a meal)`,`La glucosa en sangre <b>sube</b> (p. ej. tras comer)`,`La glycémie <b>augmente</b> (par ex. après un repas)`],
[`The <b>pancreas</b> detects the change`,`El <b>páncreas</b> detecta el cambio`,`Le <b>pancréas</b> détecte le changement`],
[`The pancreas releases <b>insulin</b> into the blood`,`El páncreas libera <b>insulina</b> en la sangre`,`Le pancréas libère de l'<b>insuline</b> dans le sang`],
[`Glucose moves from the blood <b>into cells</b>; the liver and muscles store it as <b>glycogen</b>`,`La glucosa pasa de la sangre <b>a las células</b>; el hígado y los músculos la almacenan como <b>glucógeno</b>`,`Le glucose passe du sang <b>dans les cellules</b> ; le foie et les muscles le stockent sous forme de <b>glycogène</b>`],
[`Blood glucose <b>falls</b> back to normal`,`La glucosa en sangre <b>baja</b> y vuelve a la normalidad`,`La glycémie <b>baisse</b> et revient à la normale`]]},
{label:[`Blood glucose too low (Higher Tier)`,`Glucosa demasiado baja (Higher Tier)`,`Glycémie trop basse (Higher Tier)`],steps:[
[`Blood glucose <b>falls</b> (e.g. between meals or after exercise)`,`La glucosa en sangre <b>baja</b> (p. ej. entre comidas o tras el ejercicio)`,`La glycémie <b>baisse</b> (par ex. entre les repas ou après l'effort)`],
[`The <b>pancreas</b> detects the change`,`El <b>páncreas</b> detecta el cambio`,`Le <b>pancréas</b> détecte le changement`],
[`The pancreas releases <b>glucagon</b>`,`El páncreas libera <b>glucagón</b>`,`Le pancréas libère du <b>glucagon</b>`],
[`In the liver, <b>glycogen is converted to glucose</b>, which enters the blood`,`En el hígado, el <b>glucógeno se convierte en glucosa</b>, que pasa a la sangre`,`Dans le foie, le <b>glycogène est converti en glucose</b>, qui entre dans le sang`],
[`Blood glucose <b>rises</b> back to normal`,`La glucosa en sangre <b>sube</b> y vuelve a la normalidad`,`La glycémie <b>augmente</b> et revient à la normale`]]}]}],
qs:[
{t:'mcq',q:`Which hormone is released by the pancreas when blood glucose is too high?`,o:[`Glucagon`,`Insulin`,`Adrenaline`,`Thyroxine`],a:1,e:[`Insulin lowers blood glucose by moving glucose into cells and storing it as glycogen.`,`La insulina baja la glucosa en sangre al llevarla a las células y almacenarla como glucógeno.`,`L'insuline fait baisser la glycémie en faisant entrer le glucose dans les cellules et en le stockant sous forme de glycogène.`]},
{t:'mcq',q:`(Higher Tier) What does glucagon cause the liver to do?`,o:[`Convert glucose into glycogen`,`Convert glycogen into glucose`,`Make more insulin`,`Store fat`],a:1,e:[`Glucagon raises blood glucose: the liver converts stored glycogen back into glucose. Insulin does the opposite.`,`El glucagón sube la glucosa: el hígado convierte el glucógeno almacenado en glucosa. La insulina hace lo contrario.`,`Le glucagon augmente la glycémie : le foie convertit le glycogène stocké en glucose. L'insuline fait l'inverse.`]},
{t:'order',q:`Put the response to HIGH blood glucose in order.`,items:[`Blood glucose rises`,`Pancreas releases insulin`,`Glucose moves into cells and is stored as glycogen`,`Blood glucose falls`],e:[`Order: rise → pancreas releases insulin → glucose into cells / glycogen → fall.`,`Orden: sube → el páncreas libera insulina → glucosa a las células / glucógeno → baja.`,`Ordre : hausse → le pancréas libère l'insuline → glucose dans les cellules / glycogène → baisse.`]},
{t:'tf',q:`Glycogen is a storage carbohydrate found in the liver and muscles.`,a:true,e:[`True. Excess glucose is converted to glycogen in liver and muscle cells.`,`Verdadero. El exceso de glucosa se convierte en glucógeno en las células del hígado y los músculos.`,`Vrai. L'excès de glucose est converti en glycogène dans les cellules du foie et des muscles.`]}
]});

SECTIONS.push({id:11,icon:'💉',tags:[],
title:[`Diabetes`,`Diabetes`,`Diabète`],
chunks:[
[`<b>Diabetes</b> is a disease where blood glucose concentration is not controlled properly, so it can become too high.`,`La <b>diabetes</b> (diabetes) es una enfermedad en la que la glucosa en sangre no se controla bien y puede ser demasiado alta.`,`Le <b>diabète</b> (diabetes) est une maladie où la glycémie n'est pas bien contrôlée et peut devenir trop élevée.`],
[`<b>Type 1:</b> the pancreas produces <b>little or no insulin</b>. Treatment: <b>insulin injections</b> (usually before meals) and <b>monitoring</b> blood glucose. Careful diet also helps.`,`<b>Tipo 1:</b> el páncreas produce <b>poca o ninguna insulina</b>. Tratamiento: <b>inyecciones de insulina</b> (normalmente antes de comer) y <b>control</b> de la glucosa en sangre. Una dieta cuidada también ayuda.`,`<b>Type 1 :</b> le pancréas produit <b>peu ou pas d'insuline</b>. Traitement : <b>injections d'insuline</b> (en général avant les repas) et <b>surveillance</b> de la glycémie. Une alimentation adaptée aide aussi.`],
[`<b>Type 2:</b> body cells <b>no longer respond properly to insulin</b>. It is linked to <b>obesity</b>. Treatment: a <b>carbohydrate-controlled diet</b>, more <b>exercise</b>, weight loss and sometimes <b>medication</b>.`,`<b>Tipo 2:</b> las células del cuerpo <b>ya no responden bien a la insulina</b>. Está relacionada con la <b>obesidad</b> (obesity). Tratamiento: <b>dieta con control de carbohidratos</b>, más <b>ejercicio</b>, pérdida de peso y a veces <b>medicación</b>.`,`<b>Type 2 :</b> les cellules du corps <b>ne répondent plus bien à l'insuline</b>. Il est lié à l'<b>obésité</b> (obesity). Traitement : <b>alimentation contrôlée en glucides</b>, plus d'<b>exercice</b>, perte de poids et parfois des <b>médicaments</b>.`],
[`<b>Key idea:</b> Type 1 = not enough insulin made. Type 2 = insulin is made but cells respond poorly.`,`<b>Idea clave:</b> Tipo 1 = no se fabrica suficiente insulina. Tipo 2 = se fabrica insulina pero las células responden mal.`,`<b>Idée clé :</b> Type 1 = pas assez d'insuline produite. Type 2 = l'insuline est produite mais les cellules répondent mal.`]],
vocab:V(`Diabetes|Diabetes|Diabète; Type 1 diabetes|Diabetes tipo 1|Diabète de type 1; Type 2 diabetes|Diabetes tipo 2|Diabète de type 2; Insulin injection|Inyección de insulina|Injection d'insuline; Monitor|Vigilar / controlar|Surveiller; Obesity|Obesidad|Obésité; Diet|Dieta|Alimentation (régime); Exercise|Ejercicio|Exercice; Medication|Medicación|Médicament (traitement); Respond|Responder|Répondre; Carbohydrate|Carbohidrato|Glucide`),
acts:[{type:'classify',title:[`Compare Type 1 and Type 2`,`Compara el tipo 1 y el tipo 2`,`Compare le type 1 et le type 2`],instr:I_CLASS,cats:[[`Type 1`,`Tipo 1`,`Type 1`],[`Type 2`,`Tipo 2`,`Type 2`],[`Both`,`Ambos`,`Les deux`]],items:[
[[`Pancreas produces little or no insulin`,`El páncreas produce poca o ninguna insulina`,`Le pancréas produit peu ou pas d'insuline`],0,[`Type 1 is an insulin production problem.`,`El tipo 1 es un problema de producción de insulina.`,`Le type 1 est un problème de production d'insuline.`]],
[[`Body cells respond poorly to insulin`,`Las células responden mal a la insulina`,`Les cellules répondent mal à l'insuline`],1,[`Type 2 is a response problem.`,`El tipo 2 es un problema de respuesta.`,`Le type 2 est un problème de réponse.`]],
[[`Treated with insulin injections`,`Se trata con inyecciones de insulina`,`Traité par des injections d'insuline`],0,[`Type 1 needs insulin because none is made.`,`El tipo 1 necesita insulina porque no se fabrica.`,`Le type 1 nécessite de l'insuline car il n'en est pas produit.`]],
[[`Linked to obesity`,`Relacionada con la obesidad`,`Lié à l'obésité`],1,[`Obesity is a major risk factor for Type 2.`,`La obesidad es un factor de riesgo importante para el tipo 2.`,`L'obésité est un facteur de risque majeur du type 2.`]],
[[`Often helped by weight loss, diet and exercise`,`A menudo mejora con pérdida de peso, dieta y ejercicio`,`Souvent amélioré par la perte de poids, l'alimentation et l'exercice`],1,[`Lifestyle changes are the first treatment for Type 2.`,`Los cambios de estilo de vida son el primer tratamiento del tipo 2.`,`Les changements de mode de vie sont le premier traitement du type 2.`]],
[[`Blood glucose can become too high`,`La glucosa en sangre puede llegar a ser demasiado alta`,`La glycémie peut devenir trop élevée`],2,[`This happens in both types.`,`Ocurre en ambos tipos.`,`Cela arrive dans les deux types.`]],
[[`Blood glucose needs to be monitored`,`Hay que controlar la glucosa en sangre`,`La glycémie doit être surveillée`],2,[`Monitoring is important in both types.`,`El control es importante en ambos tipos.`,`La surveillance est importante dans les deux types.`]]]}],
qs:[
{t:'mcq',q:`What causes Type 1 diabetes?`,o:[`The pancreas does not make enough insulin`,`Cells stop responding to insulin`,`Too much exercise`,`The liver makes too much glycogen`],a:0,e:[`In Type 1, the pancreas makes little or no insulin. Cells not responding to insulin describes Type 2.`,`En el tipo 1, el páncreas produce poca o ninguna insulina. Que las células no respondan describe el tipo 2.`,`Dans le type 1, le pancréas produit peu ou pas d'insuline. Des cellules qui ne répondent pas décrivent le type 2.`]},
{t:'data',q:`Two people drink a glucose drink. Their blood glucose is measured. Which person probably has diabetes?`,table:[[`Time (hours)`,`0`,`1`,`2`],[`Person A (mmol/dm³)`,`5`,`8`,`5`],[`Person B (mmol/dm³)`,`8`,`14`,`13`]],o:[`Person A, because their glucose rose`,`Person B, because their glucose stays high`,`Neither`,`Both`],a:1,e:[`Person A's glucose returned to normal (insulin worked). Person B's stayed high, so glucose is not being controlled properly.`,`La glucosa de A volvió a la normalidad (la insulina funcionó). La de B siguió alta: la glucosa no se controla bien.`,`La glycémie de A est revenue à la normale (l'insuline a agi). Celle de B est restée élevée : la glycémie n'est pas bien contrôlée.`]},
{t:'tf',q:`Type 2 diabetes is linked to obesity.`,a:true,e:[`True. Obesity is a major risk factor for Type 2 diabetes.`,`Verdadero. La obesidad es un factor de riesgo importante para la diabetes tipo 2.`,`Vrai. L'obésité est un facteur de risque majeur du diabète de type 2.`]},
{t:'gap',q:`People with Type 1 diabetes need {0} injections. Monitoring means measuring blood {1}.`,b:[[`insulin`,`glucagon`,`thyroxine`],[`glucose`,`pressure`,`oxygen`]],a:[0,0],e:[`Type 1: insulin injections. Monitoring blood glucose shows when insulin or food is needed.`,`Tipo 1: inyecciones de insulina. Controlar la glucosa indica cuándo hace falta insulina o comida.`,`Type 1 : injections d'insuline. Surveiller la glycémie indique quand l'insuline ou un repas est nécessaire.`]}
]});

SECTIONS.push({id:12,icon:'💧',tags:['BIO'],
title:[`Water and nitrogen balance`,`Equilibrio de agua y nitrógeno`,`Équilibre en eau et en azote`],
chunks:[
[`<b>Water is gained</b> from <b>food and drink</b> and from <b>respiration</b>. <b>Water is lost</b> from the <b>lungs</b> (breathing out), from the skin as <b>sweat</b>, and in <b>urine</b>.`,`<b>Se gana agua</b> con <b>alimentos y bebidas</b> y con la <b>respiración celular</b>. <b>Se pierde agua</b> por los <b>pulmones</b> (al espirar), por la piel como <b>sudor</b> y en la <b>orina</b> (urine).`,`<b>L'eau est gagnée</b> par les <b>aliments et boissons</b> et par la <b>respiration cellulaire</b>. <b>L'eau est perdue</b> par les <b>poumons</b> (expiration), par la peau sous forme de <b>sueur</b> et dans l'<b>urine</b> (urine).`],
[`<b>Mineral ions</b> (e.g. sodium) are lost in sweat and urine. The body must balance water and ions so cells do not gain or lose too much water.`,`Los <b>iones minerales</b> (mineral ions; p. ej. sodio) se pierden en el sudor y la orina. El cuerpo debe equilibrar agua e iones para que las células no ganen ni pierdan demasiada agua.`,`Les <b>ions minéraux</b> (mineral ions ; par ex. sodium) sont perdus dans la sueur et l'urine. Le corps doit équilibrer eau et ions pour que les cellules ne gagnent ni ne perdent trop d'eau.`],
[`<b>Urea</b> is a waste substance made in the <b>liver</b>. It is removed in <b>urine</b> by the kidneys (and a little in sweat).`,`La <b>urea</b> (urea) es una sustancia de desecho que se forma en el <b>hígado</b> (liver). Los riñones la eliminan en la <b>orina</b> (y un poco en el sudor).`,`L'<b>urée</b> (urea) est un déchet fabriqué dans le <b>foie</b> (liver). Les reins l'éliminent dans l'<b>urine</b> (et un peu dans la sueur).`],
[`<b>How urea is made:</b> the body cannot store excess <b>amino acids</b>. In the liver they are broken down by <b>deamination</b>. This makes <b>ammonia</b> (poisonous), which is converted to <b>urea</b>. Urea goes in the blood to the <b>kidneys</b> and leaves in <b>urine</b>.`,`<b>Cómo se forma la urea:</b> el cuerpo no puede almacenar el exceso de <b>aminoácidos</b>. En el hígado se descomponen por <b>desaminación</b> (deamination). Se produce <b>amoníaco</b> (ammonia; tóxico), que se convierte en <b>urea</b>. La urea va por la sangre a los <b>riñones</b> y sale en la <b>orina</b>.`,`<b>Comment l'urée est fabriquée :</b> le corps ne peut pas stocker l'excès d'<b>acides aminés</b>. Dans le foie, ils sont dégradés par <b>désamination</b> (deamination). Cela produit de l'<b>ammoniac</b> (ammonia ; toxique), converti en <b>urée</b>. L'urée passe par le sang jusqu'aux <b>reins</b> et sort dans l'<b>urine</b>.`,'HT']],
vocab:V(`Water balance|Equilibrio hídrico|Équilibre hydrique; Respiration|Respiración celular|Respiration cellulaire; Sweat|Sudor|Sueur; Urine|Orina|Urine; Mineral ions|Iones minerales|Ions minéraux; Urea|Urea|Urée; Liver|Hígado|Foie; Kidney|Riñón|Rein; Amino acid|Aminoácido|Acide aminé; Deamination|Desaminación|Désamination; Ammonia|Amoníaco|Ammoniac; Excrete|Excretar|Excréter`),
acts:[{type:'classify',title:[`Water gained or lost?`,`¿Se gana o se pierde agua?`,`Eau gagnée ou perdue ?`],instr:I_CLASS,cats:[[`Water gained`,`Agua que se gana`,`Eau gagnée`],[`Water lost`,`Agua que se pierde`,`Eau perdue`]],items:[
[[`Drinking`,`Beber`,`Boire`],0],[[`Eating food`,`Comer`,`Manger`],0],[[`Respiration in cells`,`Respiración celular`,`Respiration cellulaire`],0,[`Respiration makes water as a product.`,`La respiración celular produce agua.`,`La respiration cellulaire produit de l'eau.`]],
[[`Breathing out from the lungs`,`Espirar por los pulmones`,`Expirer par les poumons`],1],[[`Sweating`,`Sudar`,`Transpirer`],1],[[`Urine`,`Orina`,`Urine`],1]]},
{type:'order',title:[`Flow chart: how urea is made and removed`,`Diagrama de flujo: cómo se forma y se elimina la urea`,`Schéma : comment l'urée est fabriquée et éliminée`],instr:I_ORDER,items:[
[`<b>Excess amino acids</b> (cannot be stored)`,`<b>Exceso de aminoácidos</b> (no se pueden almacenar)`,`<b>Excès d'acides aminés</b> (ne peuvent pas être stockés)`],
[`<b>Deamination</b> in the liver`,`<b>Desaminación</b> en el hígado`,`<b>Désamination</b> dans le foie`],
[`<b>Ammonia</b> is made (poisonous)`,`Se forma <b>amoníaco</b> (tóxico)`,`Formation d'<b>ammoniac</b> (toxique)`],
[`Ammonia is converted to <b>urea</b>`,`El amoníaco se convierte en <b>urea</b>`,`L'ammoniac est converti en <b>urée</b>`],
[`Urea travels in the blood to the <b>kidneys</b>`,`La urea viaja por la sangre hasta los <b>riñones</b>`,`L'urée voyage dans le sang jusqu'aux <b>reins</b>`],
[`Urea leaves the body in <b>urine</b>`,`La urea sale del cuerpo en la <b>orina</b>`,`L'urée quitte le corps dans l'<b>urine</b>`]]}],
qs:[
{t:'mcq',q:`Where is urea made?`,o:[`Kidneys`,`Liver`,`Pancreas`,`Lungs`],a:1,e:[`Urea is made in the liver from excess amino acids. The kidneys only remove it from the blood.`,`La urea se forma en el hígado a partir del exceso de aminoácidos. Los riñones solo la eliminan de la sangre.`,`L'urée est fabriquée dans le foie à partir de l'excès d'acides aminés. Les reins ne font que l'éliminer du sang.`]},
{t:'tf',q:`Ammonia is converted into urea in the kidneys.`,a:false,e:[`False. Ammonia is converted into urea in the liver. The urea then travels to the kidneys.`,`Falso. El amoníaco se convierte en urea en el hígado. Después la urea viaja a los riñones.`,`Faux. L'ammoniac est converti en urée dans le foie. L'urée voyage ensuite jusqu'aux reins.`]},
{t:'mcq',q:`Which is a way the body GAINS water?`,o:[`Sweating`,`Breathing out`,`Respiration`,`Urine`],a:2,e:[`Respiration produces water. Sweating, breathing out and urine are ways of losing water.`,`La respiración celular produce agua. Sudar, espirar y la orina son formas de perder agua.`,`La respiration cellulaire produit de l'eau. Transpirer, expirer et l'urine sont des pertes d'eau.`]}
]});

SECTIONS.push({id:13,icon:'🫘',tags:['BIO'],
title:[`The kidneys and ADH`,`Los riñones y la ADH`,`Les reins et l'ADH`],
chunks:[
[`The kidneys <b>filter the blood</b> and make <b>urine</b>. You need to know what they do, not the detailed anatomy.`,`Los riñones <b>filtran la sangre</b> y producen <b>orina</b>. Debes saber qué hacen, no la anatomía detallada.`,`Les reins <b>filtrent le sang</b> et fabriquent l'<b>urine</b>. Tu dois savoir ce qu'ils font, pas leur anatomie détaillée.`],
[`<b>Step 1 — Filtration:</b> water, ions, glucose and urea pass out of the blood into the kidney tubules. Large molecules (e.g. proteins) and blood cells stay in the blood.`,`<b>Paso 1 — Filtración</b> (filtration): agua, iones, glucosa y urea salen de la sangre hacia los túbulos del riñón. Las moléculas grandes (p. ej. proteínas) y las células sanguíneas se quedan en la sangre.`,`<b>Étape 1 — Filtration</b> (filtration) : l'eau, les ions, le glucose et l'urée passent du sang dans les tubules du rein. Les grosses molécules (par ex. protéines) et les cellules sanguines restent dans le sang.`],
[`<b>Step 2 — Selective reabsorption:</b> <b>all glucose</b> is taken back into the blood. <b>Some water</b> and <b>some ions</b> are reabsorbed, as much as the body needs.`,`<b>Paso 2 — Reabsorción selectiva</b> (selective reabsorption): se recupera <b>toda la glucosa</b> hacia la sangre. Se reabsorbe <b>parte del agua</b> y <b>parte de los iones</b>, lo que necesita el cuerpo.`,`<b>Étape 2 — Réabsorption sélective</b> (selective reabsorption) : <b>tout le glucose</b> retourne dans le sang. Une <b>partie de l'eau</b> et <b>des ions</b> est réabsorbée, selon les besoins du corps.`],
[`<b>Step 3 — Excretion:</b> <b>urea</b>, extra water and extra ions are not reabsorbed. They leave as <b>urine</b>, stored in the bladder.`,`<b>Paso 3 — Excreción:</b> la <b>urea</b>, el agua sobrante y los iones sobrantes no se reabsorben. Salen como <b>orina</b>, que se almacena en la vejiga.`,`<b>Étape 3 — Excrétion :</b> l'<b>urée</b>, l'eau et les ions en excès ne sont pas réabsorbés. Ils sortent dans l'<b>urine</b>, stockée dans la vessie.`],
[`<b>ADH</b> (antidiuretic hormone) is released by the <b>pituitary gland</b>. It controls how much water the kidney tubules reabsorb. The brain monitors the water content of the blood.`,`La <b>ADH</b> (hormona antidiurética) la libera la <b>hipófisis</b>. Controla cuánta agua reabsorben los túbulos del riñón. El cerebro vigila el contenido de agua de la sangre.`,`L'<b>ADH</b> (hormone antidiurétique) est libérée par l'<b>hypophyse</b>. Elle contrôle la quantité d'eau réabsorbée par les tubules du rein. Le cerveau surveille la teneur en eau du sang.`,'HT'],
[`<b>Blood too concentrated:</b> more ADH → tubules <b>more permeable</b> → more water reabsorbed → <b>small volume of concentrated urine</b>. <b>Blood too dilute:</b> less ADH → tubules <b>less permeable</b> → less water reabsorbed → <b>large volume of dilute urine</b>.`,`<b>Sangre demasiado concentrada:</b> más ADH → túbulos <b>más permeables</b> → se reabsorbe más agua → <b>poca orina concentrada</b>. <b>Sangre demasiado diluida:</b> menos ADH → túbulos <b>menos permeables</b> → se reabsorbe menos agua → <b>mucha orina diluida</b>.`,`<b>Sang trop concentré :</b> plus d'ADH → tubules <b>plus perméables</b> → plus d'eau réabsorbée → <b>petit volume d'urine concentrée</b>. <b>Sang trop dilué :</b> moins d'ADH → tubules <b>moins perméables</b> → moins d'eau réabsorbée → <b>grand volume d'urine diluée</b>.`,'HT']],
vocab:V(`Kidney|Riñón|Rein; Filtration|Filtración|Filtration; Selective reabsorption|Reabsorción selectiva|Réabsorption sélective; Kidney tubule|Túbulo renal|Tubule rénal; Glucose|Glucosa|Glucose; Ion|Ion|Ion; Urea|Urea|Urée; Urine|Orina|Urine; Bladder|Vejiga|Vessie; ADH (antidiuretic hormone)|ADH (hormona antidiurética)|ADH (hormone antidiurétique); Permeable|Permeable|Perméable; Concentrated / dilute|Concentrado / diluido|Concentré / dilué`),

[`Kidney tubules become <b>less permeable</b> to water`,`Los túbulos renales se vuelven <b>menos permeables</b> al agua`,`Les tubules rénaux deviennent <b>moins perméables</b> à l'eau`],

qs:[
{t:'mcq',q:`Which substance is completely reabsorbed into the blood in a healthy kidney?`,o:[`Urea`,`Glucose`,`Water`,`Protein-free waste`],a:1,e:[`All glucose is reabsorbed. Urea is not reabsorbed. Water is only partly reabsorbed.`,`Toda la glucosa se reabsorbe. La urea no se reabsorbe. El agua solo se reabsorbe en parte.`,`Tout le glucose est réabsorbé. L'urée ne l'est pas. L'eau n'est réabsorbée qu'en partie.`]},
{t:'mcq',q:`(Higher Tier) Which gland releases ADH?`,o:[`Adrenal gland`,`Pituitary gland`,`Pancreas`,`Thyroid gland`],a:1,e:[`ADH is made and released by the pituitary gland.`,`La ADH la fabrica y libera la hipófisis.`,`L'ADH est fabriquée et libérée par l'hypophyse.`]},

{t:'tf',q:`Large protein molecules pass out of the blood into the kidney tubule during filtration.`,a:false,e:[`False. Large molecules such as proteins and blood cells stay in the blood. Water, ions, glucose and urea are filtered out.`,`Falso. Las moléculas grandes como las proteínas y las células sanguíneas se quedan en la sangre. Se filtran agua, iones, glucosa y urea.`,`Faux. Les grosses molécules comme les protéines et les cellules sanguines restent dans le sang. L'eau, les ions, le glucose et l'urée sont filtrés.`]}

SECTIONS.push({id:14,icon:'🩺',tags:['BIO'],
title:[`Kidney failure`,`Insuficiencia renal`,`Insuffisance rénale`],
chunks:[
[`In <b>kidney failure</b> the kidneys cannot control water, ions and urea. <b>Urea builds up</b> in the blood and is poisonous. Without treatment it can be fatal. Treatments: <b>dialysis</b> or a <b>kidney transplant</b>.`,`En la <b>insuficiencia renal</b> (kidney failure) los riñones no pueden controlar agua, iones ni urea. La <b>urea se acumula</b> en la sangre y es tóxica. Sin tratamiento puede ser mortal. Tratamientos: <b>diálisis</b> (dialysis) o <b>trasplante de riñón</b> (kidney transplant).`,`Dans l'<b>insuffisance rénale</b> (kidney failure), les reins ne peuvent plus contrôler l'eau, les ions et l'urée. L'<b>urée s'accumule</b> dans le sang et est toxique. Sans traitement, cela peut être mortel. Traitements : <b>dialyse</b> (dialysis) ou <b>greffe de rein</b> (kidney transplant).`],
[`<b>Dialysis:</b> blood flows next to a <b>partially permeable membrane</b>. On the other side is <b>dialysis fluid</b>. <b>Urea</b> diffuses from the blood into the fluid down its <b>concentration gradient</b>. Blood cells and proteins are too big to pass.`,`<b>Diálisis:</b> la sangre circula junto a una <b>membrana parcialmente permeable</b> (partially permeable membrane). Al otro lado hay <b>líquido de diálisis</b> (dialysis fluid). La <b>urea</b> se difunde de la sangre al líquido siguiendo su <b>gradiente de concentración</b>. Las células sanguíneas y las proteínas son demasiado grandes para pasar.`,`<b>Dialyse :</b> le sang circule le long d'une <b>membrane partiellement perméable</b> (partially permeable membrane). De l'autre côté se trouve le <b>liquide de dialyse</b> (dialysis fluid). L'<b>urée</b> diffuse du sang vers le liquide en suivant son <b>gradient de concentration</b>. Les cellules sanguines et les protéines sont trop grosses pour passer.`],
[`<b>Dialysis fluid</b> has the same concentration of glucose and ions as healthy blood, so useful substances are <b>not lost</b>. Fresh fluid keeps the gradient high. Dialysis takes several hours, several times a week, for as long as the kidneys are not working.`,`El <b>líquido de diálisis</b> tiene la misma concentración de glucosa e iones que la sangre sana, así que <b>no se pierden</b> sustancias útiles. El líquido nuevo mantiene alto el gradiente. La diálisis dura varias horas, varias veces por semana, mientras los riñones no funcionen.`,`Le <b>liquide de dialyse</b> a la même concentration de glucose et d'ions qu'un sang sain : les substances utiles ne sont donc <b>pas perdues</b>. Le liquide neuf maintient un gradient élevé. La dialyse dure plusieurs heures, plusieurs fois par semaine, tant que les reins ne fonctionnent pas.`],
[`<b>Kidney transplant:</b> a healthy kidney from a donor is put in. It can cure kidney failure long-term. <b>Problems:</b> the immune system may attack it (<b>rejection</b>); donors are scarce; major surgery.`,`<b>Trasplante de riñón:</b> se implanta un riñón sano de un donante. Puede curar la insuficiencia renal a largo plazo. <b>Problemas:</b> el sistema inmunitario puede atacarlo (<b>rechazo</b>, rejection); faltan donantes; es una cirugía mayor.`,`<b>Greffe de rein :</b> un rein sain d'un donneur est implanté. Elle peut guérir l'insuffisance rénale à long terme. <b>Problèmes :</b> le système immunitaire peut l'attaquer (<b>rejet</b>, rejection) ; les donneurs sont rares ; chirurgie lourde.`],
[`To reduce rejection: <b>tissue matching</b> (donor and patient tissue types are as similar as possible) and <b>immunosuppressant drugs</b> (which lower the immune response, but increase the risk of infection).`,`Para reducir el rechazo: <b>compatibilidad de tejidos</b> (tissue matching; el tejido del donante y del paciente se parecen lo más posible) y <b>fármacos inmunosupresores</b> (immunosuppressant drugs; reducen la respuesta inmunitaria, pero aumentan el riesgo de infección).`,`Pour réduire le rejet : <b>compatibilité tissulaire</b> (tissue matching ; les tissus du donneur et du patient sont aussi semblables que possible) et <b>médicaments immunosuppresseurs</b> (immunosuppressant drugs ; ils réduisent la réponse immunitaire mais augmentent le risque d'infection).`]],
vocab:V(`Kidney failure|Insuficiencia renal|Insuffisance rénale; Dialysis|Diálisis|Dialyse; Partially permeable membrane|Membrana parcialmente permeable|Membrane partiellement perméable; Dialysis fluid|Líquido de diálisis|Liquide de dialyse; Concentration gradient|Gradiente de concentración|Gradient de concentration; Diffusion|Difusión|Diffusion; Kidney transplant|Trasplante de riñón|Greffe de rein; Donor|Donante|Donneur; Rejection|Rechazo|Rejet; Tissue matching|Compatibilidad de tejidos|Compatibilité tissulaire; Immunosuppressant drug|Fármaco inmunosupresor|Médicament immunosuppresseur; Immune system|Sistema inmunitario|Système immunitaire`),
acts:[{type:'classify',title:[`Dialysis or kidney transplant?`,`¿Diálisis o trasplante de riñón?`,`Dialyse ou greffe de rein ?`],instr:I_CLASS,cats:[[`Dialysis`,`Diálisis`,`Dialyse`],[`Kidney transplant`,`Trasplante de riñón`,`Greffe de rein`]],items:[
[[`Needs regular sessions several times a week`,`Necesita sesiones regulares varias veces por semana`,`Nécessite des séances régulières plusieurs fois par semaine`],0],
[[`Risk of the immune system rejecting it`,`Riesgo de rechazo por el sistema inmunitario`,`Risque de rejet par le système immunitaire`],1],
[[`Uses a partially permeable membrane`,`Usa una membrana parcialmente permeable`,`Utilise une membrane partiellement perméable`],0],
[[`Needs immunosuppressant drugs`,`Necesita fármacos inmunosupresores`,`Nécessite des médicaments immunosuppresseurs`],1],
[[`There can be a long wait for a suitable donor`,`Puede haber una larga espera para un donante adecuado`,`Il peut y avoir une longue attente pour un donneur adapté`],1],
[[`Urea diffuses into dialysis fluid`,`La urea se difunde al líquido de diálisis`,`L'urée diffuse dans le liquide de dialyse`],0],
[[`Treatment must continue for as long as the kidneys are not working`,`El tratamiento debe continuar mientras los riñones no funcionen`,`Le traitement doit continuer tant que les reins ne fonctionnent pas`],0],
[[`Tissue matching is needed`,`Se necesita compatibilidad de tejidos`,`Une compatibilité tissulaire est nécessaire`],1]]}],
qs:[
{t:'mcq',q:`Why does dialysis fluid contain the same glucose concentration as normal blood?`,o:[`So glucose does not diffuse out of the patient's blood`,`So urea cannot leave`,`To make the blood more concentrated`,`To kill bacteria`],a:0,e:[`If the concentrations are equal there is no net movement of glucose, so useful glucose is not lost. Urea has none in the fluid, so it diffuses out.`,`Si las concentraciones son iguales no hay movimiento neto de glucosa, así que no se pierde. La urea no está en el líquido, por eso sale de la sangre.`,`Si les concentrations sont égales, il n'y a pas de déplacement net de glucose : il n'est pas perdu. Le liquide ne contient pas d'urée, elle diffuse donc hors du sang.`]},
{t:'mcq',q:`Why are immunosuppressant drugs given after a transplant?`,o:[`To reduce the chance of rejection`,`To make the kidney bigger`,`To remove urea`,`To increase blood pressure`],a:0,e:[`They lower the immune response so the body is less likely to attack the new kidney. The side effect is a higher infection risk.`,`Reducen la respuesta inmunitaria para que el cuerpo ataque menos al riñón nuevo. El efecto secundario es más riesgo de infección.`,`Ils réduisent la réponse immunitaire pour que le corps attaque moins le rein greffé. L'effet secondaire est un risque d'infection accru.`]},
{t:'tf',q:`During dialysis, urea moves from the dialysis fluid into the blood.`,a:false,e:[`False. Urea diffuses from the blood (high concentration) into the dialysis fluid (low concentration).`,`Falso. La urea se difunde de la sangre (alta concentración) al líquido de diálisis (baja concentración).`,`Faux. L'urée diffuse du sang (forte concentration) vers le liquide de dialyse (faible concentration).`]},
{t:'match',q:`Match the term to its meaning.`,pairs:[[`Rejection`,`Immune system attacks the transplanted organ`],[`Tissue matching`,`Choosing a donor with similar tissue type`],[`Dialysis`,`Machine removes urea from the blood`]],e:[`Rejection = immune attack. Tissue matching = similar tissue type. Dialysis = machine cleans blood.`,`Rechazo = ataque inmunitario. Compatibilidad = tejido similar. Diálisis = una máquina limpia la sangre.`,`Rejet = attaque immunitaire. Compatibilité = tissu semblable. Dialyse = une machine nettoie le sang.`]}
]});

SECTIONS.push({id:15,icon:'🩷',tags:[],
title:[`Hormones in human reproduction`,`Hormonas en la reproducción humana`,`Hormones et reproduction humaine`],
chunks:[
[`At <b>puberty</b>, reproductive hormones cause the body to change so it can reproduce.`,`En la <b>pubertad</b> (puberty), las hormonas reproductoras hacen que el cuerpo cambie para poder reproducirse.`,`À la <b>puberté</b> (puberty), les hormones de la reproduction font changer le corps pour qu'il puisse se reproduire.`],
[`<b>Testosterone</b> is the main male hormone. It is made in the <b>testes</b> and causes sperm production.`,`La <b>testosterona</b> (testosterone) es la principal hormona masculina. Se fabrica en los <b>testículos</b> y provoca la producción de espermatozoides.`,`La <b>testostérone</b> (testosterone) est la principale hormone masculine. Elle est fabriquée dans les <b>testicules</b> et déclenche la production de spermatozoïdes.`],
[`<b>Oestrogen</b> is the main female hormone. It is made in the <b>ovaries</b>. At puberty eggs start to mature and about once every 28 days one egg is released. This is <b>ovulation</b>.`,`El <b>estrógeno</b> (oestrogen) es la principal hormona femenina. Se fabrica en los <b>ovarios</b>. En la pubertad los óvulos empiezan a madurar y, aproximadamente cada 28 días, se libera uno. Es la <b>ovulación</b> (ovulation).`,`L'<b>œstrogène</b> (oestrogen) est la principale hormone féminine. Il est fabriqué dans les <b>ovaires</b>. À la puberté, les ovules commencent à mûrir et environ tous les 28 jours un ovule est libéré. C'est l'<b>ovulation</b> (ovulation).`],
[`<b>Menstrual cycle (about 28 days):</b> days 1–5 the uterus lining breaks down (period) · days 6–13 the lining rebuilds and an egg matures · <b>day 14 ovulation</b> · days 15–28 the lining stays thick; if there is no pregnancy it breaks down again.`,`<b>Ciclo menstrual</b> (menstrual cycle; unos 28 días): días 1–5 se desprende el revestimiento del útero (menstruación) · días 6–13 el revestimiento se reconstruye y madura un óvulo · <b>día 14 ovulación</b> · días 15–28 el revestimiento se mantiene grueso; si no hay embarazo, se desprende otra vez.`,`<b>Cycle menstruel</b> (menstrual cycle ; environ 28 jours) : jours 1 à 5, la muqueuse de l'utérus se détache (règles) · jours 6 à 13, la muqueuse se reconstruit et un ovule mûrit · <b>jour 14 : ovulation</b> · jours 15 à 28, la muqueuse reste épaisse ; s'il n'y a pas de grossesse, elle se détache à nouveau.`],
[`Four hormones control the cycle: <b>FSH, LH, oestrogen and progesterone</b> (see the next section).`,`Cuatro hormonas controlan el ciclo: <b>FSH, LH, estrógeno y progesterona</b> (mira la sección siguiente).`,`Quatre hormones contrôlent le cycle : <b>FSH, LH, œstrogène et progestérone</b> (voir la section suivante).`]],
vocab:V(`Puberty|Pubertad|Puberté; Testosterone|Testosterona|Testostérone; Oestrogen|Estrógeno|Œstrogène; Progesterone|Progesterona|Progestérone; FSH (follicle stimulating hormone)|FSH (hormona folículo estimulante)|FSH (hormone folliculo-stimulante); LH (luteinising hormone)|LH (hormona luteinizante)|LH (hormone lutéinisante); Menstrual cycle|Ciclo menstrual|Cycle menstruel; Ovulation|Ovulación|Ovulation; Uterus lining|Revestimiento del útero (endometrio)|Muqueuse de l'utérus (endomètre); Egg|Óvulo|Ovule; Ovary|Ovario|Ovaire; Sperm|Espermatozoide|Spermatozoïde`),
acts:[{type:'cycle',mode:'timeline'}],
qs:[
{t:'mcq',q:`On about which day of a 28-day menstrual cycle does ovulation happen?`,o:[`Day 1`,`Day 5`,`Day 14`,`Day 28`],a:2,e:[`Ovulation is around day 14: an egg is released from the ovary.`,`La ovulación ocurre hacia el día 14: se libera un óvulo del ovario.`,`L'ovulation a lieu vers le jour 14 : un ovule est libéré de l'ovaire.`]},
{t:'tf',q:`Testosterone is produced by the ovaries.`,a:false,e:[`False. Testosterone is produced by the testes. The ovaries make oestrogen and progesterone.`,`Falso. La testosterona la producen los testículos. Los ovarios fabrican estrógeno y progesterona.`,`Faux. La testostérone est produite par les testicules. Les ovaires fabriquent l'œstrogène et la progestérone.`]},
{t:'mcq',q:`What happens to the uterus lining during days 1–5?`,o:[`It breaks down`,`It gets thicker`,`It releases an egg`,`It makes testosterone`],a:0,e:[`Days 1–5 are the period: the lining breaks down and leaves the body.`,`Los días 1–5 son la menstruación: el revestimiento se desprende y sale del cuerpo.`,`Les jours 1 à 5 correspondent aux règles : la muqueuse se détache et sort du corps.`]}
]});

SECTIONS.push({id:16,icon:'📈',tags:[],
title:[`Hormonal control of the menstrual cycle`,`Control hormonal del ciclo menstrual`,`Contrôle hormonal du cycle menstruel`],
chunks:[
[`<b>FSH</b> — made in the <b>pituitary gland</b>. Causes an <b>egg to mature</b> in the ovary. Also stimulates the ovary to make <b>oestrogen</b>.`,`<b>FSH</b>: se fabrica en la <b>hipófisis</b>. Hace que un <b>óvulo madure</b> en el ovario. También estimula al ovario para que fabrique <b>estrógeno</b>.`,`<b>FSH</b> : fabriquée par l'<b>hypophyse</b>. Fait <b>mûrir un ovule</b> dans l'ovaire. Stimule aussi l'ovaire pour qu'il fabrique de l'<b>œstrogène</b>.`],
[`<b>Oestrogen</b> — made in the <b>ovaries</b>. Makes the <b>uterus lining grow</b> and repair after the period.`,`<b>Estrógeno</b>: se fabrica en los <b>ovarios</b>. Hace que el <b>revestimiento del útero crezca</b> y se repare después de la menstruación.`,`<b>Œstrogène</b> : fabriqué par les <b>ovaires</b>. Fait <b>épaissir la muqueuse de l'utérus</b> et la répare après les règles.`],
[`<b>LH</b> — made in the <b>pituitary gland</b>. Causes <b>ovulation</b> (release of the egg) around day 14.`,`<b>LH</b>: se fabrica en la <b>hipófisis</b>. Provoca la <b>ovulación</b> (liberación del óvulo) hacia el día 14.`,`<b>LH</b> : fabriquée par l'<b>hypophyse</b>. Déclenche l'<b>ovulation</b> (libération de l'ovule) vers le jour 14.`],
[`<b>Progesterone</b> — made in the <b>ovaries</b> after ovulation. <b>Maintains the uterus lining</b>. When progesterone falls, the lining breaks down (period).`,`<b>Progesterona</b>: se fabrica en los <b>ovarios</b> tras la ovulación. <b>Mantiene el revestimiento del útero</b>. Cuando baja la progesterona, el revestimiento se desprende (menstruación).`,`<b>Progestérone</b> : fabriquée par les <b>ovaires</b> après l'ovulation. <b>Maintient la muqueuse de l'utérus</b>. Quand la progestérone baisse, la muqueuse se détache (règles).`],
[`<b>How the hormones interact:</b> oestrogen <b>inhibits FSH</b> (so only one egg matures) and <b>stimulates the LH surge</b>. Progesterone <b>inhibits FSH and LH</b>, so no new egg is released while the lining is being maintained.`,`<b>Cómo interactúan las hormonas:</b> el estrógeno <b>inhibe la FSH</b> (así solo madura un óvulo) y <b>estimula el pico de LH</b>. La progesterona <b>inhibe la FSH y la LH</b>, así que no se libera otro óvulo mientras se mantiene el revestimiento.`,`<b>Interactions entre les hormones :</b> l'œstrogène <b>inhibe la FSH</b> (un seul ovule mûrit) et <b>stimule le pic de LH</b>. La progestérone <b>inhibe la FSH et la LH</b> : aucun nouvel ovule n'est libéré tant que la muqueuse est maintenue.`,'HT']],
vocab:V(`FSH|FSH|FSH; LH|LH|LH; Oestrogen|Estrógeno|Œstrogène; Progesterone|Progesterona|Progestérone; Pituitary gland|Hipófisis|Hypophyse; Ovary|Ovario|Ovaire; Egg matures|Madura el óvulo|L'ovule mûrit; Ovulation|Ovulación|Ovulation; Uterus lining|Revestimiento del útero|Muqueuse de l'utérus; Maintain|Mantener|Maintenir; Inhibit|Inhibir|Inhiber; Stimulate|Estimular|Stimuler`),
acts:[{type:'cycle',mode:'hormones'},
{type:'match',title:[`Match each hormone`,`Relaciona cada hormona`,`Associe chaque hormone`],instr:I_MATCH,cols:[[`Hormone`,`Hormona`,`Hormone`],[`Made in`,`Se fabrica en`,`Fabriquée par`],[`Main job`,`Función principal`,`Rôle principal`]],rows:[
[[`FSH`,`FSH`,`FSH`],[`Pituitary gland`,`Hipófisis`,`Hypophyse`],[`Causes an egg to mature`,`Hace madurar un óvulo`,`Fait mûrir un ovule`]],
[[`LH`,`LH`,`LH`],[`Pituitary gland`,`Hipófisis`,`Hypophyse`],[`Causes ovulation`,`Provoca la ovulación`,`Déclenche l'ovulation`]],
[[`Oestrogen`,`Estrógeno`,`Œstrogène`],[`Ovary`,`Ovario`,`Ovaire`],[`Makes the uterus lining grow`,`Hace crecer el revestimiento del útero`,`Fait épaissir la muqueuse de l'utérus`]],
[[`Progesterone`,`Progesterona`,`Progestérone`],[`Ovary`,`Ovario`,`Ovaire`],[`Maintains the uterus lining`,`Mantiene el revestimiento del útero`,`Maintient la muqueuse de l'utérus`]]]}],
qs:[
{t:'mcq',q:`Which hormone causes the release of an egg (ovulation)?`,o:[`FSH`,`LH`,`Progesterone`,`Testosterone`],a:1,e:[`A surge of LH around day 14 causes ovulation. FSH makes the egg mature earlier.`,`Un pico de LH hacia el día 14 provoca la ovulación. La FSH hace madurar el óvulo antes.`,`Un pic de LH vers le jour 14 déclenche l'ovulation. La FSH fait mûrir l'ovule plus tôt.`]},
{t:'data',q:`The table shows hormone levels (arbitrary units) during a cycle. On which day is LH highest?`,table:[[`Day`,`1`,`7`,`14`,`21`,`28`],[`LH`,`2`,`3`,`20`,`2`,`2`],[`Progesterone`,`1`,`1`,`2`,`15`,`2`]],o:[`Day 1`,`Day 7`,`Day 14`,`Day 21`],a:2,e:[`LH peaks at 20 units on day 14, when ovulation happens. Progesterone peaks later (day 21).`,`La LH alcanza 20 unidades el día 14, cuando ocurre la ovulación. La progesterona alcanza su máximo más tarde (día 21).`,`La LH atteint 20 unités le jour 14, au moment de l'ovulation. La progestérone culmine plus tard (jour 21).`]},
{t:'mcq',q:`(Higher Tier) What does progesterone do to FSH and LH?`,o:[`Inhibits them`,`Stimulates them`,`Makes them`,`Has no effect`],a:0,e:[`Progesterone inhibits FSH and LH, so no new egg matures while the lining is maintained.`,`La progesterona inhibe la FSH y la LH, así que no madura otro óvulo mientras se mantiene el revestimiento.`,`La progestérone inhibe la FSH et la LH : aucun nouvel ovule ne mûrit tant que la muqueuse est maintenue.`]},
{t:'tf',q:`Progesterone helps to maintain the lining of the uterus.`,a:true,e:[`True. When progesterone falls, the lining breaks down.`,`Verdadero. Cuando la progesterona baja, el revestimiento se desprende.`,`Vrai. Quand la progestérone baisse, la muqueuse se détache.`]}

SECTIONS.push({id:17,icon:'🛡️',tags:[],
title:[`Contraception`,`Anticoncepción`,`Contraception`],
chunks:[
[`<b>Contraception</b> helps prevent pregnancy. Methods are <b>hormonal</b> or <b>non-hormonal</b>. Think about how each works, its advantages and its disadvantages.`,`La <b>anticoncepción</b> (contraception) ayuda a evitar el embarazo. Los métodos son <b>hormonales</b> o <b>no hormonales</b>. Piensa cómo actúa cada uno, sus ventajas y sus desventajas.`,`La <b>contraception</b> (contraception) aide à éviter une grossesse. Les méthodes sont <b>hormonales</b> ou <b>non hormonales</b>. Réfléchis à leur fonctionnement, leurs avantages et leurs inconvénients.`],
[`<b>Oral contraceptive pill:</b> contains oestrogen and progesterone. It <b>inhibits FSH</b> so eggs do not mature. Very effective if taken every day. Possible side effects. Does <b>not</b> protect against STIs.`,`<b>Píldora anticonceptiva oral</b> (oral contraceptive): contiene estrógeno y progesterona. <b>Inhibe la FSH</b>, así que los óvulos no maduran. Muy eficaz si se toma a diario. Posibles efectos secundarios. <b>No</b> protege frente a las ITS.`,`<b>Pilule contraceptive</b> (oral contraceptive) : contient de l'œstrogène et de la progestérone. Elle <b>inhibe la FSH</b> : les ovules ne mûrissent pas. Très efficace si elle est prise chaque jour. Effets secondaires possibles. Elle ne protège <b>pas</b> contre les IST.`],
[`<b>Progesterone-only methods:</b> injection, implant or skin patch release progesterone slowly. They can last months or years. Progesterone stops eggs being released and thickens mucus at the cervix. Side effects can happen.`,`<b>Métodos solo con progesterona:</b> inyección, implante o parche liberan progesterona lentamente. Pueden durar meses o años. La progesterona impide que se liberen óvulos y espesa el moco del cuello uterino. Puede haber efectos secundarios.`,`<b>Méthodes à la progestérone seule :</b> injection, implant ou patch libèrent lentement de la progestérone. Elles peuvent durer des mois ou des années. La progestérone empêche la libération d'ovules et épaissit la glaire du col de l'utérus. Des effets secondaires sont possibles.`],
[`<b>Barrier methods</b> (condoms, diaphragm) stop sperm reaching the egg. <b>Condoms also protect against STIs</b>. They must be used correctly every time. <b>Spermicides</b> kill or disable sperm.`,`Los <b>métodos de barrera</b> (condones, diafragma) impiden que los espermatozoides lleguen al óvulo. <b>Los condones también protegen frente a las ITS</b>. Hay que usarlos bien siempre. Los <b>espermicidas</b> (spermicides) matan o inmovilizan los espermatozoides.`,`Les <b>méthodes barrières</b> (préservatifs, diaphragme) empêchent les spermatozoïdes d'atteindre l'ovule. <b>Les préservatifs protègent aussi contre les IST</b>. Ils doivent être bien utilisés à chaque fois. Les <b>spermicides</b> (spermicides) tuent ou immobilisent les spermatozoïdes.`],
[`<b>Intrauterine devices (IUD):</b> a small device fitted in the uterus. It can prevent the implantation of an embryo or release progesterone. Long-lasting; must be fitted by a professional.`,`<b>Dispositivos intrauterinos (DIU)</b> (IUD): un pequeño dispositivo colocado en el útero. Puede impedir la implantación de un embrión o liberar progesterona. Duran mucho; debe colocarlos un profesional.`,`<b>Dispositifs intra-utérins (DIU / stérilet)</b> (IUD) : un petit dispositif placé dans l'utérus. Il peut empêcher l'implantation d'un embryon ou libérer de la progestérone. Longue durée ; posé par un professionnel.`],
[`<b>Abstaining</b> from intercourse when an egg may be in the oviduct (natural method): no chemicals, but unreliable because cycles vary. <b>Sterilisation</b>: cutting or tying the oviducts or sperm ducts; very effective but permanent.`,`<b>Abstinencia</b> cuando puede haber un óvulo en el oviducto (método natural): sin sustancias químicas, pero poco fiable porque los ciclos varían. <b>Esterilización</b> (sterilisation): cortar o ligar los oviductos o los conductos deferentes; muy eficaz pero permanente.`,`<b>Abstinence</b> quand un ovule peut être dans l'oviducte (méthode naturelle) : sans produits chimiques, mais peu fiable car les cycles varient. <b>Stérilisation</b> (sterilisation) : section ou ligature des oviductes ou des canaux déférents ; très efficace mais définitive.`]],
vocab:V(`Contraception|Anticoncepción|Contraception; Oral contraceptive (pill)|Anticonceptivo oral (píldora)|Pilule contraceptive; Progesterone|Progesterona|Progestérone; Barrier method|Método de barrera|Méthode barrière; Condom|Preservativo (condón)|Préservatif; Intrauterine device (IUD)|Dispositivo intrauterino (DIU)|Dispositif intra-utérin (DIU, stérilet); Spermicide|Espermicida|Spermicide; Abstain|Abstenerse|S'abstenir; Sterilisation|Esterilización|Stérilisation; STI (sexually transmitted infection)|ITS (infección de transmisión sexual)|IST (infection sexuellement transmissible); Advantage / disadvantage|Ventaja / desventaja|Avantage / inconvénient`),
acts:[{type:'match',title:[`Compare contraception methods`,`Compara los métodos anticonceptivos`,`Compare les méthodes de contraception`],instr:I_MATCH,cols:[[`Method`,`Método`,`Méthode`],[`How it works`,`Cómo actúa`,`Fonctionnement`],[`A disadvantage`,`Una desventaja`,`Un inconvénient`]],rows:[
[[`Oral contraceptive pill`,`Píldora anticonceptiva`,`Pilule contraceptive`],[`Hormones stop eggs maturing (inhibit FSH)`,`Las hormonas impiden madurar los óvulos (inhiben la FSH)`,`Les hormones empêchent les ovules de mûrir (inhibent la FSH)`],[`Must be taken every day; side effects; no STI protection`,`Hay que tomarla a diario; efectos secundarios; no protege de ITS`,`À prendre chaque jour ; effets secondaires ; pas de protection contre les IST`]],
[[`Condom`,`Preservativo`,`Préservatif`],[`Barrier stops sperm reaching the egg`,`Una barrera impide que los espermatozoides lleguen al óvulo`,`Une barrière empêche les spermatozoïdes d'atteindre l'ovule`],[`Can tear or slip if not used correctly`,`Puede romperse o salirse si no se usa bien`,`Peut se déchirer ou glisser s'il est mal utilisé`]],
[[`IUD (intrauterine device)`,`DIU (dispositivo intrauterino)`,`DIU (stérilet)`],[`Prevents an embryo implanting in the uterus`,`Impide que un embrión se implante en el útero`,`Empêche un embryon de s'implanter dans l'utérus`],[`Must be fitted by a professional; no STI protection`,`Debe colocarlo un profesional; no protege de ITS`,`Doit être posé par un professionnel ; pas de protection contre les IST`]],
[[`Spermicide`,`Espermicida`,`Spermicide`],[`Kills or disables sperm`,`Mata o inmoviliza los espermatozoides`,`Tue ou immobilise les spermatozoïdes`],[`Not very effective on its own`,`Poco eficaz por sí solo`,`Peu efficace seul`]],
[[`Abstaining when an egg may be present`,`Abstenerse cuando puede haber un óvulo`,`S'abstenir quand un ovule peut être présent`],[`No sperm meet the egg in the fertile period`,`No hay espermatozoides cuando hay óvulo (periodo fértil)`,`Pas de rencontre spermatozoïde-ovule pendant la période fertile`],[`Unreliable because cycles vary`,`Poco fiable porque los ciclos varían`,`Peu fiable car les cycles varient`]],
[[`Sterilisation`,`Esterilización`,`Stérilisation`],[`Tubes are cut or tied so egg and sperm cannot meet`,`Se cortan o ligan los conductos: óvulo y espermatozoide no se encuentran`,`Les canaux sont sectionnés ou ligaturés : ovule et spermatozoïde ne se rencontrent pas`],[`Permanent and hard to reverse`,`Permanente y difícil de revertir`,`Définitive et difficile à inverser`]]]}],
qs:[
{t:'mcq',q:`Which contraceptive also gives protection against sexually transmitted infections?`,o:[`The pill`,`Condom`,`IUD`,`Progesterone implant`],a:1,e:[`Condoms are a barrier, so they also stop many infections passing between partners. Hormonal methods and IUDs do not.`,`Los condones son una barrera, por eso también frenan muchas infecciones entre parejas. Los métodos hormonales y el DIU no.`,`Les préservatifs sont une barrière : ils limitent aussi le passage de nombreuses infections entre partenaires. Les méthodes hormonales et le DIU, non.`]},
{t:'gap',q:`The combined pill contains oestrogen and progesterone. They {0} FSH, so eggs do not {1}.`,b:[[`inhibit`,`stimulate`,`make`],[`mature`,`travel`,`die`]],a:[0,0],e:[`The hormones inhibit FSH, so no egg matures.`,`Las hormonas inhiben la FSH, así que no madura ningún óvulo.`,`Les hormones inhibent la FSH : aucun ovule ne mûrit.`]},
{t:'tf',q:`Sterilisation is easy to reverse.`,a:false,e:[`False. Sterilisation is permanent and usually very hard to reverse.`,`Falso. La esterilización es permanente y suele ser muy difícil de revertir.`,`Faux. La stérilisation est définitive et en général très difficile à inverser.`]},
{t:'mcq',q:`Why is abstaining around the time of ovulation an unreliable method?`,o:[`Menstrual cycles can vary so the fertile time is hard to predict`,`Sperm cannot survive`,`It stops the pituitary working`,`It has hormonal side effects`],a:0,e:[`Cycle length changes from month to month, so day 14 is not always when the egg is released.`,`La duración del ciclo cambia de un mes a otro, así que el día 14 no siempre es cuando se libera el óvulo.`,`La durée du cycle varie d'un mois à l'autre : le jour 14 n'est pas toujours celui de la libération de l'ovule.`]}
]});

SECTIONS.push({id:18,icon:'👶',tags:['HT'],
title:[`Fertility and IVF`,`Fertilidad y FIV`,`Fertilité et FIV`],
chunks:[
[`<b>Fertility drugs</b> contain <b>FSH and LH</b>. They are given to women who do not release eggs regularly. They stimulate <b>egg maturation</b> and <b>ovulation</b>.`,`Los <b>fármacos de fertilidad</b> (fertility drugs) contienen <b>FSH y LH</b>. Se dan a mujeres que no liberan óvulos con regularidad. Estimulan la <b>maduración de los óvulos</b> y la <b>ovulación</b>.`,`Les <b>médicaments de fertilité</b> (fertility drugs) contiennent de la <b>FSH et de la LH</b>. Ils sont donnés aux femmes qui ne libèrent pas régulièrement d'ovules. Ils stimulent la <b>maturation des ovules</b> et l'<b>ovulation</b>.`],
[`<b>IVF</b> (in vitro fertilisation) helps when a couple cannot have a baby naturally. Eggs are fertilised <b>outside the body</b>, then embryos are put into the uterus.`,`La <b>FIV</b> (IVF, fecundación in vitro) ayuda cuando una pareja no puede tener un bebé de forma natural. Los óvulos se fecundan <b>fuera del cuerpo</b> y después se colocan embriones en el útero.`,`La <b>FIV</b> (IVF, fécondation in vitro) aide un couple qui ne peut pas avoir d'enfant naturellement. Les ovules sont fécondés <b>hors du corps</b>, puis des embryons sont placés dans l'utérus.`],
[`<b>Advantages:</b> can give a baby to people who could not have one naturally. <b>Disadvantages:</b> emotionally and physically stressful; low success rate; the hormones can cause side effects; more than one embryo can lead to <b>multiple births</b>, which are risky for mother and babies.`,`<b>Ventajas:</b> puede dar un bebé a personas que no podrían tenerlo de forma natural. <b>Desventajas:</b> estresante emocional y físicamente; baja tasa de éxito; las hormonas pueden causar efectos secundarios; más de un embrión puede dar lugar a <b>embarazos múltiples</b>, arriesgados para la madre y los bebés.`,`<b>Avantages :</b> peut donner un enfant à des personnes qui ne pourraient pas en avoir naturellement. <b>Inconvénients :</b> éprouvant émotionnellement et physiquement ; faible taux de réussite ; les hormones peuvent avoir des effets secondaires ; plusieurs embryons peuvent entraîner des <b>naissances multiples</b>, risquées pour la mère et les bébés.`]],
vocab:V(`Fertility|Fertilidad|Fertilité; Fertility drug|Fármaco de fertilidad|Médicament de fertilité; IVF (in vitro fertilisation)|FIV (fecundación in vitro)|FIV (fécondation in vitro); Embryo|Embrión|Embryon; Fertilisation|Fecundación|Fécondation; Mature|Madurar|Mûrir; Uterus|Útero|Utérus; Success rate|Tasa de éxito|Taux de réussite; Multiple births|Embarazos múltiples|Naissances multiples; Side effect|Efecto secundario|Effet secondaire; Laboratory|Laboratorio|Laboratoire`),
acts:[{type:'order',title:[`Put the IVF steps in order`,`Ordena los pasos de la FIV`,`Remets les étapes de la FIV dans l'ordre`],instr:I_ORDER,items:[
[`<b>FSH and LH</b> given to the mother`,`Se dan <b>FSH y LH</b> a la madre`,`On donne de la <b>FSH et de la LH</b> à la mère`],
[`<b>Eggs mature</b> in the ovaries`,`Los <b>óvulos maduran</b> en los ovarios`,`Les <b>ovules mûrissent</b> dans les ovaires`],
[`<b>Eggs are collected</b>`,`Se <b>recogen los óvulos</b>`,`Les <b>ovules sont prélevés</b>`],
[`<b>Fertilised with sperm</b> in the laboratory`,`Se <b>fecundan con espermatozoides</b> en el laboratorio`,`Ils sont <b>fécondés par des spermatozoïdes</b> au laboratoire`],
[`<b>Embryos develop</b> in the laboratory`,`Los <b>embriones se desarrollan</b> en el laboratorio`,`Les <b>embryons se développent</b> au laboratoire`],
[`One or two <b>embryos are put into the uterus</b>`,`Se <b>colocan</b> uno o dos <b>embriones en el útero</b>`,`Un ou deux <b>embryons sont placés dans l'utérus</b>`]]}],
qs:[
{t:'mcq',q:`Which hormones are in fertility drugs?`,o:[`FSH and LH`,`Insulin and glucagon`,`Testosterone and adrenaline`,`Thyroxine and ADH`],a:0,e:[`FSH makes eggs mature and LH causes ovulation, so both are used in fertility treatment.`,`La FSH hace madurar los óvulos y la LH provoca la ovulación, por eso ambas se usan en los tratamientos de fertilidad.`,`La FSH fait mûrir les ovules et la LH déclenche l'ovulation : les deux servent dans les traitements de fertilité.`]},
{t:'order',q:`Put these IVF stages in order.`,items:[`Eggs collected`,`Fertilisation in the laboratory`,`Embryos develop`,`Embryo transferred to the uterus`],e:[`Order: eggs collected → fertilised in the lab → embryos develop → embryo transferred to the uterus.`,`Orden: se recogen los óvulos → fecundación en el laboratorio → se desarrollan los embriones → transferencia al útero.`,`Ordre : ovules prélevés → fécondation au laboratoire → développement des embryons → transfert dans l'utérus.`]},
{t:'mcq',q:`Which is a disadvantage of IVF?`,o:[`It can lead to multiple births`,`It is always successful`,`It needs no hormones`,`It has no emotional effects`],a:0,e:[`Putting in more than one embryo can cause multiple births, which are riskier. IVF is not always successful and can be stressful.`,`Colocar más de un embrión puede causar embarazos múltiples, más arriesgados. La FIV no siempre funciona y puede ser estresante.`,`Placer plusieurs embryons peut causer des naissances multiples, plus risquées. La FIV ne réussit pas toujours et peut être éprouvante.`]}
]});

SECTIONS.push({id:19,icon:'🔄',tags:['HT'],
title:[`Negative feedback: thyroxine and adrenaline`,`Retroalimentación negativa: tiroxina y adrenalina`,`Rétroaction négative : thyroxine et adrénaline`],
chunks:[
[`<b>Negative feedback</b> means a change is detected and the response <b>reverses</b> it. This keeps conditions within a suitable range.`,`La <b>retroalimentación negativa</b> (negative feedback) significa que se detecta un cambio y la respuesta lo <b>revierte</b>. Así las condiciones se mantienen dentro de un rango adecuado.`,`La <b>rétroaction négative</b> (negative feedback) signifie qu'un changement est détecté et que la réponse l'<b>inverse</b>. Cela maintient les conditions dans une plage adaptée.`],
[`<b>Thyroxine</b> is made by the <b>thyroid gland</b>. It controls the <b>basal metabolic rate</b> (speed of chemical reactions at rest) and is important for <b>growth and development</b>.`,`La <b>tiroxina</b> (thyroxine) la fabrica la <b>glándula tiroides</b>. Controla la <b>tasa metabólica basal</b> (basal metabolic rate; velocidad de las reacciones químicas en reposo) y es importante para el <b>crecimiento y el desarrollo</b>.`,`La <b>thyroxine</b> (thyroxine) est fabriquée par la <b>glande thyroïde</b>. Elle contrôle le <b>métabolisme de base</b> (basal metabolic rate ; vitesse des réactions chimiques au repos) et est importante pour la <b>croissance et le développement</b>.`],
[`<b>Feedback loop:</b> low thyroxine → pituitary releases more <b>TSH</b> → TSH stimulates the thyroid → thyroxine rises → high thyroxine <b>inhibits TSH</b> release → thyroxine falls.`,`<b>Bucle de retroalimentación:</b> poca tiroxina → la hipófisis libera más <b>TSH</b> → la TSH estimula el tiroides → sube la tiroxina → la tiroxina alta <b>inhibe</b> la liberación de <b>TSH</b> → baja la tiroxina.`,`<b>Boucle de rétroaction :</b> peu de thyroxine → l'hypophyse libère plus de <b>TSH</b> → la TSH stimule la thyroïde → la thyroxine augmente → une thyroxine élevée <b>inhibe</b> la libération de <b>TSH</b> → la thyroxine baisse.`],
[`<b>Adrenaline</b> is made by the <b>adrenal glands</b> (above the kidneys). It is released in <b>fear or stress</b> to prepare the body for <b>fight or flight</b>.`,`La <b>adrenalina</b> (adrenaline) la fabrican las <b>glándulas suprarrenales</b> (encima de los riñones). Se libera con <b>miedo o estrés</b> para preparar el cuerpo para la <b>lucha o la huida</b>.`,`L'<b>adrénaline</b> (adrenaline) est fabriquée par les <b>glandes surrénales</b> (au-dessus des reins). Elle est libérée lors de la <b>peur ou du stress</b> pour préparer le corps au <b>combat ou à la fuite</b>.`],
[`Adrenaline <b>increases heart rate</b>, so more <b>oxygen and glucose</b> are delivered in the blood to the muscles for respiration. Muscles can release more energy.`,`La adrenalina <b>aumenta el ritmo cardiaco</b>, así llegan más <b>oxígeno y glucosa</b> por la sangre a los músculos para la respiración celular. Los músculos pueden liberar más energía.`,`L'adrénaline <b>augmente le rythme cardiaque</b> : plus d'<b>oxygène et de glucose</b> arrivent par le sang aux muscles pour la respiration cellulaire. Les muscles peuvent libérer plus d'énergie.`]],
vocab:V(`Negative feedback|Retroalimentación negativa|Rétroaction négative; Thyroxine|Tiroxina|Thyroxine; Thyroid gland|Glándula tiroides|Glande thyroïde; TSH (thyroid stimulating hormone)|TSH (hormona estimulante del tiroides)|TSH (hormone thyréotrope); Basal metabolic rate|Tasa metabólica basal|Métabolisme de base; Growth and development|Crecimiento y desarrollo|Croissance et développement; Adrenaline|Adrenalina|Adrénaline; Adrenal gland|Glándula suprarrenal|Glande surrénale; Fight or flight|Lucha o huida|Combat ou fuite; Heart rate|Frecuencia cardiaca|Rythme cardiaque; Inhibit|Inhibir|Inhiber`),

[`TSH stimulates the <b>thyroid gland</b> to release <b>thyroxine</b>`,`La TSH estimula la <b>glándula tiroides</b> para que libere <b>tiroxina</b>`,`La TSH stimule la <b>thyroïde</b> pour qu'elle libère de la <b>thyroxine</b>`],
[`Thyroxine level <b>rises</b> back to normal`,`El nivel de tiroxina <b>sube</b> y vuelve a la normalidad`,`Le taux de thyroxine <b>augmente</b> et revient à la normale`]]},

[`Thyroxine level in the blood <b>rises</b>`,`El nivel de tiroxina en la sangre <b>sube</b>`,`Le taux de thyroxine dans le sang <b>augmente</b>`],

[`The thyroid is stimulated less, so it releases <b>less thyroxine</b>`,`El tiroides recibe menos estímulo y libera <b>menos tiroxina</b>`,`La thyroïde est moins stimulée : elle libère <b>moins de thyroxine</b>`],

qs:[
{t:'mcq',q:`Which gland produces thyroxine?`,o:[`Pituitary`,`Thyroid`,`Adrenal`,`Pancreas`],a:1,e:[`The thyroid gland makes thyroxine. The pituitary makes TSH, which stimulates the thyroid.`,`El tiroides fabrica la tiroxina. La hipófisis fabrica la TSH, que estimula el tiroides.`,`La thyroïde fabrique la thyroxine. L'hypophyse fabrique la TSH, qui stimule la thyroïde.`]},
{t:'mcq',q:`What happens to TSH release when thyroxine level is high?`,o:[`It is inhibited (less TSH)`,`It increases`,`It stays the same`,`It turns into thyroxine`],a:0,e:[`High thyroxine inhibits TSH release. This is negative feedback: the change is reversed.`,`Mucha tiroxina inhibe la liberación de TSH. Es retroalimentación negativa: se revierte el cambio.`,`Beaucoup de thyroxine inhibe la libération de TSH. C'est de la rétroaction négative : le changement est inversé.`]},
{t:'tf',q:`Adrenaline decreases heart rate.`,a:false,e:[`False. Adrenaline increases heart rate, sending more oxygen and glucose to the muscles.`,`Falso. La adrenalina aumenta el ritmo cardiaco y envía más oxígeno y glucosa a los músculos.`,`Faux. L'adrénaline augmente le rythme cardiaque et envoie plus d'oxygène et de glucose aux muscles.`]},

SECTIONS.push({id:20,icon:'🌱',tags:['BIO'],
title:[`Plant hormones and tropisms`,`Hormonas vegetales y tropismos`,`Hormones végétales et tropismes`],
chunks:[
[`Plants use <b>hormones</b> to control growth. A <b>tropism</b> is a growth response to a stimulus. <b>Positive</b> tropism = growth <b>towards</b> the stimulus. <b>Negative</b> tropism = growth <b>away from</b> it.`,`Las plantas usan <b>hormonas</b> para controlar el crecimiento. Un <b>tropismo</b> (tropism) es una respuesta de crecimiento a un estímulo. Tropismo <b>positivo</b> = crece <b>hacia</b> el estímulo. Tropismo <b>negativo</b> = crece <b>en sentido contrario</b>.`,`Les plantes utilisent des <b>hormones</b> pour contrôler leur croissance. Un <b>tropisme</b> (tropism) est une réponse de croissance à un stimulus. Tropisme <b>positif</b> = croissance <b>vers</b> le stimulus. Tropisme <b>négatif</b> = croissance <b>à l'opposé</b>.`],
[`<b>Auxin</b> is a plant hormone made at the shoot tip. In shoots it makes cells <b>elongate</b> (get longer). <b>Phototropism</b> = response to light. <b>Gravitropism</b> = response to gravity.`,`La <b>auxina</b> (auxin) es una hormona vegetal que se forma en el ápice del tallo. En los tallos hace que las células se <b>alarguen</b> (elongate). <b>Fototropismo</b> (phototropism) = respuesta a la luz. <b>Gravitropismo</b> (gravitropism) = respuesta a la gravedad.`,`L'<b>auxine</b> (auxin) est une hormone végétale fabriquée à l'extrémité de la tige. Dans les tiges, elle fait <b>s'allonger</b> les cellules (elongate). <b>Phototropisme</b> (phototropism) = réponse à la lumière. <b>Gravitropisme</b> (gravitropism) = réponse à la gravité.`],
[`<b>Shoot + light from one side:</b> auxin moves to the <b>shaded side</b> → cells there elongate more → the shoot bends <b>towards the light</b> (positive phototropism).`,`<b>Tallo con luz por un lado:</b> la auxina se desplaza al <b>lado sombreado</b> → allí las células se alargan más → el tallo se curva <b>hacia la luz</b> (fototropismo positivo).`,`<b>Tige avec lumière d'un seul côté :</b> l'auxine se déplace vers le <b>côté à l'ombre</b> → les cellules de ce côté s'allongent davantage → la tige se courbe <b>vers la lumière</b> (phototropisme positif).`],
[`<b>Shoot + gravity:</b> auxin collects on the <b>lower side</b> → the lower side grows faster → the shoot grows <b>upwards</b> (negative gravitropism).`,`<b>Tallo y gravedad:</b> la auxina se acumula en el <b>lado inferior</b> → ese lado crece más rápido → el tallo crece <b>hacia arriba</b> (gravitropismo negativo).`,`<b>Tige et gravité :</b> l'auxine s'accumule sur le <b>côté inférieur</b> → ce côté pousse plus vite → la tige pousse <b>vers le haut</b> (gravitropisme négatif).`],
[`<b>Root + gravity:</b> auxin collects on the <b>lower side</b> but in roots it <b>slows</b> elongation there → the upper side grows faster → the root bends <b>downwards</b> (positive gravitropism).`,`<b>Raíz y gravedad:</b> la auxina se acumula en el <b>lado inferior</b> pero en las raíces <b>frena</b> el alargamiento allí → el lado superior crece más → la raíz se curva <b>hacia abajo</b> (gravitropismo positivo).`,`<b>Racine et gravité :</b> l'auxine s'accumule sur le <b>côté inférieur</b> mais, dans les racines, elle y <b>ralentit</b> l'allongement → le côté supérieur pousse plus vite → la racine se courbe <b>vers le bas</b> (gravitropisme positif).`]],
vocab:V(`Plant hormone|Hormona vegetal|Hormone végétale; Auxin|Auxina|Auxine; Tropism|Tropismo|Tropisme; Phototropism|Fototropismo|Phototropisme; Gravitropism|Gravitropismo|Gravitropisme; Positive tropism|Tropismo positivo|Tropisme positif; Negative tropism|Tropismo negativo|Tropisme négatif; Shoot|Tallo (parte aérea)|Tige (partie aérienne); Root|Raíz|Racine; Elongation|Elongación (alargamiento)|Élongation (allongement); Shaded side|Lado sombreado|Côté à l'ombre; Gravity|Gravedad|Gravité`),
acts:[{type:'toggle',reveal:true,title:[`Where does auxin go?`,`¿Adónde va la auxina?`,`Où va l'auxine ?`],instr:I_TOG,states:[
{label:[`Shoot, light from one side`,`Tallo, luz por un lado`,`Tige, lumière d'un côté`],svg:auxSvg('light'),steps:[
[`Light shines from <b>one side</b>`,`La luz llega por <b>un lado</b>`,`La lumière arrive d'<b>un seul côté</b>`],
[`<b>More auxin accumulates</b> on the shaded side`,`Se acumula <b>más auxina</b> en el lado sombreado`,`<b>Plus d'auxine s'accumule</b> du côté à l'ombre`],
[`Cells on the shaded side <b>elongate more</b>`,`Las células del lado sombreado <b>se alargan más</b>`,`Les cellules du côté à l'ombre <b>s'allongent davantage</b>`],
[`The shoot bends <b>towards the light</b> (positive phototropism)`,`El tallo se curva <b>hacia la luz</b> (fototropismo positivo)`,`La tige se courbe <b>vers la lumière</b> (phototropisme positif)`]]},
{label:[`Shoot and gravity`,`Tallo y gravedad`,`Tige et gravité`],svg:auxSvg('shootG'),steps:[
[`A shoot lies on its side`,`Un tallo está tumbado`,`Une tige est couchée`],
[`Auxin collects on the <b>lower side</b>`,`La auxina se acumula en el <b>lado inferior</b>`,`L'auxine s'accumule sur le <b>côté inférieur</b>`],
[`Lower cells <b>elongate more</b>`,`Las células inferiores <b>se alargan más</b>`,`Les cellules inférieures <b>s'allongent davantage</b>`],
[`The shoot bends <b>upwards</b> (negative gravitropism)`,`El tallo se curva <b>hacia arriba</b> (gravitropismo negativo)`,`La tige se courbe <b>vers le haut</b> (gravitropisme négatif)`]]},
{label:[`Root and gravity`,`Raíz y gravedad`,`Racine et gravité`],svg:auxSvg('rootG'),steps:[
[`A root lies on its side`,`Una raíz está tumbada`,`Une racine est couchée`],
[`Auxin collects on the <b>lower side</b>`,`La auxina se acumula en el <b>lado inferior</b>`,`L'auxine s'accumule sur le <b>côté inférieur</b>`],
[`In roots, this auxin <b>slows growth</b> on the lower side`,`En las raíces, esta auxina <b>frena el crecimiento</b> del lado inferior`,`Dans les racines, cette auxine <b>ralentit la croissance</b> du côté inférieur`],
[`The upper side grows more, so the root bends <b>downwards</b> (positive gravitropism)`,`El lado superior crece más, así que la raíz se curva <b>hacia abajo</b> (gravitropismo positivo)`,`Le côté supérieur pousse davantage : la racine se courbe <b>vers le bas</b> (gravitropisme positif)`]]}]}],
qs:[
{t:'mcq',q:`A shoot is lit from the right only. Where does auxin accumulate?`,o:[`On the shaded (left) side`,`On the lit (right) side`,`Only in the roots`,`Equally on both sides`],a:0,e:[`Auxin moves to the shaded side, where cells elongate more, so the shoot bends towards the light.`,`La auxina se desplaza al lado sombreado, donde las células se alargan más, así el tallo se curva hacia la luz.`,`L'auxine se déplace vers le côté à l'ombre, où les cellules s'allongent davantage : la tige se courbe vers la lumière.`]},
{t:'match',q:`Match each response to the correct tropism.`,pairs:[[`Shoot grows towards light`,`Positive phototropism`],[`Shoot grows upwards`,`Negative gravitropism`],[`Root grows downwards`,`Positive gravitropism`]],e:[`Towards light = positive phototropism. Shoot up (away from gravity) = negative gravitropism. Root down = positive gravitropism.`,`Hacia la luz = fototropismo positivo. Tallo hacia arriba (contra la gravedad) = gravitropismo negativo. Raíz hacia abajo = gravitropismo positivo.`,`Vers la lumière = phototropisme positif. Tige vers le haut (contre la gravité) = gravitropisme négatif. Racine vers le bas = gravitropisme positif.`]},
{t:'tf',q:`Auxin makes shoot cells on the shaded side elongate more.`,a:true,e:[`True. That is why a shoot bends towards a light source.`,`Verdadero. Por eso un tallo se curva hacia una fuente de luz.`,`Vrai. C'est pourquoi une tige se courbe vers une source de lumière.`]},
{t:'gap',q:`A positive tropism is growth {0} the stimulus. A negative tropism is growth {1} from it.`,b:[[`towards`,`away`,`around`],[`away`,`towards`,`under`]],a:[0,0],e:[`Positive = towards the stimulus. Negative = away from it.`,`Positivo = hacia el estímulo. Negativo = en sentido contrario.`,`Positif = vers le stimulus. Négatif = à l'opposé.`]}
]});

SECTIONS.push({id:21,icon:'🍌',tags:['BIO','HT'],
title:[`Commercial uses of plant hormones`,`Usos comerciales de las hormonas vegetales`,`Utilisations commerciales des hormones végétales`],
chunks:[
[`<b>Auxins</b> — used as <b>selective weedkillers</b> (they make broad-leaved weeds grow too fast and die, but do not harm narrow-leaved crops such as grass), in <b>rooting powders</b> (cuttings grow roots quickly) and in <b>tissue culture</b> (to grow many new plants from a few cells).`,`<b>Auxinas</b>: se usan como <b>herbicidas selectivos</b> (selective weedkillers; hacen que las malas hierbas de hoja ancha crezcan demasiado rápido y mueran, sin dañar cultivos de hoja estrecha como el césped), en <b>polvos de enraizamiento</b> (rooting powders; los esquejes echan raíces rápido) y en el <b>cultivo de tejidos</b> (tissue culture; para obtener muchas plantas nuevas a partir de pocas células).`,`<b>Auxines</b> : utilisées comme <b>désherbants sélectifs</b> (selective weedkillers ; elles font pousser trop vite les mauvaises herbes à larges feuilles, qui meurent, sans nuire aux plantes à feuilles étroites comme le gazon), dans les <b>poudres d'enracinement</b> (rooting powders ; les boutures s'enracinent vite) et en <b>culture de tissus</b> (tissue culture ; pour obtenir de nombreuses plantes à partir de quelques cellules).`,'BIO'],
[`<b>Gibberellins</b> — <b>end seed dormancy</b> (seeds germinate), <b>promote flowering</b> and can <b>increase fruit size</b>.`,`<b>Giberelinas</b> (gibberellins): <b>terminan la latencia de las semillas</b> (germinan), <b>favorecen la floración</b> y pueden <b>aumentar el tamaño de los frutos</b>.`,`<b>Gibbérellines</b> (gibberellins) : <b>mettent fin à la dormance des graines</b> (elles germent), <b>favorisent la floraison</b> et peuvent <b>augmenter la taille des fruits</b>.`,'HT'],
[`<b>Ethene</b> — a gas that <b>controls fruit ripening</b>. Fruit can be picked unripe, stored and transported without ripening, then ethene is used to ripen it at the destination. Ripening can be slowed by removing ethene in storage.`,`<b>Eteno</b> (ethene): un gas que <b>controla la maduración de los frutos</b>. La fruta se puede recoger verde, almacenar y transportar sin que madure; luego se usa eteno para madurarla en el destino. La maduración se retrasa eliminando el eteno durante el almacenamiento.`,`<b>Éthène</b> (ethene) : un gaz qui <b>contrôle la maturation des fruits</b>. Les fruits peuvent être cueillis verts, stockés et transportés sans mûrir, puis on utilise l'éthène pour les faire mûrir à destination. On peut ralentir la maturation en retirant l'éthène pendant le stockage.`,'HT']],

[[`Tissue culture`,`Cultivo de tejidos`,`Culture de tissus`],[`Auxin`,`Auxina`,`Auxine`],[`Cells grow into many new plants`,`Las células crecen y forman muchas plantas nuevas`,`Les cellules donnent de nombreuses nouvelles plantes`]],

qs:[

{t:'mcq',q:`(Higher Tier) Why is ethene used with fruit that is transported over long distances?`,o:[`To ripen the fruit at the destination`,`To make it grow`,`To end seed dormancy`,`To kill weeds`],a:0,e:[`Fruit is picked unripe and ethene is used to ripen it when it arrives, so it does not spoil on the way.`,`La fruta se recoge verde y se usa eteno para madurarla al llegar, así no se estropea en el camino.`,`Les fruits sont cueillis verts et l'éthène les fait mûrir à l'arrivée : ils ne s'abîment pas en route.`]},
{t:'tf',q:`(Higher Tier) Gibberellins can end seed dormancy.`,a:true,e:[`True. Gibberellins end dormancy so seeds germinate. They can also promote flowering and increase fruit size.`,`Verdadero. Las giberelinas terminan la latencia y las semillas germinan. También favorecen la floración y aumentan el tamaño del fruto.`,`Vrai. Les gibbérellines mettent fin à la dormance : les graines germent. Elles favorisent aussi la floraison et augmentent la taille des fruits.`]}
